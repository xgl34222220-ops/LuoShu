summary=洛书·重构版 2.0.0 正式版：字体覆盖中心、真实补齐、OEM 嵌套挂载与组合提交提速
notes=新增字体覆盖中心，可逐槽查看已替换、待验证、系统保护与异常状态，并支持一键安全补齐；刷写阶段与 App 统一字体槽位口径；补齐链路改为精确计划、完整安全回填、下一启动原子提交与一次重启收敛；修复 OEM 嵌套字体目录扫描到但未实际挂载、组合任务残留 PID 误报、兼容运行时软链接工作目录失败等问题；补齐任务增加实时进度与失败原因；优化组合补齐末段，重型 ROM 度量和补齐处理前移到 90–98%，99% 仅保留原子提交。下一正式版为 2.2.2。
