summary=洛书 3.0 正式主线：统一安全覆盖、测试基础设施、批处理性能与后台稳定性
notes=v3.0.0 汇总此前 2.x 主线的一轮完整底层重构：无 Hook 字体 XML family 覆盖边界进一步收紧并保留 ui-sans-serif/OEM sans/serif/Emoji/图标等安全保护；shell 与 Python 回归基础设施全面加固；字体 XML 捕获、生成、校验和动态目标发现改为批处理，源字体摘要加入安全记忆化与亚秒级失效保护；设备对齐缓存加入失败预算、stale lock 恢复与低优先级后台执行；Google Play/GMS 下载字体桥减少逐进程 fork，并保留 GMS/Vending 子进程命名空间覆盖。模块 versionCode 30000，App versionCode 3000001。
