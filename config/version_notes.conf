version=v2.5.2
summary=优化 MIUIx 界面层级并修复 Play/GMS provider 命名空间挂载
notes=v2.5.2 在 v2.5.1 字体基线、monospace 与事务回滚修复基础上，统一收口 MIUIx 圆角、卡片层级、字体库、设置中心、组合工具 Bottom Sheet、底栏与页面转场；同时修复 Play/GMS 下载字体 provider bridge 在目标 mount namespace 内直接使用 /proc/1/root foreign vfsmount 可能触发 EINVAL 的问题，改为普通路径优先、不可见时复制到目标 namespace staging 文件后再 bind，并加入挂载模式统计、错误聚合与回归测试。模块 versionCode 20502，App versionCode 2050201。
