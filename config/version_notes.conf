notes=v2.5.3 基于 v2.5.2 provider namespace 修复，针对录屏逐屏收口实际路由页面的图标尺寸、视觉重量与加载态：新增统一 Icon Tokens/Header Action，底栏图标固定 20dp 且选中态不再缩放，Header 统一 48dp/22dp，设置分类、字体库工具、组合工具、任务中心状态统一视觉槽，并统一 Home/Library/Studio/Logs 的 dock clearance，避免内容被悬浮底栏压住。模块 versionCode 20503，App versionCode 2050301。
