version=v2.3.5
summary=正式版：修复跨 ROM 字体挂载与验证误判，统一显示真实生效状态
notes=v2.3.5 正式版完成 Android 16、KernelSU、Magisk 与 APatch 的无元模块字体挂载收敛：覆盖旧版本遗漏的 OEM 分区，兼容 ROM 中缺失的跨设备别名，处理多个字体名共享同一真实文件的符号链接，并允许非核心附加组件在没有本机 bind 目标时安全跳过。严格自挂载仍要求 system/fonts 至少接管一个真实字体且全部必需文件在 PID 1 根命名空间可见；验证通过后记录 verified + mount-verified，不再把已经实际显示的字体误报为“待验证”。模块 versionCode 20307，App versionCode 2030701。
