summary=精修字体库卡片、统一 Aa12 预览并升级字体详情预览
notes=v2.5.4 基于 v2.5.3 的统一图标体系继续打磨实际字体库：所有字体卡与系统默认行统一 Aa12 预览契约，有效字体使用真实字体渲染，异常 fallback 不再退回 Aa；字体卡重整名称、文件元信息、字重/覆盖标签与应用状态，压低管理器感；详情由 AlertDialog 升级为大尺寸 ModalBottomSheet，加入综合、中文、English、数字四类真实字体预览，内部技术元数据默认折叠。字体引擎、provider bridge、挂载、事务回滚和组合算法不变。模块 versionCode 20504，App versionCode 2050401。
