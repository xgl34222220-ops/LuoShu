version=v2.3.4 Alpha4
summary=修复 OEM 字体符号链接共享真实目标时 bind 相互覆盖并触发可见性回滚
notes=v2.3.4 Alpha4 修复 Alpha3 真机诊断确认的 system/fonts-visibility-mismatch：Android 16 与部分 OEM ROM 会让多个字体文件名通过符号链接共享同一真实字体目标，逐文件 bind 若按别名重复挂载，会让后一个别名覆盖前一个挂载并导致内容校验失败。Alpha4 在 bind 与验证阶段都解析并去重真实目标，优先处理 ROM 中的真实文件，再处理没有对应真实负载名的符号链接；每个组件仍必须至少接管一个真实目标，实际 bind 或可见性失败仍全量回滚。模块 versionCode 20304，App versionCode 2030401。
