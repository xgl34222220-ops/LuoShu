version=v2.10.0
summary=收敛后台字体缓存重试与 provider PID 扫描，降低开机和切换后的持续 CPU 负载
notes=v2.10.0 在 v2.9.0 基础上继续优化无 Hook 字体运行时的后台稳定性：设备对齐缓存加入连续失败预算并统一低优先级执行，避免不可满足的缓存任务在每次开机反复高负载重跑；陈旧 cache lock 在启动入口即可安全回收，避免重启/OOM 后永久卡住后台任务；Google 下载字体桥将逐进程 /proc fork 扫描改为 pidof 与单次 /proc 合并扫描，同时保留 com.google.android.gms:*、Vending 子进程与 zygote 命名空间覆盖；provider PID 列表在同一轮 apply/restore 中复用，并补充失败预算、stale/live lock 与 PID 扫描回归。模块 versionCode 21000，App versionCode 2100001。
