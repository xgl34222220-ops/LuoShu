version=v3.3.1
summary=洛书 3.3.1 热修：修复 KSU/SukiSU/APatch 自挂载入口漏打包，并恢复真正 quick 切换
notes=v3.3.1 修复 v3.3.0 正式 ZIP 未包含 post-mount.sh 的发布打包错误。KernelSU、SukiSU、APatch 会在 post-fs-data 阶段等待 post-mount 再执行洛书自挂载，因此缺失该脚本会导致挂载异常。新版将 post-mount.sh 纳入显式 payload，并在 check/build 阶段强制校验最终 ZIP 必须包含该挂载入口；同时 quick 模式不再扫描和构建多字重族，避免前台切换执行 full 模式重活。模块 versionCode 30301，App versionCode 3030101。
