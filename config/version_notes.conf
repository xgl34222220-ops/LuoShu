version=v2.2.5
summary=强化元模块逐分区挂载验证并修复 MIUIx 页面遮挡与验收提示
notes=v2.2.5 在 v2.2.4 基础上完善 meta-overlayfs、Hybrid Mount、Mountify 与 Magic Mount 兼容：只识别实际启用的挂载后端，按 system、vendor、product、system_ext、odm、oem 及设备声明分区原子同步负载，使用有界总超时并在失败时保留旧树；开机逐分区探针必须全部通过后才写入 verified + aligned，失败会记录具体后端与分区。MIUIx 重构四项液态玻璃底栏、组合页标题栏与内容安全区、紧凑字体库和任务/问题/日志分栏，移除悬浮覆盖与旧 v2.2.2 门禁硬编码。模块 versionCode 20205，App versionCode 2020501。
