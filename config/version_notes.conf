notes=补回被 4.3.0 白名单误排除的 Mono、Display、Condensed、部分 VF 和 DroidSans 字体入口；修复 SemiCondensed 被误判为图标字体；同步扫描、生成与开机映射规则，并刷新旧 HyperOS 原厂清单。保留字体子集压缩、结果复用及 Google 字体维护。覆盖安装后先完整重启，再重新应用当前字体或组合，并按提示重启；无需删除或重新导入原字体。真机覆盖和重启稳定性待测试。模块版本代码 40301，App 4030101。
