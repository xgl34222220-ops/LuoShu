summary=洛书 3.3.9 真机验收候选：接入 Miuix 真液体玻璃底栏并保留一次切换完整字体修复
notes=v3.3.9 保留 3.3.8 的单次原子字体负载、HyperOS 中英数字完整槽位和前台快速切换；底栏不再用 Haze 模拟色块，而是接入 Miuix blur、shader 与 squircle。Android 13 及以上由页面背景取样、折射玻璃外壳和独立移动透镜三层组成，透镜带轻微色散、速度拉伸和弹性回弹，图标文字始终在着色器外保持清晰；Android 12 及以下使用背景独占的安全降级。尺寸按参考视频保持 14 dp 悬浮边距、52 dp 外壳和浅蓝选中透镜。模块 versionCode 30309，App versionCode 3030901。
