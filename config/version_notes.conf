version=v2.5.5
summary=修复字体详情弹层上下抽动并稳定详情滚动
notes=v2.5.5 基于 v2.5.4 的字体详情大尺寸 ModalBottomSheet 体验做稳定性修复：关闭 Bottom Sheet 自身纵向拖拽，避免与详情内部 verticalScroll 竞争手势；详情可视区域固定为屏幕可用高度的 94%，避免内容变化导致 Sheet anchor 反复重算；切换字体详情时内部滚动位置自动复位到顶部，并移除不可拖拽状态下的误导性拖拽条。字体引擎、provider bridge、挂载、事务回滚、字体应用和组合算法不变。模块 versionCode 20505，App versionCode 2050501。
