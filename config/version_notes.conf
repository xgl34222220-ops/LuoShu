version=v3.3.5
summary=洛书 3.3.5 顶栏尺寸修正版：缩小字体组合页刷新按钮并统一顶栏操作
notes=v3.3.5 不改动 v3.3.4 恢复的 v3.0.0 字体生成、覆盖和挂载运行时。字体组合页的工具与刷新操作改为同一共享组件，可见按钮由 48/56 dp 收紧为 36 dp，仍保留 48 dp 无障碍触控区；图标固定为 18 dp、统一主题色、圆角和低阴影，刷新不再出现黑色或尺寸突兀。Miuix 与 Material 字体组合标题统一为 30 sp。直接从 3.1–3.3 升级仍会清除旧问题 payload；从 v3.3.4 升级不会重复清除。模块 versionCode 30305，App versionCode 3030501。
