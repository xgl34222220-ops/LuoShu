notes=v2.3.0 将洛书真实字体负载迁移到 .luoshu-payload 私有目录，标准 system、product、vendor 等模块分区目录只保留空壳；洛书不再识别、配置、同步或依赖 Mountify、Hybrid Mount、Magic Mount、meta-overlayfs 等元模块，统一由自身完成字体挂载。KernelSU/SukiSU Ultra 在 post-mount 阶段自挂载，Magisk/APatch 在 post-fs-data 阶段完成挂载；保留设备原厂字体、Emoji、fallback 与事务回滚。安装、覆盖升级、重复挂载、卸载、设备字体可信度和最终 ZIP 已通过完整自动化检查。模块 versionCode 20300，App versionCode 2030001。
