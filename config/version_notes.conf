version=v2.9.0
summary=批处理字体配置链路并缓存源字体摘要，降低切换延迟与重复计算
notes=v2.9.0 在 v2.8.0 基础上重点优化无 Hook 字体运行时性能：字体 XML 捕获、生成、校验与动态目标发现改为批处理，显著减少手机端内置 Python 的重复冷启动；源字体 SHA-256 引入按文件身份记忆化，并使用亚秒级 mtime/ctime 防止同大小快速替换误命中旧摘要；同时统一 target/overlay family 判定并补充批处理异常隔离、摘要失效等 always-on 回归。模块 versionCode 20900，App versionCode 2090001。
