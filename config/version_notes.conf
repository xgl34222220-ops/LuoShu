version=v4.0.0
summary=洛书 4.0.0 真机验收候选：一次应用事务、HyperOS 全脚本覆盖与三层液体玻璃界面
notes=v4.0.0 将字体选择、设备槽位构建、动态 XML、自挂载与重启状态合并为一次前台原子事务；首次应用不再由后台缓存二次激活，旧 3.x 对齐缓存已隔离。HyperOS 按设备真实字体清单覆盖中文、Latin、数字、等宽、时钟、fallback 以及 OEM 分区，复合字形只变换一次并按原厂行框单独归一，避免英文数字漏换和字体上下偏移。直接切换复用验证与同源构建结果，任务锁使用启动身份与有限租约，避免重复点击竞态和遗留锁。界面移除旧页面退出帧，底栏采用背景取样、折射外壳、独立移动透镜与清晰内容层，外壳为 66 dp、项目为 54 dp；右上角操作保持一致可视尺寸，更新下载内容完整显示。模块 versionCode 40000，App versionCode 4000001。
