summary=洛书 3.3.4 运行时恢复版：回退到 v3.0.0 字体引擎，清除 3.1–3.3 的问题负载
notes=v3.3.4 不再继续叠加 3.3.x 热修复，而是完整恢复 v3.0.0 的字体实例化、九档字重、XML overlay、字体度量、HyperOS 槽位、自挂载与启动回滚运行时；移除 3.1 的变量字体实例缓存、3.2 的批处理和紧凑行框改造、3.3 的 HyperOS 覆盖下限与切换缓存层。升级时一次性清除由 3.1–3.3 生成的活动 payload，保留字体选择与组合偏好，首次开机使用系统字体，用户重新应用后由 v3.0 引擎生成干净负载。保留 3.3.3 的紧凑 App 界面与真实错误显示。模块 versionCode 30304，App versionCode 3030401。
