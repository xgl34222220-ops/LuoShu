version=v2.3.11
summary=统一同一系统内的中文、英文和 OEM UI 字体槽位，修复部分区域仍使用默认字体
notes=v2.3.11 保持 v2.3.8/v2.3.9 正式版 App UI 不变。参考成熟字体模块的“字体文件 + fontconfig + 系统 fallback”方案，不再把所有带 lang/variant 的 Android 字体族一律排除：variant=elegant/compact 的普通 UI 字体会正常替换；zh-Hans/zh-Hant 等中文 fallback 在源字体具备中文覆盖时纳入逐槽位生成；日文、韩文、阿拉伯文、Emoji、符号和源字体不支持的脚本继续使用系统 fallback。生成字体保留目标系统 family/PostScript 内部名称，修复应用按字体内部名称直取时回退默认字体；不同 family 不再错误复用同一个生成文件。包含 v2.3.10 的已生效字体误报修复。模块 versionCode 20311，App versionCode 2031101。
