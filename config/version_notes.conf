summary=洛书 3.2.3 KernelSU 热修：修复最终运行时覆盖原子挂载策略
notes=v3.2.3 修复 mount_compat.sh 最终加载的 font_runtime_mount.sh 以旧版同名函数覆盖已修正原子挂载策略、导致 Android 16 / KernelSU 仍因 system_ext/fonts-target-missing 回滚 system/fonts 的问题。自挂载现统一由 mount_self_atomic.sh 单一实现负责，并在调用时解析私有负载；真实生产加载链新增可选 system_ext/fonts 缺失回归，系统主字体树仍保持强制验证和失败完整回滚。模块 versionCode 30203，App versionCode 3020301。
