version=v2.3.3 Alpha3
summary=修复 Android 16 与 KernelSU 上字体 bind 回退误判不完整并全量回滚
notes=v2.3.3 Alpha3 修复 Alpha2 真机诊断确认的 system/fonts-bind-incomplete：当只读 OverlayFS 不可用而转为逐文件 bind 时，只把当前 ROM 中真实存在、可被替换的目标纳入原子事务，忽略仅为其他 ROM 准备且本机不存在的新增别名；每个组件仍必须至少接管一个真实文件，任意实际 bind 或可见性校验失败仍全量回滚。首页挂载引擎状态改为读取真实 self-mount 状态，不再因模块已安装就错误显示正常。模块 versionCode 20303，App versionCode 2030301。
