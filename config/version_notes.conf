version=v4.0.0
summary=洛书 4.0.0 正式版：一分钟内可靠提交复合字体、可信原厂扫描与 HyperOS 分槽度量
notes=v4.0.0 将字体选择、设备槽位构建、动态 XML、自挂载与重启状态合并为一次原子事务。复合字体配置与进度查询不再重复初始化运行时，修复卡 34%、连接读取中断和假失败；请求 ID、三路源字体哈希及成品哈希贯穿生成与下一启动提交，避免英文数字沿用上一次选择。原厂扫描在 self-mount 前冻结可信视图并以跨进程锁串行执行。HyperOS 按设备真实字体清单覆盖中文、Latin、数字、等宽、时钟、fallback 及 OEM 分区，每个物理槽保持自己的原厂度量合约，改善状态栏和第三方 App 上下偏移。模块 versionCode 40000，App versionCode 4000001。
