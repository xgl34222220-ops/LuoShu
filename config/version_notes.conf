version=v3.3.7
summary=洛书 3.3.7 单次切换与液态玻璃候选版：修复首启回默认、HyperOS 英数漏换和分钟级等待
notes=v3.3.7 将直接应用字体收敛为一次原子提交：不再查询、生成或安排会在成功后再次改写负载的设备对齐缓存；HyperOS 的 MiSans、Roboto/GoogleSans、100–900 数字字重、Mitype 与时钟槽统一映射到同一字体源。负载清单按 inode 去重校验，同一大字体无论存在多少硬链接别名都只读取一次；启动守卫按 bootId 区分同一开机的重复入口和真正的上次启动失败，修复第一次重启恢复默认、第二次才成功。Miuix 界面新增 32 dp 取样模糊、半透明高光玻璃底栏、弹性液态选中层、整页横向切换和右侧圆角详情转场；右上角操作继续保持 30 dp 可视容器与 48 dp 触控区。模块 versionCode 30307，App versionCode 3030701。
