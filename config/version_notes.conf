notes=新增可选全局字体增强（Zygisk，默认关闭）与 LSPosed 伴随模块补全，补全空白字形，WOFF/WOFF2/ZIP 导入，OTA 后自动恢复 XML 覆盖，KernelSU 软重启释放挂载，overlay 被拒时 loop 兜底，/data/fonts 补 fs-verity，OriginOS/Flyme 槽位与 ColorOS 字体槽兼容（默认关闭），umount 可见性诊断与应用提速。网页字体（Chrome）尚未覆盖。保持原签名及用户字体目录。完整真机矩阵仍待验证，不承诺所有 App 全覆盖或手机切换耗时。
