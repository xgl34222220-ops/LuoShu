version=v2.4.1 Beta 1
summary=强化字体切换身份锁，重点验证并发与残锁恢复稳定性
notes=v2.4.1 Beta 1 保持 v2.4.0 的字体引擎、App UI 与 Play/GMS 字体链路不变，集中加固字体切换并发锁。锁身份由单独 PID 升级为 PID + 进程 starttime + boot_id，避免 PID 被系统复用后把旧锁误判成仍在运行；保留旧版 PID-only 锁兼容，补充锁初始化竞争保护、身份校验释放和 stale lock 回收，并扩充并发、异常退出、PID 复用与重启残锁回归测试。模块 versionCode 20401，App versionCode 2040101。
