version=v2.3.6
summary=正式版：修复重启后字体任务复活与高 CPU，取消开机自动深度验证
notes=v2.3.6 正式版修复后台字体任务在重启后被重新拉起、PID 跨启动周期误判以及大型字体规划和加载验证造成持续 CPU 占用的问题。字体库指纹查询恢复为纯读取，槽位规划改为显式任务并加入 bootId、超时、低优先级和陈旧锁恢复；字体切换与 App 观察窗口统一延长并增加心跳状态。正常开机不再自动遍历、哈希完整字体树或启动 Python 深度验证，而是根据已确认的字体事务与自挂载状态直接记录生效；原深度验证保留为手动诊断命令。模块 versionCode 20306，App versionCode 2030601。
