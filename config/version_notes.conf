version=v3.3.3
summary=洛书 3.3.3 正式修复版：修复 KernelSU 可选字体分区误回滚，并全面收紧界面密度
notes=v3.3.3 修复 KernelSU 等环境下 system_ext、product 等可选字体目录不存在时被误判为致命错误、导致字体事务回滚和切换失败的问题；仅 system/fonts 保持必需，其余缺失分区或目标安全跳过。状态页与任务中心现在会显示真实失败目标，不再只留下 mount-active-visible-layout-differs。首页、字体库、任务中心、设置页与底部导航统一缩小标题、卡片、图标、间距和按钮，恢复更紧凑的信息密度。模块 versionCode 30303，App versionCode 3030301。
