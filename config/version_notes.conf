version=v3.3.6
summary=洛书 3.3.6 字体切换性能修正版：恢复前台快路径并按字体缓存覆盖校验
notes=v3.3.6 修复直接应用字体时在前台重新扫描多分区 XML、准备九档字重并启动嵌入式 Python，导致切换明显慢于旧版的问题。直接切换现在只执行真实字体槽位硬链接映射、安全事务、负载校验和提交；已有设备对齐缓存可立即激活，未命中时仅写入后台任务，不再阻塞 App。字形覆盖校验升级为按字体文件身份保存 CJK/Latin 能力，切回已验证且未变化的字体不再重复扫描。保留事务回滚、重启门禁、完整设备对齐后台增强和 v3.3.5 紧凑顶栏。模块 versionCode 30306，App versionCode 3030601。
