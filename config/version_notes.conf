version=v2.3.7
summary=预发行：修复 APatch 安装提交、常驻轮询与本次启动状态误导
notes=v2.3.7 预发行版包含 v2.3.6 之后的本次启动字体激活证据修复，并针对 APatch 以 source 方式执行安装脚本时父安装器被提前退出的问题改为安全返回。App 与字体导入前台服务改为状态变化驱动，不再每 250ms 常驻轮询，服务不再粘性重启；高刷新率默认跟随系统，主动开启后仍会在省电模式下停用。首页与设备可信状态统一区分已准备、等待完整重启、本次启动已验证及具体失败原因。发布工作流固定校验 v2.3.6 正式证书、单 signer，并阻断没有 ColorOS、HyperOS、Magisk、APatch 真机证据的稳定发布。模块 versionCode 20307，App versionCode 2030701。
