version=v3.3.0
summary=洛书 3.3 正式版：恢复 HyperOS v2.8.0 覆盖下限、修复 partial 假成功，并显著加快字体切换与应用
notes=v3.3.0 基于 v3.2.0 稳定基线继续完善 HyperOS 与切换性能：HyperOS 动态目标扫描与 v2.8.0 逐 XML 结果取并集，任何 2.8.0 能覆盖的真实字体槽都不允许在新版退化；partial 覆盖不再当作成功；保留 v3.2.0 的 --compact 行框、九档字重、事务回滚、负载校验与自挂载链路。字体切换去除同一直接应用流程中重复执行完整 font_config_enable_for_payload 的问题，并对 HyperOS v2.8 兼容目标扫描按 ROM XML 内容和扫描器内容做持久缓存，减少重复 Python 冷启动。Material 与 MIUIX 字体组合页顶部操作统一为 56dp 容器 + 22dp 图标。模块 versionCode 30300，App versionCode 3030001。
