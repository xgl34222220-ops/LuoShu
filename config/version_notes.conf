version=v2.3.12
summary=修复 Play 商店输入框与 GMS 页面仍使用默认 Google Sans
notes=v2.3.12 保持 v2.3.8/v2.3.9 正式版 App UI 不变。在 v2.3.11 系统/OEM 字体槽位基础上，补齐 Play 商店和 GMS 直接读取下载字体文件的独立链路：扫描 GMS、Play 与 Android 字体更新缓存中的 Google Sans，按目标字重生成保留原 Family/PostScript 身份的洛书字体副本，并在 zygote、GMS 与 Play 各自挂载命名空间中只读 bind，不改写 provider 原文件。恢复 HyperOS 过去可生效的 Play 输入框入口，并扩展 ColorOS 多用户/凭据加密目录与命名空间适配。模块 versionCode 20312，App versionCode 2031201。
