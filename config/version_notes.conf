version=v4.0.1
summary=洛书 4.0.1 紧急启动安全修复：跨架构旧字体负载不再继承
notes=v4.0.1 修复 4.0.0 回退/升级后仍可能继承旧 schema 字体负载的问题。只有与当前引擎 schema 完全一致的 payload 才允许继续使用；不一致时会在安装阶段清除 system 字体负载、OEM 分区树、旧 manifest/schema/boot/device cache，首次以 ROM 原厂字体安全启动，同时保留用户已选择字体和复合字体配置，进入洛书后明确应用一次即可按当前引擎重建。新增 v10 到 v9 的 system/product/vendor/odm/oem 跨架构回归测试，防止 ColorOS 无限重启和 HyperOS 卡二屏再次出现。模块 versionCode 40001，App versionCode 4000101。
