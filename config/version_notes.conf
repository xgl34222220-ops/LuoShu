version=v2.3.5 Alpha5
summary=修复字体已挂载后被无本机目标的 system/etc 附加组件误判失败并回滚
notes=v2.3.5 Alpha5 修复 Alpha4 真机诊断确认的 system/etc-bind-incomplete：兼容 bind 只能替换 ROM 已存在的文件，而 system/etc 负载可能仅包含挂载探针和动态配置等本机原目录不存在的附加文件。Alpha5 区分实际 bind 失败与零兼容目标；非核心附加组件没有可替换目标时安全跳过，不再回滚已验证的字体挂载。system/fonts 仍必须至少接管一个真实字体文件，任意实际 bind、记录或可见性失败仍全量回滚。模块 versionCode 20305，App versionCode 2030501。
