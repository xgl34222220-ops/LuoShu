notes=v2.8.0 在 v2.7.0 基础上继续加强无 Hook 字体 XML family 安全覆盖，扩展 OEM sans / serif 识别并保留 ui-sans-serif 回归保护；同时新增显式 shell 断言、duplicate-function guard，并扩大 ColorOS、HyperOS、runtime policy、transaction、cache、mount 与字体导入等 always-on 回归覆盖。字体导入兼容更多样式后缀组合，测试夹具同步修正。模块 versionCode 20800，App versionCode 2080001。
