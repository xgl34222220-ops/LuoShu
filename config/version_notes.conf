version=v2.3.10
summary=紧急修复：字体已经生效却被误判失败并恢复默认字体
notes=v2.3.10 保持 v2.3.8/v2.3.9 正式版 App UI 不变。验证器优先读取私有 .luoshu-payload，不再把公开兼容目录的空视图或旧视图当作真实字体源；系统可见字体文件完全一致仍作为强证据，但 KernelSU、metamodule 或 Android 字体服务造成的路径、inode 与文件布局差异不再直接判定失败；PID 1 挂载可见或挂载事务已提交且私有字体负载存在时确认字体已应用；只有自挂载明确失败且没有更强可见证据时才显示失败，避免已生效字体被标红、连续计数并错误恢复为系统默认字体。模块 versionCode 20310，App versionCode 2031001。
