version=v2.3.1 Alpha1
summary=修复无元模块环境下的开机自挂载半成功、乱码与重启恢复默认字体
notes=v2.3.1 Alpha1 将字体文件与字体配置改为原子自挂载事务：system、product、my_product、oplus_product 等实际负载分区必须全部挂载并通过 PID 1 主命名空间验证，任意 fonts 或 etc 组件失败都会逆序解除本轮挂载并安全恢复 ROM 字体，不再保留 degraded 半成功状态。修复逐文件 bind 只成功一部分仍被判定成功、旧启动挂载记录误卸载、KernelSU/SukiSU 执行阶段识别以及重启后仍提示字体成功的问题。模块 versionCode 20301，App versionCode 2030101。
