version=v3.3.8
summary=洛书 3.3.8 真机验收候选：一次切换覆盖 HyperOS 中英数字，并按参考视频修复液态玻璃界面
notes=v3.3.8 将物理字体槽、LuoShu 字重别名与系统字体 XML 写入同一个私有原子负载，修复任务成功但首次重启挂载到另一目录而恢复默认的问题；首次生成轻量 XML，后续切换仅重指向硬链接，不启动 Python、不生成九份字体、不安排后台二次改写。HyperOS 映射覆盖设备实际存在的 MiSans、MiSansLatin、Roboto、GoogleSans、Mitype、数字字重、时钟与 mi_ext 字体槽，解决外部 App 只换中文而英文数字仍为默认字体。Miuix 底栏改为 52 dp 单层透明取样底板与独立弹性透镜，模糊只作用于背景以消除文字后的白色合成块；右上角按钮为 40 dp 可视面与 48 dp 触控区，下载按钮增高到 64 dp 并完整显示 SHA-256。模块 versionCode 30308，App versionCode 3030801。
