version=v3.3.0
summary=洛书 3.3 正式版：恢复 HyperOS 2.8 覆盖下限、修复部分应用字体漏覆盖，并显著加快字体切换与应用速度
notes=v3.3.0 基于 v3.2.0 重点修复 HyperOS 覆盖回归与前台切换性能：HyperOS 保留 3.x batch 快速扫描，同时恢复 v2.8 逐 XML 动态目标扫描作为覆盖下限，并与 batch 结果取并集；最终若仍为 partial 会直接失败，不再把不完整覆盖当成功。字体切换流程去除同一次直接应用中重复执行完整 font_config_enable_for_payload 的问题，HyperOS v2.8 兼容扫描按 XML 内容与扫描器内容安全缓存，ROM XML 未变化时后续切换不再重复启动内置 Python。字体组合页顶部操作按钮统一为 56dp 容器与 22dp 图标，Material 与 MIUIX 的操作区尺寸保持一致。继续保留 v3.2.0 的紧凑行框、九档字重、事务回滚、负载校验和挂载校验。模块 versionCode 30300，App versionCode 3030001。
