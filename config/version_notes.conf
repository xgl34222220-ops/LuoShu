notes=v2.4.0 保持 v2.3.8/v2.3.9 正式版 App UI 不变。修复字体已经生效却被误报失败的问题；重做 Android 系统、OEM 与中文/英文 fallback 槽位覆盖，保留目标 ROM 的 Family/PostScript 内部身份；补齐 Play 商店和 GMS 直接读取下载版 Google Sans 的独立链路，扫描 GMS、Play 与 Android 字体更新缓存，按目标字重生成身份兼容副本，并在 zygote、GMS 与 Play 各自挂载命名空间中执行只读 bind，不改写 provider 原文件。模块 versionCode 20400，App versionCode 2040001。
