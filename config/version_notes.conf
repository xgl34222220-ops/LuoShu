version=v2.3.2 Alpha2
summary=修复预发行版重启后仍为默认字体、OEM 升级负载丢失和 APatch 挂载阶段错误
notes=v2.3.2 Alpha2 在 Alpha1 原子自挂载基础上补齐实际生效链路：覆盖升级会迁移 OPlus、ColorOS、HyperOS 及其他全部受支持 OEM 分区，APatch 改在 OverlayFS 完成后的 post-mount 阶段执行，避免阻塞 post-fs-data 中过早挂载。App 现在区分用户已配置字体与系统实际生效字体，自挂载或开机验证失败时明确显示系统默认字体和失败原因，不再把任务生成成功描述为字体已生效。同步修复重复挂载测试读取 /mounts.list 后仍假通过、补齐专项工作流触发路径，并使预发布门禁自动跟随当前版本。模块 versionCode 20302，App versionCode 2030201。
