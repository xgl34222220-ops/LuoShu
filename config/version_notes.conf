version=v3.2.4
summary=洛书 3.2.4 紧急修复：阻止 ColorOS/OPlus 字体树二次 OverlayFS 并恢复快速切换
notes=v3.2.4 针对 v3.2.3 在一加 15 / ColorOS 16 出现的黑屏无限重启与字体切换显著变慢问题。OPlus 系设备的核心 /system/fonts 不再叠加整目录 OverlayFS，而是使用仅覆盖本机真实存在文件槽的逐文件 bind；若当前洛书系统挂载探针已经可见，则禁止再次叠加 /system/fonts。字体切换新增 100-900 UI 与等宽共 18 个生成文件的输入/引擎身份缓存，不变输入直接复用，字体或处理引擎变化时自动失效重建。模块 versionCode 30204，App versionCode 3020401。
