name: Repair compact UI compile once

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.head_ref == 'ui-video-accurate-rebuild'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Repair Kotlin compile errors and self-delete
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          components = Path('android-app/app/src/main/java/io/github/xgl34222220/luoshu/ui/design/LuoShuComponents.kt')
          text = components.read_text(encoding='utf-8')
          text = text.replace('import androidx.compose.foundation.layout.weight\n', '')
          components.write_text(text, encoding='utf-8')

          home = Path('android-app/app/src/main/java/io/github/xgl34222220/luoshu/ui/home/HomeScreenCompact.kt')
          text = home.read_text(encoding='utf-8')
          marker = '@Composable\nprivate fun NextStepCard(next: HomeNextStep) {'
          definition = '''private data class HomeNextStep(\n    val title: String,\n    val description: String,\n    val actionLabel: String,\n    val icon: ImageVector,\n    val onClick: () -> Unit,\n    val enabled: Boolean = true,\n)\n\n'''
          if 'private data class HomeNextStep' not in text:
              if marker not in text:
                  raise SystemExit('NextStepCard marker not found')
              text = text.replace(marker, definition + marker, 1)
          home.write_text(text, encoding='utf-8')
          PY
          rm -f .github/workflows/apply-video-accurate-ui-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: repair compact UI Kotlin compilation'
          git push origin HEAD:${GITHUB_HEAD_REF}
