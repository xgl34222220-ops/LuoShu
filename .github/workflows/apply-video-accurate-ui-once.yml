name: Apply video-accurate compact UI once

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'ui-video-accurate-rebuild'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Verify, apply and commit compact UI
        shell: bash
        run: |
          set -euo pipefail
          cat .github/video-ui-part-?? > /tmp/video-ui.patch.gz.b64
          test "$(wc -c < /tmp/video-ui.patch.gz.b64)" -eq 28052
          echo '5b6219fc02517b71554efb6b4e446a7c7125e86e5ca40517c87ae682d64e0f5a  /tmp/video-ui.patch.gz.b64' | sha256sum -c -
          base64 -d /tmp/video-ui.patch.gz.b64 | gzip -dc > /tmp/video-ui.patch
          patch -p1 --forward < /tmp/video-ui.patch
          sh -n scripts/font_library_ui_layout_test.sh
          sh scripts/font_library_ui_layout_test.sh
          rm -f .github/video-ui-part-?? .github/workflows/apply-video-accurate-ui-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'refactor: rebuild compact UI from reference video'
          git push origin HEAD:${GITHUB_HEAD_REF}
