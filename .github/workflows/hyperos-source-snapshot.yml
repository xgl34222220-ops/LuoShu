name: Capture HyperOS test source
on:
  push:
    branches: [fix/hyperos-latin-digit-20260928]
    paths: [.github/workflows/hyperos-source-snapshot.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: |
          mkdir -p verification
          git rev-parse HEAD > verification/commit.txt
          git archive --format=zip HEAD > verification/HyperOS-current-source.zip
      - uses: actions/upload-artifact@v4
        with:
          name: HyperOS-current-source
          path: verification/
          retention-days: 7
