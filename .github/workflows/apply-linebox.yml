name: Apply reviewed HyperOS line-box patch

on:
  push:
    branches:
      - agent/latest-patch-ready
    paths:
      - '.github/workflows/apply-linebox.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/latest-patch-ready

      - name: Install targeted test dependency
        run: python3 -m pip install --disable-pip-version-check fonttools

      - name: Reconstruct and verify line-box patch
        shell: bash
        run: |
          set -euo pipefail
          cat .tmp/linebox/gz00.b64 .tmp/linebox/gz01.b64 > /tmp/linebox.patch.gz.b64
          base64 --decode /tmp/linebox.patch.gz.b64 > /tmp/linebox.patch.gz
          echo '0f851e8f578b0e400850f5deda586cf4139127927d2f4f3ee52391aee107c889  /tmp/linebox.patch.gz' | sha256sum -c -
          gzip -dc /tmp/linebox.patch.gz > /tmp/linebox.patch
          echo 'a67d28e0b7a0ff3e0e8a37703ad422f4d5f5530ee18f6087cb408e31740c45f2  /tmp/linebox.patch' | sha256sum -c -
          git apply --check /tmp/linebox.patch
          git apply /tmp/linebox.patch

      - name: Harden compact metrics regression
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/compact_metrics_clipping_test.py')
          text = path.read_text(encoding='utf-8')
          old = '''ROOT = Path(__file__).resolve().parent.parent\nsys.path.insert(0, str(ROOT / "common"))\n'''
          new = '''ROOT = Path(__file__).resolve().parent.parent\nsys.path.insert(0, str(ROOT / "common"))\nEMBEDDED_SITE = ROOT / "common/python/lib/python3.14/site-packages"\nif EMBEDDED_SITE.is_dir():\n    sys.path.insert(0, str(EMBEDDED_SITE))\n'''
          if old not in text:
              raise SystemExit('compact test import anchor not found')
          text = text.replace(old, new, 1)
          old_main = '''def main() -> int:\n    with tempfile.TemporaryDirectory() as tmp:\n'''
          new_main = '''def main() -> int:\n    hyperos = (ROOT / "common/hyperos_global.sh").read_text(encoding="utf-8")\n    assert "--compact" in hyperos, "HyperOS 物理槽必须调用正式 --compact 模式"\n    assert "_outline_extremes = lambda font: None" not in hyperos, "旧 monkey-patch 不得回归"\n\n    with tempfile.TemporaryDirectory() as tmp:\n'''
          if old_main not in text:
              raise SystemExit('compact test main anchor not found')
          path.write_text(text.replace(old_main, new_main, 1), encoding='utf-8')
          PY

      - name: Run targeted regressions
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile common/font_metrics_normalize.py scripts/compact_metrics_clipping_test.py
          sh -n common/hyperos_global.sh scripts/check.sh
          python3 scripts/compact_metrics_clipping_test.py
          sh scripts/hyperos_global_mapping_test.sh
          grep -q -- '--compact' common/hyperos_global.sh
          ! grep -q '_outline_extremes = lambda font: None' common/hyperos_global.sh

      - name: Publish reviewed line-box change
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'LuoShu CI'
          git config user.email 'actions@users.noreply.github.com'
          rm -rf .tmp/linebox .github/workflows/apply-linebox.yml
          git add -A
          git commit -m 'fix: prevent HyperOS compact line-box clipping'
          git push origin HEAD:agent/latest-patch-ready
