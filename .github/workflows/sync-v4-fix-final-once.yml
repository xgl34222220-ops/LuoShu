name: Sync final v4.0.0 fix with main
on:
  push:
    branches: [ fix/v4.0.0-usable-release ]
    paths: [ .github/workflows/sync-v4-fix-final-once.yml ]
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v4.0.0-usable-release
          fetch-depth: 0
      - run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git merge --no-edit origin/main
          git push origin HEAD:fix/v4.0.0-usable-release
