name: Replace v4.0.0 once

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/replace-v4.0.0-once.yml

permissions:
  contents: write
  actions: write

concurrency:
  group: luoshu-replace-v4.0.0-once
  cancel-in-progress: false

jobs:
  replace:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: v4.0.0
      EXPECTED_OLD_TAG_SHA: 64eb1adf16f4e3fbf84e3d224b269b45ff419512
      REPLACEMENT_TAG_SHA: 227bca1bb34a18a738c5c9a0f8a338f3880aa2a0
      REQUIRED_FIX_SHA: dfdc8e13400d0a2bbd850e4643e6913cd7f8c085
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure replacement tag and dispatch signed publish exactly once
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version=//p' module.prop | head -n1)"
          version_code="$(sed -n 's/^versionCode=//p' module.prop | head -n1)"
          [[ "$version" == 'v4.0.0' && "$version_code" == '40000' ]] || {
            echo "Refusing replacement: main is $version/$version_code" >&2
            exit 2
          }

          git merge-base --is-ancestor "$REQUIRED_FIX_SHA" "$REPLACEMENT_TAG_SHA" || {
            echo "Refusing publish: required #201 fix is not in replacement tag" >&2
            exit 2
          }

          git fetch --force --tags origin
          current="$(git rev-list -n1 "$TAG" 2>/dev/null || true)"

          if [[ "$current" == "$EXPECTED_OLD_TAG_SHA" ]]; then
            gh release view "$TAG" >/dev/null
            gh release delete "$TAG" --cleanup-tag --yes
            git fetch --prune --tags origin
            [[ -z "$(git rev-list -n1 "$TAG" 2>/dev/null || true)" ]] || {
              echo "Old tag still exists after release deletion" >&2
              exit 3
            }
            git tag "$TAG" "$REPLACEMENT_TAG_SHA"
            git push origin "refs/tags/$TAG"
            current="$REPLACEMENT_TAG_SHA"
          fi

          [[ "$current" == "$REPLACEMENT_TAG_SHA" ]] || {
            echo "Refusing publish dispatch: $TAG points to unexpected $current" >&2
            exit 2
          }

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "$TAG release already exists; replacement is complete."
            exit 0
          fi

          gh workflow run release.yml --ref "$TAG" -f tag="$TAG" -f prerelease=false
          echo "Dispatched signed release workflow from $TAG at $current."
