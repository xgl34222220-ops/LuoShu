name: Replace v4.0.0 once

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/replace-v4.0.0-once.yml

permissions:
  contents: write
  actions: write

concurrency:
  group: luoshu-replace-v4.0.0-once
  cancel-in-progress: false

jobs:
  replace:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: v4.0.0
      EXPECTED_OLD_TAG_SHA: 59e120a76152ba9ee21cf7d441d738df030fd21d
      REQUIRED_RUNTIME_FIX_SHA: dfdc8e13400d0a2bbd850e4643e6913cd7f8c085
      REQUIRED_DUPLICATE_GUARD_FIX_SHA: c07a1d9e7b12a7ea7d401df77f0bd95daf0fa9f8
      REQUIRED_STABILITY_FIX_SHA: c88a7a9ddb7da776fde210e8914ce2b237306429
      REQUIRED_FULL_CHECK_SHA: a801ddff6c27cf180ec2eacb3b01f8f0dc4462c5
      REQUIRED_DEVICE_REGRESSION_FIX_SHA: 4d1c9a0ea320e4bbb558717ce5e58156a9998e6f
      REQUIRED_POLICY_TEST_FIX_SHA: 8933b272df99480db3a0fb301044dde8200be78c
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace tag with verified v4.0.0 source and dispatch signed publish
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version=//p' module.prop | head -n1)"
          version_code="$(sed -n 's/^versionCode=//p' module.prop | head -n1)"
          [[ "$version" == 'v4.0.0' && "$version_code" == '40000' ]] || {
            echo "Refusing replacement: main is $version/$version_code" >&2
            exit 2
          }

          for required in \
            "$REQUIRED_RUNTIME_FIX_SHA" \
            "$REQUIRED_DUPLICATE_GUARD_FIX_SHA" \
            "$REQUIRED_STABILITY_FIX_SHA" \
            "$REQUIRED_FULL_CHECK_SHA" \
            "$REQUIRED_DEVICE_REGRESSION_FIX_SHA" \
            "$REQUIRED_POLICY_TEST_FIX_SHA"; do
            git merge-base --is-ancestor "$required" "$GITHUB_SHA" || {
              echo "Refusing replacement: required verified fix $required is missing" >&2
              exit 2
            }
          done

          git fetch --force --tags origin
          current="$(git rev-list -n1 "$TAG" 2>/dev/null || true)"
          if [[ "$current" == "$GITHUB_SHA" ]]; then
            echo "$TAG already points to this verified commit."
          else
            if [[ -n "$current" ]]; then
              [[ "$current" == "$EXPECTED_OLD_TAG_SHA" ]] || {
                echo "Refusing replacement: $TAG points to unexpected $current" >&2
                exit 2
              }
              if gh release view "$TAG" >/dev/null 2>&1; then
                gh release delete "$TAG" --cleanup-tag --yes
              else
                git push origin ":refs/tags/$TAG"
              fi
            fi

            git tag -d "$TAG" >/dev/null 2>&1 || true
            git fetch --prune --prune-tags origin
            remote_tag="$(git ls-remote --tags origin "refs/tags/$TAG" | awk '{print $1}')"
            [[ -z "$remote_tag" ]] || {
              echo "Old remote tag still exists after cleanup: $remote_tag" >&2
              exit 3
            }

            git tag "$TAG" "$GITHUB_SHA"
            git push origin "refs/tags/$TAG"
          fi

          gh workflow run release.yml --ref "$TAG" -f tag="$TAG" -f prerelease=false
          echo "Dispatched signed release workflow from $TAG at $GITHUB_SHA."
