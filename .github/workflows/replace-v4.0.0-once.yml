name: Replace v4.0.0 once

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/replace-v4.0.0-once.yml

permissions:
  contents: write
  actions: write

concurrency:
  group: luoshu-replace-v4.0.0-once
  cancel-in-progress: false

jobs:
  replace:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: v4.0.0
      EXPECTED_OLD_TAG_SHA: c7cd5aa02a0ac7c68a2cdf3450fae71af7c7ae4f
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure stock scan App bridge route
        id: source
        shell: bash
        run: |
          set -euo pipefail
          if ! grep -q '^    stock_scan)' common/app_bridge.sh; then
            python3 - <<'PY'
          from pathlib import Path

          path = Path('common/app_bridge.sh')
          text = path.read_text(encoding='utf-8')
          needle = '    validate) manager_ready || exit 1; sh "$FONT_MANAGER" action validate "${2:-}" ;;\n    switch_start)'
          replacement = '    validate) manager_ready || exit 1; sh "$FONT_MANAGER" action validate "${2:-}" ;;\n    stock_scan) manager_ready || exit 1; sh "$FONT_MANAGER" action stock_scan ;;\n    switch_start)'
          if needle not in text:
              raise SystemExit('stock_scan bridge insertion anchor is missing')
          path.write_text(text.replace(needle, replacement, 1), encoding='utf-8')
          PY
            sh -n common/app_bridge.sh
            grep -q '^    stock_scan)' common/app_bridge.sh
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add common/app_bridge.sh
            git commit -m 'fix: route stock font scan through App bridge'
            git push origin HEAD:main
          fi
          source_sha="$(git rev-parse HEAD)"
          echo "sha=$source_sha" >> "$GITHUB_OUTPUT"
          echo "Replacement source: $source_sha"

      - name: Verify repaired v4.0.0 source and real boot mount entry
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version=//p' module.prop | head -n1)"
          version_code="$(sed -n 's/^versionCode=//p' module.prop | head -n1)"
          [[ "$version" == 'v4.0.0' && "$version_code" == '40000' ]] || {
            echo "Refusing replacement: source is $version/$version_code" >&2
            exit 2
          }

          test -s RELEASE_NOTES_v4.0.0.md
          test -s common/stock_inventory_scan.py
          grep -q 'LUOSHU_REAL_MODDIR' common/legacy_v14_4/font_switch_safe.sh
          grep -q '\.luoshu-mix-stage' common/legacy_v14_4/mix_router.sh
          grep -q 'mix_clone_source' common/legacy_v14_4/mix_router.sh
          grep -q 'clone_mix_tree' common/legacy_v14_4/mix_router.sh
          grep -q 'cp -R "$_source/\." "$MIX_STAGE/"' common/legacy_v14_4/mix_router.sh
          grep -q 'cp -rf "$_source/\." "$MIX_STAGE/"' common/legacy_v14_4/mix_router.sh
          grep -q 'hyperos_stage_complete.sh' common/legacy_v14_4/font_switch_safe.sh
          grep -q '^    stock_scan)' common/app_bridge.sh
          grep -qx 'common/stock_inventory_scan.py' scripts/module_payload_manifest.txt

          # Emergency regression rollback: PR #214 inserted expensive per-slot metric
          # generation into the foreground/next-boot switch path. Real HyperOS testing
          # showed that it did not solve the offset and regressed font switching. Keep
          # those helpers out of the shipping switch path until separately device-tested.
          test ! -e common/legacy_v14_4/hyperos_metric_stage.sh
          test ! -e common/legacy_v14_4/hyperos_metric_align.py
          ! grep -q 'hyperos_metric_stage.sh' common/hyperos_stage_complete.sh
          ! grep -q 'luoshu_hyperos_stage_metric_anchor' common/hyperos_stage_complete.sh
          sh scripts/hyperos_global_mapping_test.sh

          # Critical regression: the broken v4.0.0 generated a payload and wrote
          # success state, but legacy boot routers sourced only mount_self_backend.sh.
          # That file does NOT define luoshu_private_self_mount_ensure, so the real
          # mount was silently skipped. Refuse release unless both boot stages load
          # mount_compat.sh and the actual private self-mount entry is defined.
          grep -q 'common/mount_compat.sh' post-fs-data.sh
          grep -q 'common/mount_compat.sh' post-mount.sh
          grep -q 'runtime-loader-missing' post-fs-data.sh
          grep -q 'runtime-loader-missing' post-mount.sh
          MODDIR="$PWD" MODULE_DIR="$PWD" sh -c '. "$1"; type luoshu_private_self_mount_ensure >/dev/null 2>&1' sh common/mount_compat.sh
          sh scripts/legacy_switch_core_test.sh

      - name: Remove broken v4.0.0 and retag repaired source
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force --tags origin
          git fetch origin main
          main_sha="$(git rev-parse origin/main)"
          [[ "$main_sha" == "$SOURCE_SHA" ]] || {
            echo "Refusing replacement: main moved to $main_sha after source $SOURCE_SHA was prepared" >&2
            exit 2
          }

          current="$(git rev-list -n1 "$TAG" 2>/dev/null || true)"
          if [[ "$current" == "$SOURCE_SHA" ]]; then
            echo "$TAG already points to repaired source $SOURCE_SHA."
          else
            [[ "$current" == "$EXPECTED_OLD_TAG_SHA" ]] || {
              echo "Refusing replacement: $TAG points to unexpected ${current:-<missing>}" >&2
              exit 2
            }
            gh release view "$TAG" >/dev/null 2>&1 || {
              echo "Refusing replacement: existing GitHub Release $TAG is missing" >&2
              exit 2
            }

            gh release delete "$TAG" --cleanup-tag --yes
            git tag -d "$TAG" >/dev/null 2>&1 || true
            git fetch --prune --prune-tags origin
            remote_tag="$(git ls-remote --tags origin "refs/tags/$TAG" | awk '{print $1}')"
            [[ -z "$remote_tag" ]] || {
              echo "Old remote tag still exists after cleanup: $remote_tag" >&2
              exit 3
            }

            git tag "$TAG" "$SOURCE_SHA"
            git push origin "refs/tags/$TAG"
          fi

      - name: Dispatch signed v4.0.0 publish
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run release.yml --ref "$TAG" -f tag="$TAG" -f prerelease=false
          echo "Dispatched signed replacement release from $TAG at $SOURCE_SHA."
