name: Patch v14.4 compatibility checks once

on:
  push:
    branches:
      - fix/v4.0.0-v14.4-switch-core
    paths:
      - .github/workflows/patch-v14-compat-check-once.yml

permissions:
  contents: write

jobs:
  patch-and-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v4.0.0-v14.4-switch-core
          fetch-depth: 0

      - name: Teach source audit about isolated pre-reset compatibility core
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('scripts/check.sh')
          text = path.read_text(encoding='utf-8')

          old = '''find "$ROOT/common" -maxdepth 1 -type f -printf 'common/%f\\n' | sort > /tmp/luoshu-common-files.txt
grep '^common/' "$PAYLOAD_MANIFEST" | grep -v '^common/python$' | sort > /tmp/luoshu-manifest-common.txt
cmp -s /tmp/luoshu-common-files.txt /tmp/luoshu-manifest-common.txt'''
          new = '''find "$ROOT/common" -maxdepth 1 -type f -printf 'common/%f\\n' | sort > /tmp/luoshu-common-files.txt
: > /tmp/luoshu-manifest-common.txt
while IFS= read -r payload || [ -n "$payload" ]; do
  case "$payload" in
    common/*)
      [ -f "$ROOT/$payload" ] || continue
      case "${payload#common/}" in */*) continue ;; esac
      printf '%s\\n' "$payload" >> /tmp/luoshu-manifest-common.txt
      ;;
  esac
done < "$PAYLOAD_MANIFEST"
sort -o /tmp/luoshu-manifest-common.txt /tmp/luoshu-manifest-common.txt
cmp -s /tmp/luoshu-common-files.txt /tmp/luoshu-manifest-common.txt'''
          if old not in text:
              raise SystemExit('manifest audit block not found')
          text = text.replace(old, new, 1)

          old = '''! grep -RInE --exclude-dir=python '(^|[^0-9])v1[34](\\.|[^0-9])|Beta[[:space:]]*[0-9]|Hotfix' \\
  "$ROOT/common" "$ROOT/customize.sh" "$ROOT/post-fs-data.sh" "$ROOT/service.sh" "$ROOT/uninstall.sh" >/dev/null 2>&1'''
          new = '''! grep -RInE --exclude-dir=python --exclude-dir=legacy_v14_4 \\
  --exclude=legacy_v14_4_switch.sh --exclude=font_manager.sh \\
  '(^|[^0-9])v1[34](\\.|[^0-9])|Beta[[:space:]]*[0-9]|Hotfix' \\
  "$ROOT/common" "$ROOT/customize.sh" "$ROOT/post-fs-data-v4.sh" "$ROOT/service_v4.sh" "$ROOT/uninstall.sh" >/dev/null 2>&1'''
          if old not in text:
              raise SystemExit('historical runtime audit block not found')
          text = text.replace(old, new, 1)

          old = '''! grep -RInE 'webui_font_list|WebUI' "$ROOT/common" --exclude=module_update_state.sh >/dev/null 2>&1'''
          new = '''! grep -RInE 'webui_font_list|WebUI' "$ROOT/common" --exclude=module_update_state.sh --exclude-dir=legacy_v14_4 >/dev/null 2>&1'''
          if old not in text:
              raise SystemExit('WebUI audit block not found')
          text = text.replace(old, new, 1)

          anchor = '''  scripts/stability_test.sh scripts/native_zip_import_test.sh scripts/native_preview_source_test.sh scripts/app_bridge_status_test.sh scripts/font_boot_state_test.sh \\
'''
          replacement = '''  scripts/stability_test.sh scripts/legacy_switch_core_test.sh scripts/native_zip_import_test.sh scripts/native_preview_source_test.sh scripts/app_bridge_status_test.sh scripts/font_boot_state_test.sh \\
'''
          if anchor not in text:
              raise SystemExit('active test source list anchor not found')
          text = text.replace(anchor, replacement, 1)

          anchor = '''sh "$ROOT/scripts/font_switch_performance_test.sh"'''
          replacement = '''sh "$ROOT/scripts/font_switch_performance_test.sh"
sh "$ROOT/scripts/legacy_switch_core_test.sh"'''
          if anchor not in text:
              raise SystemExit('test execution anchor not found')
          text = text.replace(anchor, replacement, 1)

          path.write_text(text, encoding='utf-8')
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/check.sh
          git diff --cached --check
          git commit -m 'test: isolate v14.4 compatibility core in source audit'
          git push origin HEAD:fix/v4.0.0-v14.4-switch-core

      - name: Install source-check dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends curl unzip file python3-venv fonts-noto-cjk fonts-dejavu-core >/dev/null

      - uses: actions/cache@v4
        with:
          path: common/python
          key: luoshu-arm64-runtime-${{ runner.os }}-${{ hashFiles('scripts/prepare_composite_runtime.sh') }}

      - name: Prepare bundled composite runtime
        run: |
          if [ ! -x common/python/bin/luoshu-python ]; then
            sh ./scripts/prepare_composite_runtime.sh
          fi

      - name: Run complete source checks
        run: sh ./scripts/check.sh
