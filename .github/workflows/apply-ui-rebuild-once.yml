name: Apply unified UI rebuild once

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/apply-ui-rebuild-once.yml
      - .github/ui-patch.part??
      - .github/ui-rebuild.trigger

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'ui-rebuild'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Verify, apply and commit UI rebuild
        shell: bash
        run: |
          set -euo pipefail
          cat .github/ui-patch.part?? > /tmp/luoshu-ui.patch.gz.b64
          test "$(wc -c < /tmp/luoshu-ui.patch.gz.b64)" -eq 27876
          echo '62d0ea1b0a14b3c3f05a91edbef60b71874d8249fa902f3f44508e76314d1e88  /tmp/luoshu-ui.patch.gz.b64' | sha256sum -c -
          base64 -d /tmp/luoshu-ui.patch.gz.b64 | gzip -dc > /tmp/luoshu-ui.patch
          patch -p3 --forward < /tmp/luoshu-ui.patch
          sh -n scripts/font_library_ui_layout_test.sh
          sh scripts/font_library_ui_layout_test.sh
          rm -f \
            .github/ui-rebuild.patch.gz.b64 \
            .github/ui-patch.part?? \
            .github/ui-rebuild.trigger \
            .github/workflows/apply-ui-rebuild-once.yml \
            .github/workflows/apply-ui-parts-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'refactor: rebuild LuoShu UI with unified V1.1 design system'
          git push origin HEAD:ui-rebuild
