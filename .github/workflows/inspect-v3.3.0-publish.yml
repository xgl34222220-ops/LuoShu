name: Inspect v3.3.0 publish run

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/inspect-v3.3.0-publish.yml

permissions:
  actions: read
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Capture publisher run
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH_SHA: dfa1dd367a538fb0585618e0b8bdb508f2b0fa74
        shell: bash
        run: |
          set -euo pipefail
          sleep 3
          json="$(gh run list --workflow publish-v3.3.0-hotfix.yml --limit 10 --json databaseId,status,conclusion,headSha,url,createdAt)"
          run="$(jq -c --arg sha "$PUBLISH_SHA" '[.[] | select(.headSha == $sha)] | first // {}' <<<"$json")"
          test "$(jq -r '.databaseId // empty' <<<"$run")" != ''
          mkdir -p ops
          {
            echo "publisherCommit=$PUBLISH_SHA"
            echo "runId=$(jq -r '.databaseId' <<<"$run")"
            echo "status=$(jq -r '.status' <<<"$run")"
            echo "conclusion=$(jq -r '.conclusion // ""' <<<"$run")"
            echo "url=$(jq -r '.url' <<<"$run")"
            echo "createdAt=$(jq -r '.createdAt' <<<"$run")"
          } > ops/v3.3.0-publish-run.status

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add ops/v3.3.0-publish-run.status
          git commit -m 'ops: capture v3.3.0 publisher status'
          git pull --rebase origin main
          git push origin HEAD:main
