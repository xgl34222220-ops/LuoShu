name: Republish fixed v3.3.0

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/overwrite-v3.3.0-hotfix.yml

permissions:
  contents: write

jobs:
  retag:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace v3.3.0 release and tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v3.3.0
          TARGET_SHA: fe5d38e17a6fd0b0863356fb36078ab19bbd45c8
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force --tags origin
          test "$(git show "$TARGET_SHA:module.prop" | sed -n 's/^version=//p')" = 'v3.3.0'
          test "$(git show "$TARGET_SHA:module.prop" | sed -n 's/^versionCode=//p')" = '30300'

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release delete "$TAG" --cleanup-tag --yes
          fi

          git push origin ":refs/tags/$TAG" 2>/dev/null || true
          git tag -d "$TAG" 2>/dev/null || true
          git tag "$TAG" "$TARGET_SHA"
          git push origin "refs/tags/$TAG"

          remote_sha="$(git ls-remote origin "refs/tags/$TAG" | awk '{print $1}')"
          test "$remote_sha" = "$TARGET_SHA"
          echo "Republished tag $TAG -> $TARGET_SHA; canonical release workflow will build and publish signed assets."
