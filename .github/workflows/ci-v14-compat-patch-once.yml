name: Apply v14 compatibility audit patch once

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/ci-v14-compat-patch-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Patch source audit contracts
        run: python3 scripts/ci_v14_compat_patch.py
      - name: Commit audit update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/check.sh
          git diff --cached --check
          git commit -m 'test: isolate v14.4 compatibility core in source audit'
          git push origin HEAD:main
