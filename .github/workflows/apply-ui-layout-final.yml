name: Apply final real-layout UI fix

on:
  push:
    branches:
      - agent/ui-interaction-v226
    paths:
      - .github/workflows/apply-ui-layout-final.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ui-interaction-v226
          fetch-depth: 0

      - name: Apply final layout fix
        run: python3 .github/scripts/apply-ui-layout-final.py

      - name: Commit final layout fix
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/apply-ui-layout-final.yml
          rm -f .github/scripts/apply-ui-layout-final.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix(ui): integrate studio header and reserve dock viewport"
          git push origin HEAD:agent/ui-interaction-v226
