name: Verify republished v3.3.0

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/verify-v3.3.0-republish.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Wait for signed v3.3.0 assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v3.3.0
          TARGET_SHA: f27ff95fcd9a0dee19c62c5e8cdb03d1abd5e844
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 90); do
            remote_sha="$(git ls-remote origin "refs/tags/$TAG" | awk '{print $1}')"
            if [[ "$remote_sha" != "$TARGET_SHA" ]]; then
              echo "Tag moved unexpectedly: $remote_sha" >&2
              exit 2
            fi

            json="$(gh release view "$TAG" --json tagName,publishedAt,url,assets 2>/dev/null || true)"
            if [[ -n "$json" ]] && jq -e '
              .tagName == "v3.3.0" and
              ([.assets[].name] | index("LuoShu-v3.3.0.zip") != null) and
              ([.assets[].name] | index("LuoShu-v3.3.0.zip.sha256") != null) and
              ([.assets[].name] | index("LuoShu-App-v3.3.0.apk") != null) and
              ([.assets[].name] | index("LuoShu-App-v3.3.0.apk.sha256") != null) and
              ([.assets[] | select(.name == "LuoShu-v3.3.0.zip") | .size] | first // 0) > 0 and
              ([.assets[] | select(.name == "LuoShu-App-v3.3.0.apk") | .size] | first // 0) > 0
            ' <<<"$json" >/dev/null; then
              mkdir -p ops
              {
                echo "tag=$TAG"
                echo "tagSha=$TARGET_SHA"
                echo "verifiedAt=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
                echo "$json" | jq -r '"publishedAt=" + (.publishedAt // ""), "url=" + (.url // "")'
              } > ops/v3.3.0-republished.ok

              git config user.name github-actions[bot]
              git config user.email 41898282+github-actions[bot]@users.noreply.github.com
              git add ops/v3.3.0-republished.ok
              git commit -m 'ops: confirm fixed v3.3.0 release assets'
              git pull --rebase origin main
              git push origin HEAD:main
              exit 0
            fi

            echo "Waiting for canonical signed release ($attempt/90)..."
            sleep 10
          done

          echo "Timed out waiting for v3.3.0 signed release assets" >&2
          exit 3
