name: Port v2.3.9 stable runtime once

on:
  push:
    branches:
      - fix/v2.3.8-stable-font-runtime
    paths:
      - .github/workflows/port-v239-stable-once.yml
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  port:
    if: github.ref_name == 'fix/v2.3.8-stable-font-runtime' || github.head_ref == 'fix/v2.3.8-stable-font-runtime'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v2.3.8-stable-font-runtime
          fetch-depth: 0

      - name: Port verified runtime fixes onto v2.3.8 stable UI baseline
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin fix/v2.3.8-boot-font-verification
          git checkout origin/fix/v2.3.8-boot-font-verification -- \
            common/device_font_load_verify.sh \
            common/font_coverage.py \
            common/font_runtime_cleanup.sh \
            common/font_runtime_mount.sh \
            common/font_runtime_policy.sh \
            common/font_validation_cache.sh \
            common/mount_compat.sh \
            scripts/device_font_trust_test.sh \
            scripts/font_runtime_policy_test.sh \
            scripts/module_payload_manifest.txt \
            scripts/v2_source_audit.sh \
            service.sh

          python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          module_prop = Path('module.prop')
          text = module_prop.read_text(encoding='utf-8')
          text = re.sub(r'^version=.*$', 'version=v2.3.9', text, flags=re.M)
          text = re.sub(r'^versionCode=.*$', 'versionCode=20309', text, flags=re.M)
          module_prop.write_text(text, encoding='utf-8')

          notes = (
              'version=v2.3.9\n'
              'summary=正式版：修复部分设备字体不生效、重启回退默认字体与乱码方框\n'
              'notes=v2.3.9 基于 v2.3.8 正式版原始 App UI，只更新字体运行链路。私有负载目录改为唯一真实来源，修复不同挂载命名空间下写入空占位目录的问题；设备字体清单与 ROM 关键槽位合并映射到实际分区；按中文、英文和混合覆盖能力选择性替换槽位，保留系统 Emoji、符号及缺失语种回退；切换前清理旧别名和生成配置；启动后以系统可见字体文件验证结果，不再仅凭状态标记判断成功。模块 versionCode 20309，App versionCode 2030901。\n'
          )
          Path('config/version_notes.conf').write_text(notes, encoding='utf-8')

          update = {
              'version': 'v2.3.9',
              'versionCode': 20309,
              'zipUrl': 'https://github.com/xgl34222220-ops/LuoShu/releases/download/v2.3.9/LuoShu-v2.3.9.zip',
              'changelog': 'https://raw.githubusercontent.com/xgl34222220-ops/LuoShu/main/RELEASE_NOTES_v2.3.9.md',
          }
          encoded = json.dumps(update, ensure_ascii=False, indent=2) + '\n'
          Path('update.json').write_text(encoded, encoding='utf-8')
          Path('update-prerelease.json').write_text(encoded, encoding='utf-8')

          release_notes = '''# 洛书 v2.3.9 正式版

v2.3.9 基于 v2.3.8 正式版原始 App UI 发布，不包含后续实验性 UI 重构，仅修复字体运行与启动验证链路。

## 本次修复

- 修复部分设备选择字体后仍显示系统默认字体的问题。
- 私有 `.luoshu-payload` 改为唯一可写真实负载，避免 App 与启动脚本处于不同挂载命名空间时写入空占位目录。
- 字体清单目标与 HyperOS、ColorOS/Oplus 等 ROM 关键字体槽位合并，不再因清单仅命中部分槽位而提前结束。
- 按目标真实所在分区写入 `system`、`product`、`system_ext`、`oplus_product` 等负载，不再统一误写到 `system/fonts`。
- 根据字体中文、英文数字和混合覆盖能力选择性替换槽位；缺失的文字继续使用系统回退字体。
- 保护 Emoji、图标、符号、数学、音乐和其他语言字体，降低乱码与方框风险。
- 每次切换前清理旧字体别名和洛书生成的字体 XML，避免上一次字体残留污染新配置。
- 启动确认改为检查系统实际可见字体内容，不再仅凭 mounted/confirmed 状态误报成功。
- 保留 v2.3.8 正式版 App 页面、布局和交互，不引入后续 UI 改版。

## 版本信息

- 模块版本：`v2.3.9`
- 模块 versionCode：`20309`
- App versionName：`2.3.9`
- App versionCode：`2030901`
- 发布类型：正式版
'''
          Path('RELEASE_NOTES_v2.3.9.md').write_text(release_notes, encoding='utf-8')
          PY

          chmod 0755 common/font_runtime_cleanup.sh common/font_runtime_mount.sh \
            common/font_runtime_policy.sh scripts/font_runtime_policy_test.sh

          if git diff --name-only ce62075652a319e618b63da7a2fc9538bd3cc79b -- android-app | grep -q .; then
            echo 'ERROR: Android App UI/source differs from the v2.3.8 stable baseline.' >&2
            git diff --name-only ce62075652a319e618b63da7a2fc9538bd3cc79b -- android-app >&2
            exit 1
          fi

          rm -f .github/workflows/port-v239-stable-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'release: prepare LuoShu v2.3.9 on v2.3.8 stable UI baseline'
          git push origin HEAD:fix/v2.3.8-stable-font-runtime
