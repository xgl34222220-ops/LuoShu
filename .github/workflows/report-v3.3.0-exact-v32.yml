name: Report v3.3.0 exact v3.2 republish

on:
  workflow_run:
    workflows:
      - Republish v3.3.0 exact v3.2 apply backend
    types:
      - completed

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Write republish result
        env:
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          module_sha=''
          if [[ "$CONCLUSION" == success ]]; then
            mkdir -p "$RUNNER_TEMP/release"
            gh release download v3.3.0 -p 'LuoShu-v3.3.0.zip' -D "$RUNNER_TEMP/release"
            module_sha="$(sha256sum "$RUNNER_TEMP/release/LuoShu-v3.3.0.zip" | awk '{print $1}')"
          fi
          mkdir -p ops
          {
            printf 'conclusion=%s\n' "$CONCLUSION"
            printf 'runId=%s\n' "$RUN_ID"
            printf 'runUrl=%s\n' "$RUN_URL"
            printf 'tagTarget=%s\n' "$(git rev-list -n1 v3.3.0 2>/dev/null || true)"
            printf 'moduleSha256=%s\n' "$module_sha"
          } > ops/v3.3.0-exact-v32-release.status
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ops/v3.3.0-exact-v32-release.status
          git commit -m 'ops: record v3.3.0 exact v3.2 republish result'
          git push origin HEAD:main
