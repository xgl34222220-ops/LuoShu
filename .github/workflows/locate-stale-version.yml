name: Locate stale version strings

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/locate-stale-version.yml

permissions:
  contents: read

jobs:
  locate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Find stale version strings
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          grep -RIn --include='*.kt' --include='*.kts' --include='*.xml' 'v2\.2\.2' android-app > out/stale-version-paths.txt || true
          cat out/stale-version-paths.txt
      - uses: actions/upload-artifact@v4
        with:
          name: stale-version-paths
          path: out/stale-version-paths.txt
          if-no-files-found: error
