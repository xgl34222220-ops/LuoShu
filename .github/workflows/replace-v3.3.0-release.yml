name: One-shot replace v3.3.0 release

on:
  push:
    branches:
      - main
    paths:
      - config/replace_v3_3_0_release.conf

permissions:
  contents: write

concurrency:
  group: luoshu-replace-v3.3.0
  cancel-in-progress: false

jobs:
  replace:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Validate one-shot replacement authorization
        id: guard
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          marker='config/replace_v3_3_0_release.conf'
          test -s "$marker"
          get() { sed -n "s/^$1=//p" "$marker" | head -n1; }
          status="$(get status)"
          tag="$(get tag)"
          expected_old_tag_sha="$(get expectedOldTagSha)"
          expected_main_version="$(get expectedMainVersion)"
          expected_main_code="$(get expectedMainVersionCode)"

          [[ "$status" == 'pending' ]] || {
            echo "Replacement marker is not pending; nothing to do."
            echo 'skip=true' >> "$GITHUB_OUTPUT"
            exit 0
          }
          [[ "$tag" == 'v3.3.0' ]] || { echo "Unexpected replacement tag: $tag" >&2; exit 2; }
          [[ "$expected_old_tag_sha" == 'd20db1d3a44657a112dc1bfa1c8e88af6eaa5c31' ]] || {
            echo "Unexpected old tag authorization: $expected_old_tag_sha" >&2
            exit 2
          }
          [[ "$(sed -n 's/^version=//p' module.prop | head -n1)" == "$expected_main_version" ]] || exit 2
          [[ "$(sed -n 's/^versionCode=//p' module.prop | head -n1)" == "$expected_main_code" ]] || exit 2
          grep -qx 'version=v3.3.0' config/stable_release_authorization.conf
          grep -qx 'scope=stable-release' config/stable_release_authorization.conf
          grep -qx 'allowPendingDeviceMatrix=true' config/stable_release_authorization.conf
          test -s RELEASE_NOTES_v3.3.0.md

          git fetch --force --tags origin
          actual_old_tag_sha="$(git rev-list -n1 "$tag" 2>/dev/null || true)"
          [[ "$actual_old_tag_sha" == "$expected_old_tag_sha" ]] || {
            echo "Refusing replacement: $tag points to $actual_old_tag_sha, expected $expected_old_tag_sha" >&2
            exit 3
          }
          gh release view "$tag" >/dev/null 2>&1 || {
            echo "Refusing replacement: GitHub Release $tag does not exist" >&2
            exit 3
          }

          echo 'skip=false' >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Delete authorized old release and tag
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.guard.outputs.tag }}
        run: |
          set -euo pipefail
          gh release delete "$TAG" --cleanup-tag --yes
          git fetch --prune --tags origin
          [[ -z "$(git rev-list -n1 "$TAG" 2>/dev/null || true)" ]] || {
            echo "Old tag still exists after deletion: $TAG" >&2
            exit 4
          }

      - name: Trigger normal signed release workflow from current main
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          grep -qx 'version=v3.3.0' module.prop
          test -s RELEASE_NOTES_v3.3.0.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          printf '\n<!-- replacement-dispatch: %s -->\n' "$GITHUB_SHA" >> RELEASE_NOTES_v3.3.0.md
          git add RELEASE_NOTES_v3.3.0.md
          git commit -m 'chore(release): trigger rebuilt v3.3.0'
          git push origin HEAD:main
