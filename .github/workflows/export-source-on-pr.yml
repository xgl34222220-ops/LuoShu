name: Export source on PR

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare source archive
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .git
          tar -czf /tmp/LuoShu-source.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: LuoShu-Source
          path: /tmp/LuoShu-source.tar.gz
          retention-days: 2
