name: Apply generic XML overlay refinement

on:
  push:
    branches:
      - fix/generic-xml-overlay
    paths:
      - .github/workflows/tmp-generic-xml-overlay-apply.yml

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/generic-xml-overlay
          fetch-depth: 0

      - name: Apply reviewed integration
        run: |
          python3 .github/tmp/apply_generic_xml_overlay.py
          cp -f .github/tmp/device_font_payload_bridge_test.new.sh scripts/device_font_payload_bridge_test.sh
          cp -f .github/tmp/generic_xml_partial_coverage_test.new.sh scripts/generic_xml_partial_coverage_test.sh
          chmod 0755 scripts/device_font_payload_bridge_test.sh scripts/generic_xml_partial_coverage_test.sh
          sed -i 's/<family name="acme-sans">/<family name="sans-serif">/' scripts/font_config_runtime_test.sh

      - name: Shell syntax checks
        run: |
          sh -n common/device_font_payload_policy.sh
          sh -n common/device_font_payload_bridge.sh
          sh -n common/font_config_partitions.sh
          sh -n common/font_config_runtime.sh
          sh -n common/font_safety.sh
          sh -n common/font_finalize_hotfix.sh
          sh -n scripts/device_font_payload_bridge_test.sh
          sh -n scripts/font_config_runtime_test.sh
          sh -n scripts/generic_xml_partial_coverage_test.sh

      - name: Run focused regression suite
        run: |
          python3 scripts/font_config_overlay_test.py
          python3 scripts/font_config_targets_test.py
          sh scripts/device_font_payload_policy_test.sh
          sh scripts/device_font_payload_bridge_test.sh
          sh scripts/font_config_runtime_test.sh
          sh scripts/font_safety_test.sh
          sh scripts/generic_xml_partial_coverage_test.sh

      - name: Commit verified source only
        run: |
          # Existing workflow files are updated separately through the GitHub connector because
          # Actions' GITHUB_TOKEN is intentionally not allowed to rewrite workflows.
          git checkout -- .github/workflows/no-hook-font-engine.yml
          rm -f .github/tmp/apply_generic_xml_overlay.py
          rm -f .github/tmp/device_font_payload_bridge_test.new.sh
          rm -f .github/tmp/generic_xml_partial_coverage_test.new.sh
          rmdir .github/tmp 2>/dev/null || true
          git diff --check
          git status --short
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(font): support generic OEM XML overlays safely'
          git push origin HEAD:fix/generic-xml-overlay
