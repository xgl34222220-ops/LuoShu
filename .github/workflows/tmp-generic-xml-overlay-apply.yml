name: Apply generic XML overlay refinement

on:
  push:
    branches:
      - fix/generic-xml-overlay
    paths:
      - .github/workflows/tmp-generic-xml-overlay-apply.yml

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/generic-xml-overlay
          fetch-depth: 0

      - name: Apply reviewed integration
        run: |
          python3 .github/tmp/apply_generic_xml_overlay.py
          cp -f .github/tmp/device_font_payload_bridge_test.new.sh scripts/device_font_payload_bridge_test.sh
          chmod 0755 scripts/device_font_payload_bridge_test.sh
          # Uppercase filename discovery should be tested with a family that the existing safe
          # overlay policy intentionally rewrites; arbitrary OEM family names must stay untouched.
          sed -i 's/<family name="acme-sans">/<family name="sans-serif">/' scripts/font_config_runtime_test.sh
          # Partial-coverage test needs real OEM source files. Keep them inside the fixture rather
          # than touching the runner's /system tree, then override the path resolver used at runtime.
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/generic_xml_partial_coverage_test.sh')
          s = p.read_text()
          old = '''. "$ROOT/common/font_safety.sh"\nset -eu\n_luoshu_font_config_specs() {\n'''
          new = '''. "$ROOT/common/font_safety.sh"\nset -eu\nmkdir -p "$TMP/real-fonts"\nprintf 'stock-good\\n' > "$TMP/real-fonts/Good.ttf"\nprintf 'stock-bad\\n' > "$TMP/real-fonts/Bad.ttf"\n_luoshu_font_real_path() { printf '%s/%s\\n' "$TMP/real-fonts" "$1"; }\n_luoshu_font_config_specs() {\n'''
          if s.count(old) != 1:
              raise SystemExit('partial coverage fixture anchor mismatch')
          p.write_text(s.replace(old, new, 1))
          PY

      - name: Shell syntax checks
        run: |
          sh -n common/device_font_payload_policy.sh
          sh -n common/device_font_payload_bridge.sh
          sh -n common/font_config_partitions.sh
          sh -n common/font_config_runtime.sh
          sh -n common/font_safety.sh
          sh -n common/font_finalize_hotfix.sh
          sh -n scripts/device_font_payload_bridge_test.sh
          sh -n scripts/font_config_runtime_test.sh
          sh -n scripts/generic_xml_partial_coverage_test.sh

      - name: Run XML structure and policy tests
        run: |
          python3 scripts/font_config_overlay_test.py
          python3 scripts/font_config_targets_test.py
          sh scripts/device_font_payload_policy_test.sh
          sh scripts/device_font_payload_bridge_test.sh

      - name: Run transactional XML runtime test
        run: sh scripts/font_config_runtime_test.sh

      - name: Run partial coverage and safety tests
        run: |
          sh scripts/font_safety_test.sh
          sh scripts/generic_xml_partial_coverage_test.sh

      - name: Commit verified source only
        run: |
          rm -f .github/tmp/apply_generic_xml_overlay.py
          rm -f .github/tmp/device_font_payload_bridge_test.new.sh
          rmdir .github/tmp 2>/dev/null || true
          rm -f .github/workflows/tmp-generic-xml-overlay-apply.yml
          git diff --check
          git status --short
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(font): support generic OEM XML overlays safely'
          git push origin HEAD:fix/generic-xml-overlay
