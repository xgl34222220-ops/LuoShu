name: Apply v4.0.0 usability hotfix once

on:
  push:
    branches: [ fix/v4.0.0-usable-release ]
    paths:
      - .github/workflows/apply-v4-usable-fix-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v4.0.0-usable-release
          fetch-depth: 0
      - name: Apply safe migration and 94 percent fix
        run: |
          set -euo pipefail
          git show aef49a6ad22f3fa02427b09100e91dff5e158263:common/module_update_state.sh > common/module_update_state.sh
          git show aef49a6ad22f3fa02427b09100e91dff5e158263:scripts/module_update_state_test.sh > scripts/module_update_state_test.sh
          python3 - <<'PY'
          from pathlib import Path

          p = Path('common/module_update_state.sh')
          s = p.read_text()
          s = s.replace('retain the user\'s selected font/config but boot on the ROM font until one explicit apply.',
                        'retain the user\'s selected font/config and require the installer to rebuild it before activation.')
          s = s.replace("printf 'mode=safe-stock\\n'", "printf 'mode=rebuild-on-install\\n'")
          p.write_text(s)

          p = Path('.luoshu-runtime/customize-v227.sh')
          s = p.read_text()
          old = '''elif type luoshu_migrate_active_install >/dev/null 2>&1; then
              if luoshu_migrate_active_install "$OLD_MOD" "$MODPATH"; then
                  UPDATE_PRESERVED=true
              fi
          fi
          '''
          new = '''elif type luoshu_migrate_active_install >/dev/null 2>&1; then
              if luoshu_migrate_active_install "$OLD_MOD" "$MODPATH"; then
                  UPDATE_PRESERVED=true
              fi
          fi

          # A schema mismatch must never turn the user's selection into stock/default.
          # Rebuild the selected composite synchronously with the new engine before this update can boot.
          if [ "$UPDATE_PRESERVED" = true ] && [ "${LUOSHU_UPDATE_REBUILD_REQUIRED:-false}" = true ]; then
              _upgrade_active=$(head -n1 "$MODPATH/config/active_font.conf" 2>/dev/null | tr -d '\\r\\n')
              if [ "$_upgrade_active" = mix ]; then
                  _upgrade_cjk=$(sed -n 's/^cjk=//p' "$MODPATH/config/font_mix.conf" 2>/dev/null | head -n1)
                  _upgrade_latin=$(sed -n 's/^latin=//p' "$MODPATH/config/font_mix.conf" 2>/dev/null | head -n1)
                  _upgrade_digit=$(sed -n 's/^digit=//p' "$MODPATH/config/font_mix.conf" 2>/dev/null | head -n1)
                  [ -n "$_upgrade_cjk" ] && [ -n "$_upgrade_latin" ] && [ -n "$_upgrade_digit" ] || {
                      ui_print "✗ 无法读取原复合字体配置，已取消更新；不会恢复默认字体"
                      type abort >/dev/null 2>&1 && abort "洛书：原字体配置不完整" || exit 1
                  }
                  ui_print "• 字体引擎结构已变化，正在保留当前字体并重建安全负载..."
                  _upgrade_task="upgrade-$(date +%s)-$$"
                  _upgrade_started=$(date +%s)
                  MODDIR="$MODPATH" sh "$MODPATH/common/font_mix.sh" worker \
                      "$_upgrade_task" "$_upgrade_cjk" "$_upgrade_latin" "$_upgrade_digit" "$_upgrade_started"
                  _upgrade_state=$(sed -n 's/^state=//p' "$MODPATH/config/mix_task.conf" 2>/dev/null | head -n1)
                  if [ "$_upgrade_state" != success ]; then
                      _upgrade_error=$(sed -n 's/^message=//p' "$MODPATH/config/mix_task.conf" 2>/dev/null | head -n1)
                      [ -n "$_upgrade_error" ] || _upgrade_error="新字体负载重建失败"
                      ui_print "✗ $_upgrade_error"
                      ui_print "✗ 已取消本次更新；旧模块与旧字体选择保持不变"
                      type abort >/dev/null 2>&1 && abort "洛书：$_upgrade_error" || exit 1
                  fi
                  LUOSHU_UPDATE_REBUILD_REQUIRED=false
                  rm -f "$MODPATH/config/font-payload-rebuild-pending.conf" 2>/dev/null || true
                  ui_print "✓ 已按新版引擎重建当前复合字体；不会切回默认字体"
              elif [ "$_upgrade_active" != default ]; then
                  ui_print "✗ 当前字体模式需要安全重建，但此安装器不能无损重建；已取消更新"
                  type abort >/dev/null 2>&1 && abort "洛书：无法无损重建当前字体" || exit 1
              fi
          fi
          '''
          if old not in s:
              raise SystemExit('customize migration hook not found')
          s = s.replace(old, new)

          old2 = '''    printf 'default\\n' > "$MODPATH/config/active_font.conf"
          fi
          '''
          new2 = '''    if [ -f "$OLD_MOD/module.prop" ] && [ -s "$OLD_MOD/config/active_font.conf" ]; then
              cp -f "$OLD_MOD/config/active_font.conf" "$MODPATH/config/active_font.conf" 2>/dev/null || true
          else
              printf 'default\\n' > "$MODPATH/config/active_font.conf"
          fi
          fi
          '''
          if old2 not in s:
              raise SystemExit('default fallback hook not found')
          s = s.replace(old2, new2)
          p.write_text(s)

          p = Path('common/font_safety.sh')
          s = p.read_text()
          old3 = '''        if [ "$_lpv_mapped" -gt 0 ]; then
              _lpv_manifest="$_lpv_config/font-target-aliases.conf"
              _lpv_manifest_count=$(awk 'NF { n++ } END { print n+0 }' "$_lpv_manifest" 2>/dev/null)
              case "$_lpv_manifest_count" in ''|*[!0-9]*) return 1 ;; esac
              [ "$_lpv_manifest_count" -eq "$_lpv_mapped" ] || return 1
              while IFS='|' read -r _lpv_rel _lpv_key _lpv_weight _lpv_family; do
                  [ -n "$_lpv_rel" ] || continue
                  case "$_lpv_rel" in */fonts/*.ttf|*/fonts/*.otf|*/fonts/*.ttc) ;; *) return 1 ;; esac
                  [ -f "$_lpv_module/$_lpv_rel" ] || return 1
                  if type _luoshu_fast_font_ok >/dev/null 2>&1; then
                      _luoshu_fast_font_ok "$_lpv_module/$_lpv_rel" || return 1
                  fi
              done < "$_lpv_manifest"
          fi
          '''
          new3 = '''        if [ "$_lpv_mapped" -gt 0 ]; then
              _lpv_manifest="$_lpv_config/font-target-aliases.conf"
              _lpv_manifest_count=$(awk 'NF { n++ } END { print n+0 }' "$_lpv_manifest" 2>/dev/null)
              case "$_lpv_manifest_count" in ''|*[!0-9]*) return 1 ;; esac
              [ "$_lpv_manifest_count" -eq "$_lpv_mapped" ] || return 1
              _lpv_seen_identity="$_lpv_config/.font-validate-identities.$$"
              : > "$_lpv_seen_identity" 2>/dev/null || return 1
              while IFS='|' read -r _lpv_rel _lpv_key _lpv_weight _lpv_family; do
                  [ -n "$_lpv_rel" ] || continue
                  case "$_lpv_rel" in */fonts/*.ttf|*/fonts/*.otf|*/fonts/*.ttc) ;; *) rm -f "$_lpv_seen_identity"; return 1 ;; esac
                  _lpv_path="$_lpv_module/$_lpv_rel"
                  [ -f "$_lpv_path" ] || { rm -f "$_lpv_seen_identity"; return 1; }
                  _lpv_identity=$(_luoshu_file_identity "$_lpv_path")
                  if ! grep -Fqx "$_lpv_identity" "$_lpv_seen_identity" 2>/dev/null; then
                      if type _luoshu_fast_font_ok >/dev/null 2>&1; then
                          _luoshu_fast_font_ok "$_lpv_path" || { rm -f "$_lpv_seen_identity"; return 1; }
                      fi
                      printf '%s\\n' "$_lpv_identity" >> "$_lpv_seen_identity"
                  fi
              done < "$_lpv_manifest"
              rm -f "$_lpv_seen_identity" 2>/dev/null || true
          fi
          '''
          if old3 not in s:
              raise SystemExit('payload validation hook not found')
          s = s.replace(old3, new3)
          p.write_text(s)

          # Keep this repair on v4.0.0. Do not create or publish v4.0.1.
          assert 'version=v4.0.0' in Path('module.prop').read_text()
          assert 'versionCode=40000' in Path('module.prop').read_text()
          PY

          sh -n common/module_update_state.sh
          sh -n .luoshu-runtime/customize-v227.sh
          sh -n common/font_safety.sh
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add common/module_update_state.sh scripts/module_update_state_test.sh .luoshu-runtime/customize-v227.sh common/font_safety.sh
          git commit -m "fix: make v4.0.0 font switching safe and finish validation"
          git push origin HEAD:fix/v4.0.0-usable-release
