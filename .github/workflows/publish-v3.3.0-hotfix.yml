name: Build and publish fixed v3.3.0

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-v3.3.0-hotfix.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fe5d38e17a6fd0b0863356fb36078ab19bbd45c8
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Replace tag and verify version
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v3.3.0
          TARGET_SHA: fe5d38e17a6fd0b0863356fb36078ab19bbd45c8
        shell: bash
        run: |
          set -euo pipefail
          . ./scripts/version.sh
          test "$LUOSHU_VERSION" = 'v3.3.0'
          test "$LUOSHU_ARTIFACT_VERSION" = 'v3.3.0'
          git fetch --force --tags origin

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release delete "$TAG" --yes
          fi
          git push origin ":refs/tags/$TAG" 2>/dev/null || true
          git tag -d "$TAG" 2>/dev/null || true
          git tag "$TAG" "$TARGET_SHA"
          git push origin "refs/tags/$TAG"

          tag_sha="$(git rev-list -n1 "$TAG")"
          remote_sha="$(git ls-remote origin "refs/tags/$TAG" | awk '{print $1}')"
          test "$tag_sha" = "$TARGET_SHA"
          test "$remote_sha" = "$TARGET_SHA"

      - name: Require signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.LUOSHU_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.LUOSHU_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.LUOSHU_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.LUOSHU_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          for value in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            test -n "${!value}"
          done
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/luoshu-release.jks"
          keytool -list -keystore "$RUNNER_TEMP/luoshu-release.jks" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null

      - name: Install module build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends curl unzip zip file python3-venv fonts-noto-cjk fonts-dejavu-core >/dev/null

      - uses: actions/cache@v4
        with:
          path: common/python
          key: luoshu-arm64-runtime-${{ runner.os }}-${{ hashFiles('scripts/prepare_composite_runtime.sh') }}

      - name: Prepare ARM64 composite runtime
        shell: bash
        run: |
          if [[ ! -x common/python/bin/luoshu-python ]]; then
            sh ./scripts/prepare_composite_runtime.sh
          fi

      - name: Build signed release App
        working-directory: android-app
        env:
          LUOSHU_KEYSTORE_FILE: ${{ runner.temp }}/luoshu-release.jks
          LUOSHU_KEYSTORE_PASSWORD: ${{ secrets.LUOSHU_KEYSTORE_PASSWORD }}
          LUOSHU_KEY_ALIAS: ${{ secrets.LUOSHU_KEY_ALIAS }}
          LUOSHU_KEY_PASSWORD: ${{ secrets.LUOSHU_KEY_PASSWORD }}
        run: gradle --no-daemon --stacktrace :app:assembleRelease

      - name: Verify APK signing certificate
        env:
          EXPECTED_CERT_SHA256: e0043b560a10111d3ffddd3a7afba680b854e14ed793c7a3fdb7f8b7aa95ff27
        shell: bash
        run: |
          set -euo pipefail
          apk='android-app/app/build/outputs/apk/release/app-release.apk'
          test -s "$apk"
          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n1)"
          test -x "$apksigner"
          "$apksigner" verify --verbose --print-certs "$apk" | tee "$RUNNER_TEMP/apk-signature.txt"
          grep -Eq '^Verified using v(2|3|3\.1|3\.2) scheme.*: true$' "$RUNNER_TEMP/apk-signature.txt"
          grep -qx 'Number of signers: 1' "$RUNNER_TEMP/apk-signature.txt"
          actual_cert="$(awk -F': ' '/Signer.*certificate SHA-256 digest:/ {print $NF; exit}' "$RUNNER_TEMP/apk-signature.txt" | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')"
          test "$actual_cert" = "$EXPECTED_CERT_SHA256"

      - name: Build fixed module package
        shell: bash
        run: |
          set -euo pipefail
          . ./scripts/version.sh
          apk='android-app/app/build/outputs/apk/release/app-release.apk'
          mkdir -p dist
          app="dist/LuoShu-App-${LUOSHU_ARTIFACT_VERSION}.apk"
          cp -f "$apk" "$app"
          (cd dist && sha256sum "$(basename "$app")" > "$(basename "$app").sha256")
          LUOSHU_APP_APK="$apk" sh ./scripts/build.sh
          module="dist/LuoShu-${LUOSHU_ARTIFACT_VERSION}.zip"
          test -s "$module"
          unzip -t "$module" >/dev/null
          unzip -Z1 "$module" | grep -qx 'bundled/LuoShu-App.apk'
          unzip -p "$module" bundled/LuoShu-App.apk > "$RUNNER_TEMP/embedded.apk"
          cmp -s "$apk" "$RUNNER_TEMP/embedded.apk"
          (cd dist && sha256sum -c "$(basename "$module").sha256")
          (cd dist && sha256sum -c "$(basename "$app").sha256")

      - name: Publish replacement v3.3.0 release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v3.3.0
        shell: bash
        run: |
          set -euo pipefail
          . ./scripts/version.sh
          module="dist/LuoShu-${LUOSHU_ARTIFACT_VERSION}.zip"
          module_sha="${module}.sha256"
          app="dist/LuoShu-App-${LUOSHU_ARTIFACT_VERSION}.apk"
          app_sha="${app}.sha256"
          for file in "$module" "$module_sha" "$app" "$app_sha" RELEASE_NOTES_v3.3.0.md; do test -s "$file"; done

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release delete "$TAG" --yes
          fi

          gh release create "$TAG" "$module" "$module_sha" "$app" "$app_sha" \
            --verify-tag \
            --title '洛书 v3.3.0' \
            --notes-file RELEASE_NOTES_v3.3.0.md

          gh release view "$TAG" --json tagName,publishedAt,url,assets | tee "$RUNNER_TEMP/release.json"
          jq -e '([.assets[].name] | index("LuoShu-v3.3.0.zip") != null) and ([.assets[].name] | index("LuoShu-App-v3.3.0.apk") != null)' "$RUNNER_TEMP/release.json" >/dev/null
