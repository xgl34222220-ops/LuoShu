name: Patch v4 device regression once

on:
  push:
    branches:
      - fix/v4.0.0-device-regression
    paths:
      - .github/workflows/patch-v4-device-regression-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v4.0.0-device-regression
      - name: Apply patch
        run: python3 scripts/apply_v4_device_regression_patch.py
      - name: Validate patch
        run: |
          sh -n common/rom_adapters.sh
          sh -n common/font_mix.sh
          sh -n common/coloros_global.sh
          sh -n common/device_font_payload_policy.sh
          sh -n .luoshu-runtime/customize-v227.sh
          python3 -m py_compile common/font_inventory.py common/device_font_payload_build.py common/device_font_payload_overlay.py
          sh scripts/v4_rom_regression_test.sh
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add common .luoshu-runtime/customize-v227.sh scripts/v4_rom_regression_test.sh
          git commit -m 'fix: restore device-specific font contracts on v4.0.0'
          git push origin HEAD:fix/v4.0.0-device-regression
