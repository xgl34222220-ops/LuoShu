name: Apply v2.2.6 trust and log hotfix

on:
  push:
    branches:
      - hotfix/v2.2.6-trust-log
    paths:
      - .github/v226-hotfix-trigger

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/v2.2.6-trust-log
          fetch-depth: 0

      - name: Apply source fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          guide = Path('android-app/app/src/main/java/io/github/xgl34222220/luoshu/ui/home/DeviceAcceptanceGuide.kt')
          text = guide.read_text(encoding='utf-8')
          text = text.replace('import androidx.compose.material.icons.rounded.ContentCopy\n', 'import androidx.compose.material.icons.rounded.ContentCopy\nimport androidx.compose.material.icons.rounded.Info\n', 1)
          text = text.replace(
              '    val passed: Boolean,\n    val automatic: Boolean,\n)',
              '    val passed: Boolean,\n    val automatic: Boolean,\n    val blocking: Boolean = true,\n)',
              1,
          )
          for old, new in [
              ('DeviceAcceptanceCheck("system-ui", "系统界面", "检查设置、状态栏、通知、锁屏和桌面是否无方框、截断或错位", false, false)', 'DeviceAcceptanceCheck("system-ui", "系统界面", "检查设置、状态栏、通知、锁屏和桌面是否无方框、截断或错位", false, false, false)'),
              ('DeviceAcceptanceCheck("input", "输入与编辑", "检查输入法候选、光标、选择菜单、中英文混排和密码框", false, false)', 'DeviceAcceptanceCheck("input", "输入与编辑", "检查输入法候选、光标、选择菜单、中英文混排和密码框", false, false, false)'),
              ('DeviceAcceptanceCheck("apps", "常用应用", "检查浏览器、社交、阅读和 Google 应用中的字体回退", false, false)', 'DeviceAcceptanceCheck("apps", "常用应用", "检查浏览器、社交、阅读和 Google 应用中的字体回退", false, false, false)'),
              ('DeviceAcceptanceCheck("numbers", "数字场景", "检查时间、电量、金额、验证码、表格和等宽数字是否清晰", false, false)', 'DeviceAcceptanceCheck("numbers", "数字场景", "检查时间、电量、金额、验证码、表格和等宽数字是否清晰", false, false, false)'),
          ]:
              if old not in text:
                  raise SystemExit(f'{guide}: missing manual check pattern')
              text = text.replace(old, new, 1)
          text = text.replace(
              '        passed = !state.taskRunning,\n        automatic = true,\n    ),',
              '        passed = !state.taskRunning,\n        automatic = true,\n        blocking = false,\n    ),',
              1,
          )
          text = text.replace(
              '        passed = !state.rebootRequired,\n        automatic = true,\n    ),',
              '        passed = !state.rebootRequired,\n        automatic = true,\n        blocking = false,\n    ),',
              1,
          )
          old_alignment = '''    DeviceAcceptanceCheck(
        id = "alignment",
        title = "开机加载证据",
        detail = if (trust.alignment == "verified" && trust.mode == "aligned") {
            "开机加载验证通过，当前为设备对齐模式"
        } else {
            "等待逐分区开机挂载验证；应用字体并完整重启后重新检测"
        },
        passed = trust.alignment == "verified" && trust.mode == "aligned",
        automatic = true,
    ),'''
          new_alignment = '''    DeviceAcceptanceCheck(
        id = "alignment",
        title = "字体加载模式",
        detail = when {
            trust.alignment == "verified" && trust.mode in setOf("aligned", "mount-verified") ->
                "逐分区开机加载验证通过，当前为设备对齐模式"
            trust.level == DeviceTrustLevel.COMPATIBILITY || trust.mode == "compatibility" ->
                "当前字体已通过兼容映射生效；设备专属对齐属于可选增强，不影响正常使用"
            trust.alignment == "failed" || trust.error.isNotBlank() ->
                "加载验证失败，请打开问题页查看具体失败分区"
            state.taskRunning -> "字体任务完成后会自动刷新加载状态"
            state.rebootRequired -> "当前字体等待完整重启后验证"
            else -> "加载证据正在后台刷新，不需要反复重启"
        },
        passed = (trust.alignment == "verified" && trust.mode in setOf("aligned", "mount-verified")) ||
            trust.level == DeviceTrustLevel.COMPATIBILITY || trust.mode == "compatibility",
        automatic = true,
        blocking = trust.alignment == "failed" || trust.error.isNotBlank(),
    ),'''
          if old_alignment not in text:
              raise SystemExit(f'{guide}: old alignment block not found')
          text = text.replace(old_alignment, new_alignment, 1)
          old_cache = '''    DeviceAcceptanceCheck(
        id = "cache",
        title = "后台对齐缓存",
        detail = if (trust.cachePending) "对齐缓存尚未生成；应用字体后会在后台自动建立" else "没有待处理的对齐缓存",
        passed = !trust.cachePending,
        automatic = true,
    ),'''
          new_cache = '''    DeviceAcceptanceCheck(
        id = "cache",
        title = "设备对齐缓存",
        detail = when {
            !trust.cachePending -> "没有待处理的设备对齐缓存"
            trust.level == DeviceTrustLevel.COMPATIBILITY || trust.mode == "compatibility" ->
                "兼容映射已正常生效；设备对齐缓存会在后台继续准备，不作为失败项"
            else -> "设备对齐缓存正在后台生成，不需要停留在此页面"
        },
        passed = !trust.cachePending || trust.level == DeviceTrustLevel.COMPATIBILITY || trust.mode == "compatibility",
        automatic = true,
        blocking = false,
    ),'''
          if old_cache not in text:
              raise SystemExit(f'{guide}: old cache block not found')
          text = text.replace(old_cache, new_cache, 1)
          text = text.replace(
              '    val complete = passedCount == allChecks.size\n',
              '    val complete = passedCount == allChecks.size\n    val hasBlockingFailure = automatic.any { !it.passed && it.blocking }\n',
              1,
          )
          text = text.replace(
              '                        color = if (complete) MaterialTheme.colorScheme.primaryContainer else MaterialTheme.colorScheme.secondaryContainer,',
              '''                        color = when {
                            complete -> MaterialTheme.colorScheme.primaryContainer
                            hasBlockingFailure -> MaterialTheme.colorScheme.errorContainer
                            else -> MaterialTheme.colorScheme.secondaryContainer
                        },''',
              1,
          )
          text = text.replace(
              '                                if (complete) Icons.Rounded.CheckCircle else Icons.Rounded.Warning,\n                                contentDescription = null,\n                                tint = if (complete) MaterialTheme.colorScheme.primary else MaterialTheme.colorScheme.secondary,',
              '''                                when {
                                    complete -> Icons.Rounded.CheckCircle
                                    hasBlockingFailure -> Icons.Rounded.Warning
                                    else -> Icons.Rounded.Info
                                },
                                contentDescription = null,
                                tint = when {
                                    complete -> MaterialTheme.colorScheme.primary
                                    hasBlockingFailure -> MaterialTheme.colorScheme.error
                                    else -> MaterialTheme.colorScheme.secondary
                                },''',
              1,
          )
          text = text.replace(
              '                        if (complete) Icons.Rounded.CheckCircle else Icons.Rounded.Warning,',
              '                        if (complete) Icons.Rounded.CheckCircle else if (hasBlockingFailure) Icons.Rounded.Warning else Icons.Rounded.Info,',
              1,
          )
          old_surface = '''        color = if (check.passed) {
            MaterialTheme.colorScheme.primaryContainer.copy(alpha = .48f)
        } else {
            MaterialTheme.colorScheme.surfaceContainerLow
        },'''
          new_surface = '''        color = when {
            check.passed -> MaterialTheme.colorScheme.primaryContainer.copy(alpha = .48f)
            check.blocking -> MaterialTheme.colorScheme.errorContainer.copy(alpha = .38f)
            else -> MaterialTheme.colorScheme.secondaryContainer.copy(alpha = .34f)
        },'''
          if old_surface not in text:
              raise SystemExit(f'{guide}: row surface block not found')
          text = text.replace(old_surface, new_surface, 1)
          old_icon = '''                Icon(
                    if (check.passed) Icons.Rounded.CheckCircle else Icons.Rounded.Warning,
                    contentDescription = null,
                    tint = if (check.passed) MaterialTheme.colorScheme.primary else MaterialTheme.colorScheme.error,
                    modifier = Modifier.size(22.dp),
                )'''
          new_icon = '''                Icon(
                    when {
                        check.passed -> Icons.Rounded.CheckCircle
                        check.blocking -> Icons.Rounded.Warning
                        else -> Icons.Rounded.Info
                    },
                    contentDescription = null,
                    tint = when {
                        check.passed -> MaterialTheme.colorScheme.primary
                        check.blocking -> MaterialTheme.colorScheme.error
                        else -> MaterialTheme.colorScheme.secondary
                    },
                    modifier = Modifier.size(22.dp),
                )'''
          if old_icon not in text:
              raise SystemExit(f'{guide}: row icon block not found')
          text = text.replace(old_icon, new_icon, 1)
          text = text.replace(
              '    checks.forEach { check -> appendLine("[${if (check.passed) "通过" else "待确认"}] ${check.title}：${check.detail}") }',
              '    checks.forEach { check -> appendLine("[${if (check.passed) "通过" else if (check.blocking) "失败" else "等待"}] ${check.title}：${check.detail}") }',
              1,
          )
          guide.write_text(text, encoding='utf-8')

          util = Path('common/util_functions.sh')
          text = util.read_text(encoding='utf-8')
          marker = '''log_message() {
    level="$1"
    msg="$2"
    timestamp=$(date '+%Y-%m-%d %H:%M:%S' 2>/dev/null || echo "unknown")
    # 确保日志目录存在
    if [ -d "$LOG_DIR" ]; then
        echo "[$timestamp] [$level] $msg" >> "$LOG_FILE" 2>/dev/null || true
    fi
}
'''
          addition = marker + '''
compact_rom_detection_logs() {
    [ -f "$LOG_FILE" ] || return 0
    _rom_compact_marker="$CONFIG_DIR/rom-log-compacted-v1"
    [ ! -e "$_rom_compact_marker" ] || return 0
    mkdir -p "$CONFIG_DIR" 2>/dev/null || true
    _rom_tmp="${LOG_FILE}.rom.$$"
    awk '\''
        /检测到 ColorOS 版本:/ {
            line=$0; sub(/^.*检测到 ColorOS 版本:[[:space:]]*/, "", line)
            key="coloros|" line
            if (seen[key]++) next
        }
        /检测到 HyperOS\/MIUI 版本:/ {
            line=$0; sub(/^.*检测到 HyperOS\/MIUI 版本:[[:space:]]*/, "", line)
            key="hyperos|" line
            if (seen[key]++) next
        }
        { print }
    '\'' "$LOG_FILE" > "$_rom_tmp" 2>/dev/null && mv -f "$_rom_tmp" "$LOG_FILE" 2>/dev/null || rm -f "$_rom_tmp" 2>/dev/null || true
    : > "$_rom_compact_marker" 2>/dev/null || true
}

log_rom_detection_once() {
    _rom_kind="$1"
    _rom_version="$2"
    _rom_message="$3"
    mkdir -p "$CONFIG_DIR" "$LOG_DIR" 2>/dev/null || true
    compact_rom_detection_logs
    _rom_state="$CONFIG_DIR/rom-detection-${_rom_kind}.conf"
    _rom_signature="${_rom_kind}|${_rom_version}"
    [ "$(cat "$_rom_state" 2>/dev/null)" != "$_rom_signature" ] || return 0
    if grep -Fq "$_rom_message" "$LOG_FILE" 2>/dev/null; then
        printf '%s\n' "$_rom_signature" > "$_rom_state" 2>/dev/null || true
        return 0
    fi
    _rom_tmp="${_rom_state}.tmp.$$"
    printf '%s\n' "$_rom_signature" > "$_rom_tmp" 2>/dev/null && mv -f "$_rom_tmp" "$_rom_state" 2>/dev/null || true
    log_message "INFO" "$_rom_message"
}
'''
          if marker not in text:
              raise SystemExit(f'{util}: log_message block not found')
          text = text.replace(marker, addition, 1)
          text = text.replace('        log_message "INFO" "检测到 ColorOS 版本: $COLOROS_VERSION"', '        log_rom_detection_once coloros "$COLOROS_VERSION" "检测到 ColorOS 版本: $COLOROS_VERSION"', 1)
          text = text.replace('        log_message "INFO" "检测到 HyperOS/MIUI 版本: $HYPEROS_VERSION"', '        log_rom_detection_once hyperos "$HYPEROS_VERSION" "检测到 HyperOS/MIUI 版本: $HYPEROS_VERSION"', 1)
          util.write_text(text, encoding='utf-8')

          cache = Path('common/device_font_cache.sh')
          text = cache.read_text(encoding='utf-8')
          old_runtime = '''_dfcache_runtime_ready() {
    type _dfpr_exec >/dev/null 2>&1 && type _dfpr_prepare_sources >/dev/null 2>&1 && type _dfpr_install_overlay >/dev/null 2>&1 && return 0
    _dfc_module="$(_dfcache_module)"
    [ -f "$_dfc_module/common/device_font_payload_runtime.sh" ] || return 1
    . "$_dfc_module/common/device_font_payload_runtime.sh"
    type _dfpr_exec >/dev/null 2>&1 && type _dfpr_prepare_sources >/dev/null 2>&1 && type _dfpr_install_overlay >/dev/null 2>&1
}'''
          new_runtime = '''_dfcache_runtime_ready() {
    _dfc_module="$(_dfcache_module)"
    if ! type _dfpr_exec >/dev/null 2>&1 || ! type _dfpr_prepare_sources >/dev/null 2>&1 || ! type _dfpr_install_overlay >/dev/null 2>&1; then
        [ -f "$_dfc_module/common/device_font_payload_runtime.sh" ] || return 1
        . "$_dfc_module/common/device_font_payload_runtime.sh"
    fi
    if ! type luoshu_payload_transaction_begin >/dev/null 2>&1 || ! type luoshu_payload_transaction_commit >/dev/null 2>&1; then
        [ -f "$_dfc_module/common/device_font_transaction_guard.sh" ] && . "$_dfc_module/common/device_font_transaction_guard.sh"
    fi
    if ! type luoshu_sync_mount_payload >/dev/null 2>&1; then
        [ -f "$_dfc_module/common/mount_compat.sh" ] && . "$_dfc_module/common/mount_compat.sh"
    fi
    type _dfpr_exec >/dev/null 2>&1 &&
        type _dfpr_prepare_sources >/dev/null 2>&1 &&
        type _dfpr_install_overlay >/dev/null 2>&1 &&
        type luoshu_payload_transaction_begin >/dev/null 2>&1 &&
        type luoshu_payload_transaction_commit >/dev/null 2>&1 &&
        type luoshu_payload_transaction_abort >/dev/null 2>&1 &&
        type luoshu_sync_mount_payload >/dev/null 2>&1
}'''
          if old_runtime not in text:
              raise SystemExit(f'{cache}: runtime loader block not found')
          text = text.replace(old_runtime, new_runtime, 1)
          cache.write_text(text, encoding='utf-8')

          test = Path('android-app/app/src/test/java/io/github/xgl34222220/luoshu/ui/home/DeviceTestMatrixTest.kt')
          text = test.read_text(encoding='utf-8')
          insertion = '''
    @Test
    fun compatibilityMappingIsAcceptedWithoutRedFailure() {
        val state = readyState()
        val checks = deviceAcceptanceAutoChecks(
            state = state,
            trust = DeviceTrustState(
                loading = false,
                inventory = "available",
                engine = "missing",
                alignment = "pending",
                mode = "compatibility",
                cachePending = true,
            ),
        )
        val alignment = checks.single { it.id == "alignment" }
        val cache = checks.single { it.id == "cache" }
        assertTrue(alignment.passed)
        assertFalse(alignment.blocking)
        assertTrue(cache.passed)
        assertFalse(cache.blocking)
    }

    @Test
    fun pendingRebootAndTaskAreInformationalNotFailures() {
        val checks = deviceAcceptanceAutoChecks(
            state = readyState().copy(taskRunning = true, rebootRequired = true),
            trust = DeviceTrustState(
                loading = false,
                inventory = "available",
                engine = "installed",
                alignment = "pending",
                mode = "aligned",
                cachePending = true,
            ),
        )
        assertFalse(checks.single { it.id == "task" }.blocking)
        assertFalse(checks.single { it.id == "reboot" }.blocking)
        assertFalse(checks.single { it.id == "alignment" }.blocking)
        assertFalse(checks.single { it.id == "cache" }.blocking)
    }
'''
          anchor = '    private fun readyState(\n'
          if anchor not in text:
              raise SystemExit(f'{test}: readyState anchor not found')
          text = text.replace(anchor, insertion + '\n' + anchor, 1)
          test.write_text(text, encoding='utf-8')

          Path('.github/workflows/apply-v226-hotfix.yml').unlink(missing_ok=True)
          Path('.github/v226-hotfix-trigger').unlink(missing_ok=True)
          PY

      - name: Validate patch structure
        shell: bash
        run: |
          set -euo pipefail
          sh -n common/util_functions.sh
          sh -n common/device_font_cache.sh
          grep -q 'log_rom_detection_once hyperos' common/util_functions.sh
          grep -q 'compatibilityMappingIsAcceptedWithoutRedFailure' android-app/app/src/test/java/io/github/xgl34222220/luoshu/ui/home/DeviceTestMatrixTest.kt
          grep -q 'type luoshu_sync_mount_payload' common/device_font_cache.sh
          ! test -e .github/workflows/apply-v226-hotfix.yml
          ! test -e .github/v226-hotfix-trigger

      - name: Commit hotfix source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'fix: correct trust states and deduplicate ROM logs'
          git push origin HEAD:hotfix/v2.2.6-trust-log
