name: Authorized v4.4.4 release cleanup

on:
  pull_request:
    branches: [main]
    paths:
      - scripts/cleanup_releases_v444.py
      - scripts/cleanup_releases_v444_test.py
      - .github/workflows/release-cleanup-v4.4.4.yml
  workflow_run:
    workflows: ["Sync online update metadata"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: luoshu-release-cleanup-v444-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/cleanup_releases_v444_test.py

  cleanup:
    needs: test
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.repository == 'xgl34222220-ops/LuoShu'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Verify new stable assets and metadata before authorized cleanup
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          version="$(sed -n 's/^version=//p' module.prop | head -n1)"
          if [ "$version" != v4.4.4 ]; then
            echo 'This one-time cleanup only applies to v4.4.4.'
            exit 0
          fi
          python3 scripts/cleanup_releases_v444.py --apply
      - name: Preserve cleanup audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LuoShu-v4.4.4-release-cleanup-audit
          path: dist/release-cleanup-v4.4.4.json
          if-no-files-found: ignore
          retention-days: 30
