name: Debug App Installer Once

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/debug-app-installer-once.yml

permissions:
  contents: read

jobs:
  trace:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Trace bundled App installer regression
        shell: bash
        run: |
          set -o pipefail
          sh -x scripts/app_installer_test.sh
