name: Debug Stability Tail Once

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/debug-app-installer-once.yml

permissions:
  contents: read

jobs:
  trace:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Verify repaired stability tail
        shell: bash
        run: |
          set -o pipefail
          sh -x scripts/stability_test.sh
