name: Replace v4.0.0 once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/replace-v4-0-0-once.yml

permissions:
  actions: write
  contents: read

jobs:
  dispatch-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Dispatch signed v4.0.0 release workflow from replacement tag
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_TAG_SHA: 0406ee3da74ff8918df63654cb6ceeb88a2409e1
          TAG: v4.0.0
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
          tag_sha="$(git rev-list -n1 "$TAG")"
          [[ "$tag_sha" == "$EXPECTED_TAG_SHA" ]] || {
            echo "Replacement tag moved unexpectedly: $tag_sha" >&2
            exit 2
          }
          version="$(git show "$tag_sha:module.prop" | sed -n 's/^version=//p' | head -n1)"
          code="$(git show "$tag_sha:module.prop" | sed -n 's/^versionCode=//p' | head -n1)"
          [[ "$version" == 'v4.0.0' && "$code" == '40000' ]] || exit 2
          gh workflow run release.yml --ref "$TAG" -f tag="$TAG" -f prerelease=false
          echo "Signed release workflow dispatched for $TAG at $tag_sha"
