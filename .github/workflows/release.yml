name: Publish signed release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
      - 'refactor-v*'
    paths:
      - module.prop
      - 'RELEASE_NOTES_*.md'
      - .github/workflows/release.yml
  workflow_dispatch:
    inputs:
      tag:
        description: Existing immutable tag to publish (for example refactor-v1.0.0)
        required: true
        type: string
      prerelease:
        description: Publish as a GitHub pre-release
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: luoshu-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: android-actions/setup-android@v4
        with:
          packages: ''

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Read and verify release version
        id: version
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail
          python3 scripts/release_version_policy_test.py
          python3 scripts/sync_update_metadata_test.py
          . ./scripts/version.sh
          expected_tag="$LUOSHU_RELEASE_TAG"
          tag="${GITHUB_REF_NAME}"
          mode="tag"
          source_sha="$GITHUB_SHA"
          git fetch --force --tags origin

          if [[ "${GITHUB_EVENT_NAME}" == 'workflow_dispatch' ]]; then
            tag="$INPUT_TAG"
            mode="existing-tag"
            tag_sha="$(git rev-list -n1 "$tag" 2>/dev/null || true)"
            [[ -n "$tag_sha" ]] || { echo "Tag does not exist: $tag" >&2; exit 2; }
            [[ "$tag_sha" == "$GITHUB_SHA" ]] || { echo "Run this workflow from the existing tag $tag" >&2; exit 2; }
            source_sha="$tag_sha"
          elif [[ "${GITHUB_REF_TYPE}" == 'branch' ]]; then
            [[ "${GITHUB_REF_NAME}" == 'main' ]] || { echo "Stable branch publishing only supports main" >&2; exit 2; }
            tag="$expected_tag"
            tag_sha="$(git rev-list -n1 "$tag" 2>/dev/null || true)"
            if [[ -z "$tag_sha" ]]; then
              mode="create-tag"
            else
              git merge-base --is-ancestor "$tag_sha" "$GITHUB_SHA" || {
                echo "Existing tag is not an ancestor of main: $tag -> $tag_sha" >&2
                exit 2
              }
              disallowed_changes="$(git diff --name-only "$tag_sha" "$GITHUB_SHA" -- | grep -Ev '^(RELEASE_NOTES_.*\.md|\.github/workflows/release\.yml)$' || true)"
              [[ -z "$disallowed_changes" ]] || {
                echo "Existing tag differs from main by non-release files:" >&2
                printf '%s\n' "$disallowed_changes" >&2
                exit 2
              }
              mode="existing-tag"
              source_sha="$tag_sha"
            fi
          else
            tag_sha="$(git rev-list -n1 "$tag" 2>/dev/null || true)"
            [[ -n "$tag_sha" && "$tag_sha" == "$GITHUB_SHA" ]] || {
              echo "Tag checkout does not match GITHUB_SHA: $tag" >&2
              exit 2
            }
            source_sha="$tag_sha"
          fi

          [[ "$tag" == "$expected_tag" ]] || {
            echo "Tag $tag does not match module.prop ($expected_tag)" >&2
            exit 2
          }
          notes_file="$LUOSHU_RELEASE_NOTES"
          [[ -s "$notes_file" ]] || { echo "Missing release notes: $notes_file" >&2; exit 2; }
          notes_temp="$RUNNER_TEMP/$notes_file"
          cp -f "$notes_file" "$notes_temp"
          prerelease="${INPUT_PRERELEASE:-false}"
          if grep -q '<!-- prerelease -->' "$notes_file"; then
            prerelease="true"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "version=$LUOSHU_VERSION" >> "$GITHUB_OUTPUT"
          echo "release_title=$LUOSHU_RELEASE_TITLE" >> "$GITHUB_OUTPUT"
          echo "artifact_version=$LUOSHU_ARTIFACT_VERSION" >> "$GITHUB_OUTPUT"
          echo "notes_file=$notes_temp" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"

          if [[ "$source_sha" != "$GITHUB_SHA" ]]; then
            git checkout --detach "$source_sha"
          fi

      - name: Require signing secrets
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.LUOSHU_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.LUOSHU_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.LUOSHU_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.LUOSHU_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for value in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            [[ -n "${!value}" ]] || { echo "Missing repository secret: LUOSHU_${value}" >&2; exit 3; }
          done
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/luoshu-release.jks"
          keytool -list -keystore "$RUNNER_TEMP/luoshu-release.jks" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null

      - name: Install module build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends curl unzip zip file python3-venv mksh fonts-noto-cjk fonts-dejavu-core build-essential pkg-config xz-utils libharfbuzz-dev libpng-dev libbrotli-dev zlib1g-dev libbz2-dev >/dev/null

      - uses: actions/cache@v4
        with:
          path: common/python
          key: luoshu-arm64-runtime-${{ runner.os }}-${{ hashFiles('scripts/prepare_composite_runtime.sh') }}

      - name: Prepare ARM64 composite runtime
        shell: bash
        run: |
          if [[ ! -x common/python/bin/luoshu-python ]]; then
            sh ./scripts/prepare_composite_runtime.sh
          fi

      # Keep the layout verifier on the same FreeType as the original Ubuntu
      # 24.04 build. Jammy's 2.11.1 lacks the HVAR no-variation sentinel support
      # required by the existing variable-font layout gate.
      # This is a host-only dependency and is never bundled into the module.
      - name: Prepare pinned layout renderer
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/freetype-2.13.2.tar.xz"
          prefix="$RUNNER_TEMP/luoshu-freetype-2.13.2"
          curl -fsSL --retry 2 --connect-timeout 15 --max-time 120 \
            https://downloads.sourceforge.net/project/freetype/freetype2/2.13.2/freetype-2.13.2.tar.xz -o "$archive" || \
          curl -fsSL --retry 2 --connect-timeout 15 --max-time 120 \
            https://download.savannah.gnu.org/releases/freetype/freetype-2.13.2.tar.xz -o "$archive" || \
          curl -fsSL --retry 2 --connect-timeout 15 --max-time 120 \
            https://download-mirror.savannah.gnu.org/releases/freetype/freetype-2.13.2.tar.xz -o "$archive"
          printf '12991c4e55c506dd7f9b765933e62fd2be2e06d421505d7950a132e4f1bb484d  %s\n' "$archive" | sha256sum -c -
          tar -xJf "$archive" -C "$RUNNER_TEMP"
          cd "$RUNNER_TEMP/freetype-2.13.2"
          ./configure --prefix="$prefix" --enable-shared --disable-static \
            --with-zlib=yes --with-bzip2=yes --with-png=yes --with-harfbuzz=yes --with-brotli=yes >/dev/null
          make -j2 >/dev/null
          make install >/dev/null
          export LD_LIBRARY_PATH="$prefix/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          printf 'LD_LIBRARY_PATH=%s\n' "$LD_LIBRARY_PATH" >> "$GITHUB_ENV"
          python3 - "$prefix" <<'PY'
          import ctypes as C
          import ctypes.util
          from pathlib import Path
          import sys
          api = C.CDLL(ctypes.util.find_library('freetype'))
          library = C.c_void_p()
          assert api.FT_Init_FreeType(C.byref(library)) == 0
          version = [C.c_int() for _ in range(3)]
          api.FT_Library_Version(library, *(C.byref(value) for value in version))
          assert tuple(value.value for value in version) == (2, 13, 2)
          assert str(Path(sys.argv[1]).resolve() / 'lib/libfreetype.so') in Path('/proc/self/maps').read_text()
          assert api.FT_Done_FreeType(library) == 0
          print('Verified isolated host FreeType 2.13.2')
          PY

      - name: Run source checks
        shell: bash
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/luoshu-source-check.log"
          if ! sh ./scripts/check.sh >"$log" 2>&1; then
            echo '源码门禁失败，输出最后 180 行：' >&2
            tail -n 180 "$log" >&2
            mkdir -p dist
            cp -f "$log" dist/source-check.log
            exit 1
          fi
          cat "$log"

      - name: Run supplemental candidate gates
        run: |
          set -eu
          PYTHONPATH="$PWD/common/python/lib/python3.14/site-packages${PYTHONPATH:+:$PYTHONPATH}"
          export PYTHONPATH
          python3 scripts/task_scope_mksh_test.py
          python3 scripts/font_lock_namespace_test.py
          python3 scripts/font_state_read_test.py
          sh -x scripts/background_task_test.sh
          sh -x scripts/device_font_foreground_quick_test.sh
          sh -x scripts/font_switch_task_test.sh
          sh -x scripts/mount_fast_sync_test.sh
          FONT="$(find /usr/share/fonts -type f -iname 'DejaVuSans.ttf' -print -quit)"
          test -s "$FONT"
          python3 scripts/font_inventory_scan_test.py --font "$FONT"
          grep -q '多字重 · ${weights.size} 档' android-app/app/src/main/java/io/github/xgl34222220/luoshu/ui/font/FontUiSupport.kt
          grep -q '静态字体现在始终按当前所选字重走快速单文件组合' common/mix_weight_mode.sh

      - name: Lint, test and build signed release App
        working-directory: android-app
        env:
          LUOSHU_KEYSTORE_FILE: ${{ runner.temp }}/luoshu-release.jks
          LUOSHU_KEYSTORE_PASSWORD: ${{ secrets.LUOSHU_KEYSTORE_PASSWORD }}
          LUOSHU_KEY_ALIAS: ${{ secrets.LUOSHU_KEY_ALIAS }}
          LUOSHU_KEY_PASSWORD: ${{ secrets.LUOSHU_KEY_PASSWORD }}
        run: gradle --no-daemon --stacktrace :app:lintRelease :app:testDebugUnitTest :app:assembleRelease

      - name: Verify APK signature certificate
        shell: bash
        env:
          EXPECTED_CERT_SHA256: e0043b560a10111d3ffddd3a7afba680b854e14ed793c7a3fdb7f8b7aa95ff27
        run: |
          set -euo pipefail
          apk='android-app/app/build/outputs/apk/release/app-release.apk'
          test -s "$apk"
          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n1)"
          test -x "$apksigner"
          "$apksigner" verify --verbose --print-certs "$apk" | tee "$RUNNER_TEMP/apk-signature.txt"
          grep -Eq '^Verified using v(2|3|3\.1|3\.2) scheme.*: true$' "$RUNNER_TEMP/apk-signature.txt"
          grep -qx 'Number of signers: 1' "$RUNNER_TEMP/apk-signature.txt"
          actual_cert="$(
            awk -F': ' '/Signer.*certificate SHA-256 digest:/ {print $NF; exit}' \
              "$RUNNER_TEMP/apk-signature.txt" |
              tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]'
          )"
          [[ "$actual_cert" == "$EXPECTED_CERT_SHA256" ]] || {
            echo "Release certificate mismatch: $actual_cert" >&2
            exit 3
          }

      - name: Build App and single module package
        shell: bash
        run: |
          set -euo pipefail
          . ./scripts/version.sh
          apk='android-app/app/build/outputs/apk/release/app-release.apk'
          test -s "$apk"
          mkdir -p dist
          app="dist/LuoShu-App-${LUOSHU_ARTIFACT_VERSION}.apk"
          cp -f "$apk" "$app"
          (cd dist && sha256sum "$(basename "$app")" > "$(basename "$app").sha256")
          LUOSHU_APP_APK="$apk" sh ./scripts/build.sh
          module="dist/LuoShu-${LUOSHU_ARTIFACT_VERSION}.zip"
          test -s "$module"
          unzip -t "$module" >/dev/null
          unzip -Z1 "$module" > "$RUNNER_TEMP/luoshu-release-files.txt"
          grep -qx 'bundled/LuoShu-App.apk' "$RUNNER_TEMP/luoshu-release-files.txt"
          ! grep -qE '(^|/)webroot(/|$)' "$RUNNER_TEMP/luoshu-release-files.txt"
          unzip -p "$module" bundled/LuoShu-App.apk > "$RUNNER_TEMP/embedded.apk"
          cmp -s "$apk" "$RUNNER_TEMP/embedded.apk"
          (cd dist && sha256sum -c "$(basename "$module").sha256")
          (cd dist && sha256sum -c "$(basename "$app").sha256")

      - name: Verify final release package
        shell: bash
        run: |
          set -euxo pipefail
          . ./scripts/version.sh
          module="dist/LuoShu-${LUOSHU_ARTIFACT_VERSION}.zip"
          app="dist/LuoShu-App-${LUOSHU_ARTIFACT_VERSION}.apk"
          test -s "$module"
          test -s "$app"
          unzip -t "$module" >/dev/null
          (cd dist && sha256sum -c "$(basename "$module").sha256")
          (cd dist && sha256sum -c "$(basename "$app").sha256")
          test "$(unzip -p "$module" module.prop | sed -n 's/^version=//p')" = "$LUOSHU_VERSION"
          test "$(unzip -p "$module" module.prop | sed -n 's/^versionCode=//p')" = "$LUOSHU_VERSION_CODE"
          test "$(unzip -p "$module" bundled/app.prop | sed -n 's/^versionCode=//p')" = "$LUOSHU_APP_VERSION_CODE"
          unzip -Z1 "$module" > /tmp/luoshu-candidate-files.txt
          for path in \
            common/background_task.sh \
            common/task_scope.py \
            common/task_scope.sh \
            common/runtime_paths.sh \
            common/runtime_paths_lock.py \
            common/device_font_template.sh \
            common/device_font_cache.sh \
            common/device_font_load_verify.py \
            common/device_font_load_verify.sh \
            common/device_font_payload_policy.sh \
            common/device_font_transaction_guard.sh \
            common/device_font_dynamic_guard.sh \
            common/device_font_runtime_report.sh \
            common/font_archive_export.sh \
            common/font_inventory.py \
            common/font_inventory_scan.py \
            common/font_switch_task.sh \
            common/legacy_v14_4/payload_clone.sh \
            common/mix_weight_mode.sh \
            common/mount_fast_sync.sh; do
            grep -qx "$path" /tmp/luoshu-candidate-files.txt
          done
          unzip -p "$module" common/background_task.sh | grep -q '_lsd_task'
          unzip -p "$module" common/background_task.sh | grep -q 'every new worker wrote an empty .task sidecar'
          unzip -p "$module" common/device_font_template.sh | grep -q 'CAPTURE_REVISION=2'
          unzip -p "$module" common/device_font_cache.sh | grep -q 'alignment-cache-v4'
          unzip -p "$module" common/device_font_cache.sh | grep -q '.font_switch.lock'
          unzip -p "$module" common/device_font_load_verify.py | grep -q 'device-font-load-verification-v1'
          unzip -p "$module" common/device_font_load_verify.sh | grep -q 'device_font_load_verify'
          unzip -p "$module" common/device_font_payload_policy.sh | grep -q '_device_font_fast_map'
          unzip -p "$module" common/device_font_payload_policy.sh | grep -q 'device_font_cache_schedule'
          unzip -p "$module" common/device_font_dynamic_guard.sh | grep -q '_dfpr_launch_pending_cache'
          unzip -p "$module" common/device_font_dynamic_guard.sh | grep -q 'device_font_load_verify'
          unzip -p "$module" common/font_archive_export.sh | grep -q '归档目标目录不受信任'
          unzip -p "$module" common/font_archive_export.sh | grep -q '1073741824'
          unzip -p "$module" common/font_inventory.py | grep -q 'device_font_inventory.json'
                    unzip -p "$module" common/font_inventory_scan.py | grep -q 'SCANNER_REVISION = 4'
          unzip -p "$module" common/font_inventory_scan.py | grep -q 'stockFontUniqueFileCount'
          unzip -p "$module" common/font_inventory_scan.py | grep -q 'themeOverrideRoots'
          unzip -p "$module" common/mix_weight_mode.sh | grep -q '快速单文件组合'
          unzip -p "$module" .luoshu-runtime/compat/v227/customize.sh | grep -q '原厂字体文件'
          unzip -p "$module" .luoshu-runtime/compat/v227/customize.sh | grep -q 'XML .* 通用探测 .* OEM 规则'
          unzip -p "$module" common/font_switch_task.sh | grep -q 'TIMEOUT_SECONDS'
          unzip -p "$module" common/font_switch_task.sh | grep -q '当前启动字体未被改动'
          unzip -p "$module" common/mount_fast_sync.sh | grep -q 'cp -al'
          unzip -p "$module" common/app_bridge.sh | grep -q 'FONT_SWITCH_TASK'
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          unzip -q "$module" -d "$tmp"
          # Test the delivered installer after the same 0644 normalization used
          # by Root managers, without the migration helper's host-Python override.
          sh scripts/installer_bootstrap_test.sh "$tmp"
          python3 scripts/task_scope_legacy_test.py "$tmp"
          python3 scripts/task_scope_namespace_test.py "$tmp"
          python3 scripts/task_scope_diagnostic_test.py "$tmp"
          python3 scripts/task_scope_mksh_test.py "$tmp"
          python3 scripts/font_lock_namespace_test.py "$tmp"
          python3 scripts/font_state_read_test.py "$tmp"
          python3 scripts/task_scope_namespace_lifecycle_test.py "$tmp"
          python3 scripts/installer_task_cleanup_test.py "$tmp"
          python3 scripts/stable111_rework_gate.py --zip "$module"
          python3 -m py_compile "$tmp/common/font_inventory.py" "$tmp/common/font_inventory_scan.py" "$tmp/common/task_scope.py" "$tmp/common/runtime_paths_lock.py"
          sh -n "$tmp/customize.sh"
          sh -n "$tmp/common/background_task.sh"
          sh -n "$tmp/common/device_font_template.sh"
          sh -n "$tmp/common/device_font_cache.sh"
          sh -n "$tmp/common/device_font_load_verify.sh"
          sh -n "$tmp/common/device_font_payload_policy.sh"
          sh -n "$tmp/common/font_archive_export.sh"
          sh -n "$tmp/common/font_switch_task.sh"
          sh -n "$tmp/common/mix_weight_mode.sh"
          sh -n "$tmp/common/mount_fast_sync.sh"
          sh -n "$tmp/service.sh"
          sh -n scripts/pre_release_readiness.sh

      - name: Enforce release readiness
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          set -euo pipefail
          args=(--target "$VERSION" --enforce)
          if [[ "$PRERELEASE" != 'true' ]]; then
            authorization='config/stable_release_authorization.conf'
            explicitly_authorized=false
            if [[ -f "$authorization" ]] \
              && grep -qx "version=$VERSION" "$authorization" \
              && grep -qx 'scope=stable-release' "$authorization" \
              && grep -qx 'allowPendingDeviceMatrix=true' "$authorization"; then
              explicitly_authorized=true
            fi
            if [[ "$explicitly_authorized" == true ]]; then
              echo "::warning::$VERSION stable release is explicitly authorized with the device matrix still pending; no device validation result is being fabricated."
            else
              args+=(--stable)
            fi
          fi
          sh ./scripts/pre_release_readiness.sh "${args[@]}"

      - name: Preserve verified release candidate
        uses: actions/upload-artifact@v4
        with:
          name: LuoShu-${{ steps.version.outputs.artifact_version }}-verified-release
          path: |
            dist/LuoShu-${{ steps.version.outputs.artifact_version }}.zip
            dist/LuoShu-${{ steps.version.outputs.artifact_version }}.zip.sha256
            dist/LuoShu-App-${{ steps.version.outputs.artifact_version }}.apk
            dist/LuoShu-App-${{ steps.version.outputs.artifact_version }}.apk.sha256
            dist/pre-release-readiness/
          if-no-files-found: error
          retention-days: 14

      - name: Publish immutable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          MODE: ${{ steps.version.outputs.mode }}
          VERSION: ${{ steps.version.outputs.version }}
          ARTIFACT_VERSION: ${{ steps.version.outputs.artifact_version }}
          NOTES_FILE: ${{ steps.version.outputs.notes_file }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
          SOURCE_SHA: ${{ steps.version.outputs.source_sha }}
          RELEASE_TITLE: ${{ steps.version.outputs.release_title }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force --tags origin
          if [[ "$MODE" == 'create-tag' ]]; then
            git fetch origin main
            main_sha="$(git rev-parse origin/main)"
            [[ "$main_sha" == "$GITHUB_SHA" ]] || {
              echo "main moved after validation: $main_sha != $GITHUB_SHA" >&2
              exit 4
            }
            [[ -z "$(git rev-list -n1 "$TAG" 2>/dev/null || true)" ]] || {
              echo "Tag appeared during validation: $TAG" >&2
              exit 4
            }
          elif gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; immutable releases are never overwritten." >&2
            exit 4
          fi

          module="dist/LuoShu-${ARTIFACT_VERSION}.zip"
          module_sha="${module}.sha256"
          app="dist/LuoShu-App-${ARTIFACT_VERSION}.apk"
          app_sha="${app}.sha256"
          for file in "$module" "$module_sha" "$app" "$app_sha"; do test -s "$file"; done

          prerelease=()
          case "$VERSION" in *Alpha*|*Beta*|*RC*) prerelease=(--prerelease) ;; esac
          if [[ "$PRERELEASE" == 'true' ]]; then
            prerelease=(--prerelease)
          fi
          tag_mode=(--verify-tag)
          if [[ "$MODE" == 'create-tag' ]]; then
            tag_mode=(--target "$SOURCE_SHA")
          fi
          latest=(--latest)
          if [[ "${#prerelease[@]}" -gt 0 ]]; then latest=(--latest=false); fi
          gh release create "$TAG" "$module" "$module_sha" "$app" "$app_sha" \
            "${tag_mode[@]}" \
            --title "$RELEASE_TITLE" \
            --notes-file "$NOTES_FILE" \
            "${prerelease[@]}" "${latest[@]}"
