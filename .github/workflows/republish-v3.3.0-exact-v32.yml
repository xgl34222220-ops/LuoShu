name: Republish v3.3.0 exact v3.2 apply backend

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/republish-v3.3.0-exact-v32.yml

permissions:
  contents: write

jobs:
  republish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: f601ff840a2261e0ef4f0f6cb3bfeb2f4321b501
          fetch-depth: 0

      - uses: android-actions/setup-android@v3

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends curl unzip zip file python3-venv fonts-noto-cjk fonts-dejavu-core >/dev/null

      - uses: actions/cache@v4
        with:
          path: common/python
          key: luoshu-arm64-runtime-${{ runner.os }}-${{ hashFiles('scripts/prepare_composite_runtime.sh') }}

      - name: Prepare runtime and verify exact v3.2 apply backend
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -x common/python/bin/luoshu-python ]]; then
            sh ./scripts/prepare_composite_runtime.sh
          fi
          test "$(git rev-parse HEAD)" = 'f601ff840a2261e0ef4f0f6cb3bfeb2f4321b501'
          test "$(git rev-parse v3.2.0:common/rom_adapters.sh)" = "$(git rev-parse HEAD:common/rom_adapters.sh)"
          sh ./scripts/check.sh

      - name: Reuse and verify signed v3.3.0 App
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_CERT_SHA256: e0043b560a10111d3ffddd3a7afba680b854e14ed793c7a3fdb7f8b7aa95ff27
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          gh release download v3.3.0 -p 'LuoShu-App-v3.3.0.apk' -D dist
          apk='dist/LuoShu-App-v3.3.0.apk'
          test -s "$apk"
          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n1)"
          test -x "$apksigner"
          "$apksigner" verify --verbose --print-certs "$apk" | tee "$RUNNER_TEMP/apk-signature.txt"
          grep -Eq '^Verified using v(2|3|3\.1|3\.2) scheme.*: true$' "$RUNNER_TEMP/apk-signature.txt"
          grep -qx 'Number of signers: 1' "$RUNNER_TEMP/apk-signature.txt"
          actual_cert="$(awk -F': ' '/Signer.*certificate SHA-256 digest:/ {print $NF; exit}' "$RUNNER_TEMP/apk-signature.txt" | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')"
          test "$actual_cert" = "$EXPECTED_CERT_SHA256"
          (cd dist && sha256sum LuoShu-App-v3.3.0.apk > LuoShu-App-v3.3.0.apk.sha256)

      - name: Build corrected v3.3.0 module
        shell: bash
        run: |
          set -euo pipefail
          apk='dist/LuoShu-App-v3.3.0.apk'
          LUOSHU_APP_APK="$apk" sh ./scripts/build.sh
          module='dist/LuoShu-v3.3.0.zip'
          test -s "$module"
          unzip -t "$module" >/dev/null
          unzip -Z1 "$module" | grep -qx 'bundled/LuoShu-App.apk'
          unzip -p "$module" bundled/LuoShu-App.apk > "$RUNNER_TEMP/embedded.apk"
          cmp -s "$apk" "$RUNNER_TEMP/embedded.apk"
          (cd dist && sha256sum -c LuoShu-v3.3.0.zip.sha256)

      - name: Move v3.3.0 tag and replace release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          target='f601ff840a2261e0ef4f0f6cb3bfeb2f4321b501'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -f v3.3.0 "$target"
          git push --force origin refs/tags/v3.3.0
          gh release delete v3.3.0 --yes || true
          gh release create v3.3.0 \
            dist/LuoShu-v3.3.0.zip \
            dist/LuoShu-v3.3.0.zip.sha256 \
            dist/LuoShu-App-v3.3.0.apk \
            dist/LuoShu-App-v3.3.0.apk.sha256 \
            --verify-tag \
            --title '洛书 v3.3.0' \
            --notes-file RELEASE_NOTES_v3.3.0.md
          gh release view v3.3.0 --json tagName,publishedAt,url,assets
