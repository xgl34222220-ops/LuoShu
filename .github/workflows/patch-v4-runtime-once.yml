name: Patch v4 runtime once

on:
  push:
    branches: [ main ]
    paths:
      - .github/workflows/patch-v4-runtime-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v4.0.0-rom-metrics-reboot
          fetch-depth: 0
      - name: Apply targeted runtime fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def replace(path, old, new, count=1):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'pattern missing: {path}: {old[:80]!r}')
              text2 = text.replace(old, new, count)
              p.write_text(text2)

          # HyperOS: preserve source/composite vertical metrics. The generic normalizer uses one
          # main-slot contract for every slot, which can shift labels/input text on Xiaomi ROMs.
          p = Path('common/rom_adapters.sh')
          text = p.read_text()
          old = '''    anchor="$dest_dir/.luoshu-font-store/${key}.font"\n    module="${MODULE_DIR:-${MODDIR:-/data/adb/modules/LuoShu}}"\n    normalizer="$module/common/font_metrics_normalize.py"\n    rm -f "$anchor" 2>/dev/null || true\n'''
          new = '''    anchor="$dest_dir/.luoshu-font-store/${key}.font"\n    module="${MODULE_DIR:-${MODDIR:-/data/adb/modules/LuoShu}}"\n    normalizer="$module/common/font_metrics_normalize.py"\n    rm -f "$anchor" 2>/dev/null || true\n\n    # HyperOS has several independent physical font slots with different line-box contracts.\n    # Applying one main-slot hhea/OS2 contract to all of them moves text vertically in compact\n    # labels and EditText controls. Preserve the selected font/composite metrics on HyperOS;\n    # the ROM-specific mapper still selects only real UI slots and keeps protected scripts stock.\n    if [ "${IS_HYPEROS:-false}" = true ] && type _hyperos_compact_normalize >/dev/null 2>&1; then\n        if _hyperos_compact_normalize "$src" "$anchor" && [ -s "$anchor" ]; then\n            printf '%s\\n' "$anchor"\n            return 0\n        fi\n        rm -f "$anchor" 2>/dev/null || true\n    fi\n'''
          if old not in text:
              raise SystemExit('rom_adapters anchor pattern missing')
          p.write_text(text.replace(old, new, 1))

          # HyperOS composite payload: mirror only font files that physically exist on each extra
          # partition. This closes Latin/digit gaps without inventing paths or touching ColorOS.
          p = Path('common/font_mix.sh')
          text = p.read_text()
          old = '''    if [ -d "${LUOSHU_MI_EXT_FONTS_ROOT:-/mi_ext/fonts}" ]; then\n        sync_secondary_partition mi_ext "${LUOSHU_MI_EXT_FONTS_ROOT:-/mi_ext/fonts}" || return 1\n    fi\n    return 0\n}\n'''
          new = '''    if [ -d "${LUOSHU_MI_EXT_FONTS_ROOT:-/mi_ext/fonts}" ]; then\n        sync_secondary_partition mi_ext "${LUOSHU_MI_EXT_FONTS_ROOT:-/mi_ext/fonts}" || return 1\n    fi\n    for _pair in \\\n        "vendor|${LUOSHU_VENDOR_FONTS_ROOT:-/vendor/fonts}" \\\n        "odm|${LUOSHU_ODM_FONTS_ROOT:-/odm/fonts}" \\\n        "oem|${LUOSHU_OEM_FONTS_ROOT:-/oem/fonts}" \\\n        "my_product|${LUOSHU_MY_PRODUCT_FONTS_ROOT:-/my_product/fonts}" \\\n        "hw_product|${LUOSHU_HW_PRODUCT_FONTS_ROOT:-/hw_product/fonts}" \\\n        "cust|${LUOSHU_CUST_FONTS_ROOT:-/cust/fonts}"; do\n        _part=${_pair%%|*}\n        _root=${_pair#*|}\n        [ -d "$_root" ] || continue\n        sync_secondary_partition "$_part" "$_root" || return 1\n    done\n    return 0\n}\n'''
          if old not in text:
              raise SystemExit('font_mix sync pattern missing')
          text = text.replace(old, new, 1)
          p.write_text(text)

          # A degraded self-mount means system/fonts is already active and only a secondary
          # partition fell back. Treat that as positive boot evidence instead of a false failure.
          replace(
              'common/device_font_load_verify.sh',
              '''        mounted:booting|mounted:confirmed|confirmed:booting|confirmed:confirmed) return 0 ;;''',
              '''        mounted:booting|mounted:confirmed|confirmed:booting|confirmed:confirmed|degraded:booting|degraded:confirmed) return 0 ;;'''
          )

          # Never destroy the selected font merely because late boot verification is inconclusive.
          p = Path('common/font_runtime_policy.sh')
          text = p.read_text()
          pattern = re.compile(r'''luoshu_payload_quarantine\(\) \{.*?\n\}\n\n# Self-mount reads the private tree directly\.''', re.S)
          m = pattern.search(text)
          if not m:
              raise SystemExit('quarantine function not found')
          replacement = '''luoshu_payload_quarantine() {\n    _lfrp_config=$(_lfrp_config_root)\n    _lfrp_fail=$(cat "$_lfrp_config/font-boot-failures" 2>/dev/null)\n    case "$_lfrp_fail" in ''|*[!0-9]*) _lfrp_fail=0 ;; esac\n    _lfrp_fail=$((_lfrp_fail + 1))\n    printf '%s\\n' "$_lfrp_fail" > "$_lfrp_config/font-boot-failures" 2>/dev/null || true\n    _lfrp_active=$(head -n1 "$_lfrp_config/active_font.conf" 2>/dev/null | tr -d '\\r\\n')\n    [ -n "$_lfrp_active" ] || _lfrp_active=default\n    {\n        printf 'state=held\\n'\n        printf 'activeFont=%s\\n' "$_lfrp_active"\n        printf 'failures=%s\\n' "$_lfrp_fail"\n        printf 'reason=boot-verification-inconclusive\\n'\n        printf 'time=%s\\n' "$(date +%s 2>/dev/null || echo 0)"\n    } > "$_lfrp_config/font-payload-quarantine.conf" 2>/dev/null || true\n    _luoshu_safety_log WARN "字体启动证据不足，已保留当前字体选择与负载，等待下一次挂载验证（failure=$_lfrp_fail active=$_lfrp_active）"\n    return 2\n}\n\n# Self-mount reads the private tree directly.'''
          p.write_text(text[:m.start()] + replacement + text[m.end():])

          # service.sh must not contain a second fallback that writes default after three misses.
          p = Path('service_v4.sh')
          text = p.read_text()
          old = '''                    else\n                        rm -f "$_mount_fail_file" 2>/dev/null || true\n                        if type luoshu_payload_quarantine >/dev/null 2>&1; then\n                            luoshu_payload_quarantine\n                        else\n                            printf 'default\\n' > "$MODDIR/config/active_font.conf" 2>/dev/null || true\n                        fi\n                        log_service "ERROR" "字体挂载连续三次不可见，已安全恢复系统默认字体"\n                        notify_service "洛书" "字体挂载连续失败，已安全恢复系统默认字体；请打开洛书重新应用或导出诊断。" luoshu-font-mount\n                    fi\n'''
          new = '''                    else\n                        # Three inconclusive probes are not proof that the selected font is bad.\n                        # Keep both active_font.conf and the committed payload. A later verified\n                        # mount may converge without forcing the user back to the ROM default.\n                        printf '3\\n' > "$_mount_fail_file" 2>/dev/null || true\n                        {\n                            printf 'state=prepared\\n'\n                            printf 'font=%s\\n' "$_active_verify"\n                            printf 'time=%s\\n' "$(date +%s 2>/dev/null || echo 0)"\n                            printf 'reason=mount-verification-inconclusive\\n'\n                        } > "$MODDIR/config/font-payload-boot.conf.tmp.$$" 2>/dev/null && \\\n                            mv -f "$MODDIR/config/font-payload-boot.conf.tmp.$$" "$MODDIR/config/font-payload-boot.conf" 2>/dev/null || true\n                        type luoshu_payload_quarantine >/dev/null 2>&1 && luoshu_payload_quarantine >/dev/null 2>&1 || true\n                        log_service "ERROR" "字体挂载连续三次未取得完整证据；已保留当前字体选择和负载，不自动恢复默认字体"\n                        notify_service "洛书" "字体挂载验证仍未收敛，已保留当前字体与负载；请导出诊断，不会自动切回系统默认字体。" luoshu-font-mount\n                    fi\n'''
          if old not in text:
              raise SystemExit('service quarantine block missing')
          p.write_text(text.replace(old, new, 1))

          # Complete reboot is an escape hatch; stale UI busy flags must never swallow the tap.
          p = Path('android-app/app/src/main/java/io/github/xgl34222220/luoshu/LuoShuViewModel.kt')
          text = p.read_text()
          old = '''    fun rebootDevice() {\n        if (operationBusy || mixState.busy) return\n        operationBusy = true\n        operationMessage = "正在请求重启…"\n        viewModelScope.launch {\n            val result = RootShell.exec("sh ${RootShell.quote(bridge)} reboot", timeoutMs = 20_000L)\n            if (result.code != 0) {\n                operationMessage = result.stderr.ifBlank { "重启请求失败" }\n                operationBusy = false\n            }\n        }\n    }\n'''
          new = '''    fun rebootDevice() {\n        // Complete reboot is deliberately independent from font-task busy state. A stale worker\n        // flag used to make the button look dead for tens of seconds even though reboot itself is\n        // immediate. The shell bridge backgrounds the reboot command, so use a short request timeout.\n        operationMessage = "正在请求完整重启…"\n        viewModelScope.launch {\n            val result = RootShell.exec("sh ${RootShell.quote(bridge)} reboot", timeoutMs = 4_000L)\n            if (result.code != 0) {\n                operationMessage = result.stderr.ifBlank { "重启请求失败" }\n            }\n        }\n    }\n'''
          if old not in text:
              raise SystemExit('ViewModel reboot block missing')
          p.write_text(text.replace(old, new, 1))

          # Reboot backend: no artificial one-second delay.
          replace(
              'common/font_manager_v4.sh',
              '''            (sleep 1; svc power reboot 2>/dev/null || reboot 2>/dev/null) &''',
              '''            (svc power reboot 2>/dev/null || reboot 2>/dev/null) </dev/null >/dev/null 2>&1 &'''
          )

          # Regression guard: no production path may rewrite active_font to default on boot verify.
          Path('scripts/v4_rom_regression_test.sh').write_text(r'''#!/bin/sh
          set -eu
          grep -q 'degraded:booting.*degraded:confirmed' common/device_font_load_verify.sh
          ! grep -A45 '^luoshu_payload_quarantine()' common/font_runtime_policy.sh | grep -q "printf 'default"
          ! grep -q '字体挂载连续三次不可见，已安全恢复系统默认字体' service_v4.sh
          grep -q 'mount-verification-inconclusive' service_v4.sh
          grep -q 'if \[ "${IS_HYPEROS:-false}" = true \].*_hyperos_compact_normalize' common/rom_adapters.sh
          grep -q 'my_product|${LUOSHU_MY_PRODUCT_FONTS_ROOT' common/font_mix.sh
          grep -q 'fun rebootDevice()' android-app/app/src/main/java/io/github/xgl34222220/luoshu/LuoShuViewModel.kt
          ! grep -A12 'fun rebootDevice()' android-app/app/src/main/java/io/github/xgl34222220/luoshu/LuoShuViewModel.kt | grep -q 'operationBusy || mixState.busy'
          echo 'v4 ROM regression guards passed'
          ''')
          PY
          chmod +x scripts/v4_rom_regression_test.sh
          sh scripts/v4_rom_regression_test.sh
      - name: Commit fixes
        run: |
          git config user.name xgl34222220-ops
          git config user.email xgl34222220@gmail.com
          git add common/rom_adapters.sh common/font_mix.sh common/device_font_load_verify.sh common/font_runtime_policy.sh service_v4.sh common/font_manager_v4.sh android-app/app/src/main/java/io/github/xgl34222220/luoshu/LuoShuViewModel.kt scripts/v4_rom_regression_test.sh
          git commit -m 'fix: stabilize v4 ROM fonts and complete reboot'
          git push origin HEAD:fix/v4.0.0-rom-metrics-reboot
