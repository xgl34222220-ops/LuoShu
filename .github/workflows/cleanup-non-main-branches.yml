name: Cleanup non-main branches

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/cleanup-non-main-branches.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Delete every branch except main and record result
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t before < <(
            gh api --paginate "repos/${GITHUB_REPOSITORY}/branches?per_page=100" \
              --jq '.[].name'
          )

          deleted=()
          for branch in "${before[@]}"; do
            if [[ "$branch" == "main" ]]; then
              continue
            fi

            encoded_branch="$(jq -rn --arg value "$branch" '$value | @uri')"
            echo "Deleting branch: $branch"
            gh api --method DELETE \
              "repos/${GITHUB_REPOSITORY}/git/refs/heads/${encoded_branch}"
            deleted+=("$branch")
          done

          mapfile -t after < <(
            gh api --paginate "repos/${GITHUB_REPOSITORY}/branches?per_page=100" \
              --jq '.[].name'
          )

          jq -n \
            --argjson before "$(printf '%s\n' "${before[@]}" | jq -R . | jq -s .)" \
            --argjson deleted "$(printf '%s\n' "${deleted[@]:-}" | sed '/^$/d' | jq -R . | jq -s .)" \
            --argjson after "$(printf '%s\n' "${after[@]}" | jq -R . | jq -s .)" \
            --arg run_id "$GITHUB_RUN_ID" \
            '{before: $before, deleted: $deleted, after: $after, run_id: $run_id}' \
            > .github/branch-cleanup-report.json

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/branch-cleanup-report.json
          git commit -m "chore: record branch cleanup result [skip ci]" || true
          git push origin HEAD:main
