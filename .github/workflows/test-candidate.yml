name: Build Test Candidate
on:
  workflow_dispatch:
  push:
    branches:
      - claude/laughing-hypatia-ogd2oz
    paths:
      - common/**
      - scripts/**
      - android-app/**
      - customize.sh
      - uninstall.sh
      - module.prop
      - .github/workflows/test-candidate.yml
  pull_request:
    branches:
      - main
    paths:
      - module.prop
      - config/version_notes.conf
      - common/**
      - scripts/**
      - android-app/**
      - customize.sh
      - post-fs-data.sh
      - post-mount.sh
      - service.sh
      - uninstall.sh
      - action.sh
      - .github/workflows/test-candidate.yml
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4
        with:
          packages: ''

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends curl unzip zip file python3-venv fonts-noto-cjk fonts-dejavu-core build-essential pkg-config xz-utils libharfbuzz-dev libpng-dev libbrotli-dev zlib1g-dev libbz2-dev >/dev/null

      - uses: actions/cache@v4
        with:
          path: common/python
          key: luoshu-arm64-runtime-${{ runner.os }}-${{ hashFiles('scripts/prepare_composite_runtime.sh') }}

      - name: Prepare ARM64 runtime
        run: |
          if [ ! -x common/python/bin/luoshu-python ]; then
            sh ./scripts/prepare_composite_runtime.sh
          fi

      # Keep the layout verifier on the same FreeType as the original Ubuntu
      # 24.04 build. Jammy's 2.11.1 lacks the HVAR no-variation sentinel support
      # required by the existing variable-font layout gate.
      # This is a host-only dependency and is never bundled into the module.
      - name: Prepare pinned layout renderer
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/freetype-2.13.2.tar.xz"
          prefix="$RUNNER_TEMP/luoshu-freetype-2.13.2"
          curl -fsSL --retry 2 --connect-timeout 15 --max-time 120 \
            https://download.savannah.gnu.org/releases/freetype/freetype-2.13.2.tar.xz -o "$archive" || \
          curl -fsSL --retry 2 --connect-timeout 15 --max-time 120 \
            https://download-mirror.savannah.gnu.org/releases/freetype/freetype-2.13.2.tar.xz -o "$archive"
          printf '12991c4e55c506dd7f9b765933e62fd2be2e06d421505d7950a132e4f1bb484d  %s\n' "$archive" | sha256sum -c -
          tar -xJf "$archive" -C "$RUNNER_TEMP"
          cd "$RUNNER_TEMP/freetype-2.13.2"
          ./configure --prefix="$prefix" --enable-shared --disable-static \
            --with-zlib=yes --with-bzip2=yes --with-png=yes --with-harfbuzz=yes --with-brotli=yes >/dev/null
          make -j2 >/dev/null
          make install >/dev/null
          export LD_LIBRARY_PATH="$prefix/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          printf 'LD_LIBRARY_PATH=%s\n' "$LD_LIBRARY_PATH" >> "$GITHUB_ENV"
          python3 - "$prefix" <<'PY'
          import ctypes as C
          import ctypes.util
          from pathlib import Path
          import sys
          api = C.CDLL(ctypes.util.find_library('freetype'))
          library = C.c_void_p()
          assert api.FT_Init_FreeType(C.byref(library)) == 0
          version = [C.c_int() for _ in range(3)]
          api.FT_Library_Version(library, *(C.byref(value) for value in version))
          assert tuple(value.value for value in version) == (2, 13, 2)
          assert str(Path(sys.argv[1]).resolve() / 'lib/libfreetype.so') in Path('/proc/self/maps').read_text()
          assert api.FT_Done_FreeType(library) == 0
          print('Verified isolated host FreeType 2.13.2')
          PY

      - name: Run source checks
        shell: bash
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/luoshu-source-check.log"
          if ! sh ./scripts/check.sh >"$log" 2>&1; then
            echo '源码门禁失败，输出最后 180 行：' >&2
            tail -n 180 "$log" >&2
            mkdir -p dist
            cp -f "$log" dist/source-check.log
            exit 1
          fi
          cat "$log"

      - name: Run supplemental candidate gates
        run: |
          set -eu
          PYTHONPATH="$PWD/common/python/lib/python3.14/site-packages${PYTHONPATH:+:$PYTHONPATH}"
          export PYTHONPATH
          sh -x scripts/background_task_test.sh
          sh -x scripts/device_font_foreground_quick_test.sh
          sh -x scripts/font_switch_task_test.sh
          sh -x scripts/mount_fast_sync_test.sh
          FONT="$(find /usr/share/fonts -type f -iname 'DejaVuSans.ttf' -print -quit)"
          test -s "$FONT"
          python3 scripts/font_inventory_scan_test.py --font "$FONT"
          grep -q '多字重 · ${weights.size} 档' android-app/app/src/main/java/io/github/xgl34222220/luoshu/ui/font/FontUiSupport.kt
          grep -q '静态字体现在始终按当前所选字重走快速单文件组合' common/mix_weight_mode.sh

      - name: Enforce current pre-release readiness
        shell: bash
        run: sh scripts/pre_release_readiness.sh --enforce --output "$RUNNER_TEMP/pre-release-readiness"

      # Build a signed candidate with the existing production identity. This
      # workflow uploads artifacts only; it creates no tag or public release.
      - name: Prepare candidate signing
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.LUOSHU_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.LUOSHU_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.LUOSHU_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.LUOSHU_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for value in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            [[ -n "${!value}" ]] || { echo "Missing repository signing secret" >&2; exit 3; }
          done
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/luoshu-candidate.jks"
          chmod 0600 "$RUNNER_TEMP/luoshu-candidate.jks"
          keytool -list -keystore "$RUNNER_TEMP/luoshu-candidate.jks" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null

      - name: Build candidate App
        working-directory: android-app
        shell: bash
        env:
          LUOSHU_KEYSTORE_FILE: ${{ github.event_name != 'pull_request' && format('{0}/luoshu-candidate.jks', runner.temp) || '' }}
          LUOSHU_KEYSTORE_PASSWORD: ${{ secrets.LUOSHU_KEYSTORE_PASSWORD }}
          LUOSHU_KEY_ALIAS: ${{ secrets.LUOSHU_KEY_ALIAS }}
          LUOSHU_KEY_PASSWORD: ${{ secrets.LUOSHU_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/luoshu-gradle-debug.log"
          variant=Debug
          if [[ -n "$LUOSHU_KEYSTORE_FILE" ]]; then variant=Release; fi
          if ! gradle --no-daemon --stacktrace ":app:lint$variant" :app:testDebugUnitTest ":app:assemble$variant" >"$log" 2>&1; then
            echo 'Gradle 构建失败，输出最后 180 行：' >&2
            tail -n 180 "$log" >&2
            exit 1
          fi

      - name: Build module candidate
        shell: bash
        run: |
          set -euo pipefail
          . ./scripts/version.sh
          apk='android-app/app/build/outputs/apk/debug/app-debug.apk'
          if [[ "$GITHUB_EVENT_NAME" != pull_request ]]; then
            apk='android-app/app/build/outputs/apk/release/app-release.apk'
            apksigner="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n1)"
            test -x "$apksigner"
            "$apksigner" verify --print-certs "$apk" | grep -qi 'e0043b560a10111d3ffddd3a7afba680b854e14ed793c7a3fdb7f8b7aa95ff27'
          fi
          test -s "$apk"
          rm -rf dist
          mkdir -p dist
          app="dist/LuoShu-App-${LUOSHU_ARTIFACT_VERSION}-Candidate.apk"
          cp -f "$apk" "$app"
          (cd dist && sha256sum "$(basename "$app")" > "$(basename "$app").sha256")
          LUOSHU_APP_APK="$apk" LUOSHU_ALLOW_DEBUG_APP=1 sh ./scripts/build.sh

      - name: Verify current candidate
        shell: bash
        run: |
          set -euxo pipefail
          . ./scripts/version.sh
          module="dist/LuoShu-${LUOSHU_ARTIFACT_VERSION}.zip"
          app="dist/LuoShu-App-${LUOSHU_ARTIFACT_VERSION}-Candidate.apk"
          test -s "$module"
          test -s "$app"
          unzip -t "$module" >/dev/null
          (cd dist && sha256sum -c "$(basename "$module").sha256")
          (cd dist && sha256sum -c "$(basename "$app").sha256")
          test "$(unzip -p "$module" module.prop | sed -n 's/^version=//p')" = "$LUOSHU_VERSION"
          test "$(unzip -p "$module" module.prop | sed -n 's/^versionCode=//p')" = "$LUOSHU_VERSION_CODE"
          test "$(unzip -p "$module" bundled/app.prop | sed -n 's/^versionCode=//p')" = "$LUOSHU_APP_VERSION_CODE"
          unzip -Z1 "$module" > /tmp/luoshu-candidate-files.txt
          for path in \
            common/background_task.sh \
            common/task_scope.py \
            common/task_scope.sh \
            common/runtime_paths.sh \
            common/runtime_paths_lock.py \
            common/device_font_template.sh \
            common/device_font_cache.sh \
            common/device_font_load_verify.py \
            common/device_font_load_verify.sh \
            common/device_font_payload_policy.sh \
            common/device_font_transaction_guard.sh \
            common/device_font_dynamic_guard.sh \
            common/device_font_runtime_report.sh \
            common/font_archive_export.sh \
            common/font_inventory.py \
            common/font_inventory_scan.py \
            common/font_switch_task.sh \
            common/legacy_v14_4/payload_clone.sh \
            common/mix_weight_mode.sh \
            common/mount_fast_sync.sh; do
            grep -qx "$path" /tmp/luoshu-candidate-files.txt
          done
          unzip -p "$module" common/background_task.sh | grep -q '_lsd_task'
          unzip -p "$module" common/background_task.sh | grep -q 'every new worker wrote an empty .task sidecar'
          unzip -p "$module" common/device_font_template.sh | grep -q 'CAPTURE_REVISION=2'
          unzip -p "$module" common/device_font_cache.sh | grep -q 'alignment-cache-v4'
          unzip -p "$module" common/device_font_cache.sh | grep -q '.font_switch.lock'
          unzip -p "$module" common/device_font_load_verify.py | grep -q 'device-font-load-verification-v1'
          unzip -p "$module" common/device_font_load_verify.sh | grep -q 'device_font_load_verify'
          unzip -p "$module" common/device_font_payload_policy.sh | grep -q '_device_font_fast_map'
          unzip -p "$module" common/device_font_payload_policy.sh | grep -q 'device_font_cache_schedule'
          unzip -p "$module" common/device_font_dynamic_guard.sh | grep -q '_dfpr_launch_pending_cache'
          unzip -p "$module" common/device_font_dynamic_guard.sh | grep -q 'device_font_load_verify'
          unzip -p "$module" common/font_archive_export.sh | grep -q '归档目标目录不受信任'
          unzip -p "$module" common/font_archive_export.sh | grep -q '1073741824'
          unzip -p "$module" common/font_inventory.py | grep -q 'device_font_inventory.json'
                    unzip -p "$module" common/font_inventory_scan.py | grep -q 'SCANNER_REVISION = 4'
          unzip -p "$module" common/font_inventory_scan.py | grep -q 'stockFontUniqueFileCount'
          unzip -p "$module" common/font_inventory_scan.py | grep -q 'themeOverrideRoots'
          unzip -p "$module" common/mix_weight_mode.sh | grep -q '快速单文件组合'
          unzip -p "$module" .luoshu-runtime/compat/v227/customize.sh | grep -q '原厂字体文件'
          unzip -p "$module" .luoshu-runtime/compat/v227/customize.sh | grep -q 'XML .* 通用探测 .* OEM 规则'
          unzip -p "$module" common/font_switch_task.sh | grep -q 'TIMEOUT_SECONDS'
          unzip -p "$module" common/font_switch_task.sh | grep -q '当前启动字体未被改动'
          unzip -p "$module" common/mount_fast_sync.sh | grep -q 'cp -al'
          unzip -p "$module" common/app_bridge.sh | grep -q 'FONT_SWITCH_TASK'
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          unzip -q "$module" -d "$tmp"
          python3 scripts/stable111_rework_gate.py --zip "$module"
          python3 -m py_compile "$tmp/common/font_inventory.py" "$tmp/common/font_inventory_scan.py" "$tmp/common/task_scope.py" "$tmp/common/runtime_paths_lock.py"
          sh -n "$tmp/customize.sh"
          sh -n "$tmp/common/background_task.sh"
          sh -n "$tmp/common/device_font_template.sh"
          sh -n "$tmp/common/device_font_cache.sh"
          sh -n "$tmp/common/device_font_load_verify.sh"
          sh -n "$tmp/common/device_font_payload_policy.sh"
          sh -n "$tmp/common/font_archive_export.sh"
          sh -n "$tmp/common/font_switch_task.sh"
          sh -n "$tmp/common/mix_weight_mode.sh"
          sh -n "$tmp/common/mount_fast_sync.sh"
          sh -n "$tmp/service.sh"
          sh -n scripts/pre_release_readiness.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: LuoShu-Test-Candidate
          path: dist/*
          if-no-files-found: error
          retention-days: 14
