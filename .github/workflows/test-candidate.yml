name: Build Test Candidate
on:
  push:
    branches:
      - feat/universal-mixed-integration-20260930
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - module.prop
      - config/version_notes.conf
      - common/**
      - scripts/**
      - android-app/**
      - customize.sh
      - post-fs-data.sh
      - post-mount.sh
      - service.sh
      - uninstall.sh
      - action.sh
      - .github/workflows/test-candidate.yml
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    env:
      LUOSHU_TEST_BUILD_ID: umix-${{ github.sha }}
      LUOSHU_REQUIRE_BROTLI_TEST: '1'
      LUOSHU_REQUIRE_SHAPING_TEST: '1'
      LUOSHU_AUDIT_APP: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4
        with:
          packages: ''

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends curl unzip zip file python3-venv python3-brotli python3-pil libraqm0 fonts-noto-cjk fonts-noto-core fonts-dejavu-core >/dev/null

      - uses: actions/cache@v4
        with:
          path: |
            common/python
            .luoshu-runtime/bin/woff2_decompress
            licenses/WOFF2-LICENSE.txt
            licenses/Brotli-LICENSE.txt
          key: luoshu-arm64-runtime-${{ runner.os }}-${{ hashFiles('scripts/prepare_composite_runtime.sh') }}

      - name: Prepare ARM64 runtime
        run: |
          if [ ! -x common/python/bin/luoshu-python ] || [ ! -x .luoshu-runtime/bin/woff2_decompress ] || [ ! -s licenses/WOFF2-LICENSE.txt ] || [ ! -s licenses/Brotli-LICENSE.txt ]; then
            sh ./scripts/prepare_composite_runtime.sh
          fi

      - name: Run source checks
        shell: bash
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/luoshu-source-check.log"
          if ! sh ./scripts/check.sh >"$log" 2>&1; then
            echo '源码门禁失败，输出最后 180 行：' >&2
            tail -n 180 "$log" >&2
            mkdir -p dist
            cp -f "$log" dist/source-check.log
            exit 1
          fi
          cat "$log"

      - name: Run supplemental candidate gates
        run: |
          export PYTHONPATH="$PWD/common/python/lib/python3.14/site-packages${PYTHONPATH:+:$PYTHONPATH}"
          sh -x scripts/background_task_test.sh
          sh -x scripts/device_font_foreground_quick_test.sh
          sh -x scripts/font_switch_task_test.sh
          sh -x scripts/mount_fast_sync_test.sh
          FONT="$(find /usr/share/fonts -type f -iname 'DejaVuSans.ttf' -print -quit)"
          test -s "$FONT"
          python3 scripts/font_inventory_scan_test.py --font "$FONT"
          grep -q '多字重 · ${weights.size} 档' android-app/app/src/main/java/io/github/xgl34222220/luoshu/ui/font/FontUiSupport.kt
          grep -q '静态字体现在始终按当前所选字重走快速单文件组合' common/mix_weight_mode.sh

      - name: Enforce current pre-release readiness
        shell: bash
        run: sh scripts/pre_release_readiness.sh --enforce --output "$RUNNER_TEMP/pre-release-readiness"

      - name: Build debug App
        working-directory: android-app
        shell: bash
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/luoshu-gradle-debug.log"
          if ! gradle --no-daemon --stacktrace :app:lintDebug :app:testDebugUnitTest :app:assembleDebug >"$log" 2>&1; then
            echo 'Gradle 构建失败，输出最后 180 行：' >&2
            tail -n 180 "$log" >&2
            exit 1
          fi

      - name: Build module candidate
        shell: bash
        run: |
          set -euo pipefail
          . ./scripts/version.sh
          apk='android-app/app/build/outputs/apk/debug/app-debug.apk'
          test -s "$apk"
          rm -rf dist
          mkdir -p dist
          app="dist/LuoShu-App-${LUOSHU_ARTIFACT_VERSION}-Debug.apk"
          cp -f "$apk" "$app"
          (cd dist && sha256sum "$(basename "$app")" > "$(basename "$app").sha256")
          LUOSHU_APP_APK="$apk" LUOSHU_ALLOW_DEBUG_APP=1 sh ./scripts/build.sh

      - name: Verify current candidate
        shell: bash
        run: |
          set -euxo pipefail
          . ./scripts/version.sh
          module="dist/LuoShu-${LUOSHU_ARTIFACT_VERSION}.zip"
          app="dist/LuoShu-App-${LUOSHU_ARTIFACT_VERSION}-Debug.apk"
          test -s "$module"
          test -s "$app"
          signer="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n1)"
          test -x "$signer"
          "$signer" verify --verbose --print-certs "$app" > dist/apk-signature.txt
          test "$(apkanalyzer manifest application-id "$app")" = io.github.xgl34222220.luoshu.audit
          apkanalyzer manifest print "$app" | grep -q '洛书·核心验收测试'
          test "$(unzip -p "$module" bundled/app.prop | sed -n 's/^installPolicy=//p')" = manual-only
          unzip -t "$module" >/dev/null
          (cd dist && sha256sum -c "$(basename "$module").sha256")
          (cd dist && sha256sum -c "$(basename "$app").sha256")
          test "$(unzip -p "$module" module.prop | sed -n 's/^version=//p')" = "$LUOSHU_VERSION"
          test "$(unzip -p "$module" module.prop | sed -n 's/^versionCode=//p')" = "$LUOSHU_VERSION_CODE"
          test "$(unzip -p "$module" bundled/app.prop | sed -n 's/^versionCode=//p')" = "$LUOSHU_APP_VERSION_CODE"
          unzip -Z1 "$module" > /tmp/luoshu-candidate-files.txt
          for path in \
            common/background_task.sh \
            common/device_font_template.sh \
            common/device_font_cache.sh \
            common/device_font_load_verify.py \
            common/device_font_load_verify.sh \
            common/device_font_payload_policy.sh \
            common/device_font_transaction_guard.sh \
            common/device_font_dynamic_guard.sh \
            common/device_font_runtime_report.sh \
            common/font_archive_export.sh \
            common/font_inventory.py \
            common/font_inventory_scan.py \
            common/font_switch_task.sh \
            common/legacy_v14_4/payload_clone.sh \
            common/mix_weight_mode.sh \
            common/mount_fast_sync.sh \
            common/font_topology_snapshot.py \
            common/font_topology_snapshot.sh \
            common/font_role_shadow.py \
            common/font_role_shadow.sh \
            common/font_source_profile.py \
            common/font_source_profile.sh \
            common/universal_font_plan.py \
            common/universal_font_plan.sh \
            common/minimal_xml_router.py \
            common/minimal_xml_router.sh \
            common/universal_font_compiler.py \
            common/universal_font_compiler.sh \
            common/universal_font_deployment.py \
            common/universal_font_deployment.sh \
            common/universal_mount_runtime.sh \
            common/universal_next_boot.sh \
            common/universal_font_runtime_verify.py \
            common/universal_font_runtime_verify.sh \
            common/universal_font_cutover_gate.py \
            common/universal_font_cutover.sh; do
            grep -qx "$path" /tmp/luoshu-candidate-files.txt
          done
          unzip -p "$module" common/background_task.sh | grep -q '_lsd_task'
          unzip -p "$module" common/background_task.sh | grep -q 'every new worker wrote an empty .task sidecar'
          unzip -p "$module" common/device_font_template.sh | grep -q 'CAPTURE_REVISION=2'
          unzip -p "$module" common/device_font_cache.sh | grep -q 'alignment-cache-v4'
          unzip -p "$module" common/device_font_cache.sh | grep -q '.font_switch.lock'
          unzip -p "$module" common/device_font_load_verify.py | grep -q 'device-font-load-verification-v1'
          unzip -p "$module" common/device_font_load_verify.sh | grep -q 'device_font_load_verify'
          unzip -p "$module" common/device_font_payload_policy.sh | grep -q '_device_font_fast_map'
          unzip -p "$module" common/device_font_payload_policy.sh | grep -q 'device_font_cache_schedule'
          unzip -p "$module" common/device_font_dynamic_guard.sh | grep -q '_dfpr_launch_pending_cache'
          unzip -p "$module" common/device_font_dynamic_guard.sh | grep -q 'device_font_load_verify'
          unzip -p "$module" common/font_archive_export.sh | grep -q '归档目标目录不受信任'
          unzip -p "$module" common/font_archive_export.sh | grep -q '1073741824'
          unzip -p "$module" common/font_inventory.py | grep -q 'device_font_inventory.json'
          unzip -p "$module" common/font_inventory_scan.py | grep -q 'SCANNER_REVISION = 6'
          unzip -p "$module" common/font_inventory_scan.py | grep -q 'stockFontUniqueFileCount'
          unzip -p "$module" common/font_inventory_scan.py | grep -q 'themeOverrideRoots'
          unzip -p "$module" common/mix_weight_mode.sh | grep -q '快速单文件组合'
          unzip -p "$module" .luoshu-runtime/compat/v227/customize.sh | grep -q '原厂字体文件'
          # Verify the real install-time discovery chain, not an old comment string.
          unzip -p "$module" .luoshu-runtime/compat/v227/customize.sh | grep -q 'stock_inventory_scan.py'
          unzip -p "$module" .luoshu-runtime/compat/v227/customize.sh | grep -q 'font_topology_snapshot.sh'
          unzip -p "$module" common/font_manager.sh | grep -q 'universal_font_cutover.sh'
          unzip -p "$module" common/universal_font_cutover.sh | grep -q 'universal_font_cutover_gate.py'
          unzip -p "$module" post-fs-data.sh | grep -q 'universal_font_next_boot_activate'
          unzip -p "$module" service.sh | grep -q 'universal_font_runtime_verify.sh'
          unzip -p "$module" common/font_switch_task.sh | grep -q 'TIMEOUT_SECONDS'
          unzip -p "$module" common/font_switch_task.sh | grep -q '当前启动字体未被改动'
          unzip -p "$module" common/mount_fast_sync.sh | grep -q 'cp -al'
          unzip -p "$module" common/app_bridge.sh | grep -q 'FONT_SWITCH_TASK'
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          unzip -q "$module" -d "$tmp"
          python3 -m py_compile \
            "$tmp/common/font_inventory.py" \
            "$tmp/common/font_inventory_scan.py" \
            "$tmp/common/font_topology_snapshot.py" \
            "$tmp/common/font_role_shadow.py" \
            "$tmp/common/font_source_profile.py" \
            "$tmp/common/universal_font_plan.py" \
            "$tmp/common/minimal_xml_router.py" \
            "$tmp/common/universal_font_compiler.py" \
            "$tmp/common/universal_font_deployment.py" \
            "$tmp/common/universal_font_runtime_verify.py" \
            "$tmp/common/universal_font_cutover_gate.py"
          sh -n "$tmp/customize.sh"
          sh -n "$tmp/common/background_task.sh"
          sh -n "$tmp/common/device_font_template.sh"
          sh -n "$tmp/common/device_font_cache.sh"
          sh -n "$tmp/common/device_font_load_verify.sh"
          sh -n "$tmp/common/device_font_payload_policy.sh"
          sh -n "$tmp/common/font_archive_export.sh"
          sh -n "$tmp/common/font_switch_task.sh"
          sh -n "$tmp/common/mix_weight_mode.sh"
          sh -n "$tmp/common/mount_fast_sync.sh"
          sh -n "$tmp/common/font_topology_snapshot.sh"
          sh -n "$tmp/common/font_role_shadow.sh"
          sh -n "$tmp/common/font_source_profile.sh"
          sh -n "$tmp/common/universal_font_plan.sh"
          sh -n "$tmp/common/minimal_xml_router.sh"
          sh -n "$tmp/common/universal_font_compiler.sh"
          sh -n "$tmp/common/universal_font_deployment.sh"
          sh -n "$tmp/common/universal_mount_runtime.sh"
          sh -n "$tmp/common/universal_next_boot.sh"
          sh -n "$tmp/common/universal_font_runtime_verify.sh"
          sh -n "$tmp/common/universal_font_cutover.sh"
          sh -n "$tmp/service.sh"
          sh -n scripts/pre_release_readiness.sh

      - name: Verify mixed engine and mark test artifacts
        shell: bash
        run: |
          set -euo pipefail
          . ./scripts/version.sh
          module="dist/LuoShu-${LUOSHU_ARTIFACT_VERSION}.zip"
          test "$(unzip -p "$module" module.prop | sed -n 's/^testBuildId=//p')" = "$LUOSHU_TEST_BUILD_ID"
          for file in universal_mixed_font.py universal_mixed_font.sh universal_mixed_variable.py; do
            cmp <(unzip -p "$module" "common/$file") "common/$file"
          done
          PYTHONPATH=common/python/lib/python3.14/site-packages python3 scripts/universal_mixed_variable_test.py
          PYTHONPATH=common/python/lib/python3.14/site-packages python3 scripts/universal_mixed_pipeline_test.py
          sh scripts/universal_mixed_lifecycle_test.sh
          sh scripts/python_runtime_prune_test.sh
          for file in dist/*.zip dist/*.apk; do
            renamed="${file%.*}-${LUOSHU_TEST_BUILD_ID}.${file##*.}"
            case "$file" in *.apk) renamed="dist/LuoShu-Core-Audit-${LUOSHU_ARTIFACT_VERSION}-${LUOSHU_TEST_BUILD_ID}.apk" ;; esac
            mv "$file" "$renamed"
            rm -f "$file.sha256"
            (cd dist && sha256sum "$(basename "$renamed")" > "$(basename "$renamed").sha256")
          done
          printf 'commit=%s\nbuildId=%s\nexperimental=true\nhardwareValidated=false\n' "$GITHUB_SHA" "$LUOSHU_TEST_BUILD_ID" > dist/test-build.conf

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: LuoShu-Mixed-Test-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14
