name: One-shot first-frame public trace (not acceptance)
on:
  push:
    branches: [claude/laughing-hypatia-ogd2oz]
    paths:
      - diagnostics/startup_firstframe_trace.py
      - .github/workflows/startup-firstframe-trace.yml
permissions:
  contents: read
concurrency:
  group: startup-firstframe-trace-${{ github.sha }}
  cancel-in-progress: false
jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: ''
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Add trace-only markers without changing call order
        run: |
          python3 diagnostics/startup_gpu_probe.py selftest
          python3 diagnostics/startup_firstframe_trace.py setup
          lscpu > trace-output/host-cpu.txt
      - name: Compile temporary profileable diagnostic APK
        timeout-minutes: 15
        shell: bash
        run: |
          set -o pipefail
          cd android-app
          gradle --no-daemon --stacktrace :app:assembleDebug 2>&1 | tee ../trace-output/build.log
          if test -f app/build/outputs/mapping/debug/mapping.txt; then
            cp app/build/outputs/mapping/debug/mapping.txt ../trace-output/r8-mapping.txt
          fi
      - name: Enable required KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo udevadm settle --timeout=15
          test -r /dev/kvm && test -w /dev/kvm
      - name: Capture one 15-second public Perfetto session and one COLD launch
        timeout-minutes: 8
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          avd-name: luoshu-firstframe-trace
          force-avd-creation: true
          cores: 2
          ram-size: 4096M
          heap-size: 512M
          emulator-boot-timeout: 360
          disable-animations: false
          disable-linux-hw-accel: false
          emulator-options: -no-window -gpu swiftshader -no-snapshot -wipe-data -noaudio -no-boot-anim -camera-back none
          script: python3 diagnostics/startup_firstframe_trace.py record --apk android-app/app/build/outputs/apk/debug/app-debug.apk
      - name: Extract existing trace evidence with official Perfetto processor
        if: ${{ !cancelled() }}
        timeout-minutes: 3
        shell: bash
        run: |
          test -s trace-output/firstframe.pftrace
          curl --fail --location --max-time 45 https://get.perfetto.dev/trace_processor -o "$RUNNER_TEMP/trace_processor"
          chmod +x "$RUNNER_TEMP/trace_processor"
          "$RUNNER_TEMP/trace_processor" --version > trace-output/processor-version.txt
          sha256sum "$RUNNER_TEMP/trace_processor" > trace-output/processor-wrapper-sha256.txt
          python3 diagnostics/startup_firstframe_trace.py analyze --processor "$RUNNER_TEMP/trace_processor"
      - name: Preserve raw trace, capability errors, metrics and analysis; no APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DIAGNOSTIC-FIRSTFRAME-TRACE-NOT-DELIVERY
          path: trace-output/
          if-no-files-found: error
          retention-days: 7
