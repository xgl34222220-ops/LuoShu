name: Replace v4.0.0 composite core once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/replace-v4-0-0-composite-once.yml

permissions:
  actions: write
  contents: write

jobs:
  replace-and-dispatch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Replace v4.0.0 with verified composite-core source and dispatch signed release
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SOURCE_SHA: 666255c309b2a39e3c526f4c4eeb65ec478ed9b1
          EXPECTED_OLD_TAG_SHA: 0406ee3da74ff8918df63654cb6ceeb88a2409e1
          TAG: v4.0.0
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force origin main --tags
          source_sha="$(git rev-parse HEAD^)"
          [[ "$source_sha" == "$EXPECTED_SOURCE_SHA" ]] || {
            echo "Unexpected verified source: $source_sha" >&2
            exit 2
          }
          old_tag_sha="$(git ls-remote origin "refs/tags/$TAG" | awk '{print $1}')"
          [[ "$old_tag_sha" == "$EXPECTED_OLD_TAG_SHA" ]] || {
            echo "Unexpected old tag: $old_tag_sha" >&2
            exit 2
          }
          version="$(git show "$source_sha:module.prop" | sed -n 's/^version=//p' | head -n1)"
          code="$(git show "$source_sha:module.prop" | sed -n 's/^versionCode=//p' | head -n1)"
          [[ "$version" == 'v4.0.0' && "$code" == '40000' ]] || {
            echo "Source version mismatch: $version/$code" >&2
            exit 2
          }
          git show "$source_sha:common/font_mix_controller.sh" | grep -q 'LEGACY_V14_MIX'
          git show "$source_sha:common/legacy_v14_4/v143_auto_multiweight_mix.sh" | grep -q 'LuoShuAutoMix'
          git show "$source_sha:common/legacy_v14_4/font_mix_engine.sh" | grep -q '中文字体保留为完整基底'
          gh release view "$TAG" >/dev/null
          gh release delete "$TAG" --yes
          git tag -d "$TAG" >/dev/null 2>&1 || true
          git tag -f "$TAG" "$source_sha"
          git push --force origin "refs/tags/$TAG"
          remote_tag_sha="$(git ls-remote origin "refs/tags/$TAG" | awk '{print $1}')"
          [[ "$remote_tag_sha" == "$source_sha" ]]
          gh workflow run release.yml --ref "$TAG" -f tag="$TAG" -f prerelease=false
          echo "v4.0.0 replacement tag=$source_sha and signed release workflow dispatched."
