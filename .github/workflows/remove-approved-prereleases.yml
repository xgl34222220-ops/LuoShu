name: Remove approved prereleases

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/remove-approved-prereleases.yml
      - config/prerelease_cleanup_2026-09-12.json
      - scripts/remove_approved_prereleases.py
      - scripts/remove_approved_prereleases_test.py
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/remove-approved-prereleases.yml
      - config/prerelease_cleanup_2026-09-12.json
      - scripts/remove_approved_prereleases.py
      - scripts/remove_approved_prereleases_test.py

permissions:
  contents: read

concurrency:
  group: remove-approved-prereleases-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 scripts/remove_approved_prereleases_test.py

  remove:
    needs: test
    if: >-
      github.repository == 'xgl34222220-ops/LuoShu' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: luoshu-approved-prerelease-deletion
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Remove only the five approved prereleases
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 scripts/remove_approved_prereleases.py
          --manifest config/prerelease_cleanup_2026-09-12.json
          --apply
