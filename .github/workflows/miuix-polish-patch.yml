name: Apply MIUIX edge-to-edge polish

on:
  push:
    branches:
      - feat/miuix-edge-to-edge-polish
    paths:
      - .github/workflows/miuix-polish-patch.yml

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/miuix-edge-to-edge-polish
          fetch-depth: 0

      - name: Apply MIUIX polish
        run: python3 scripts/miuix_polish_patch.py

      - name: Verify source contracts
        run: |
          git diff --check
          sh -n common/app_bridge.sh
          sh scripts/font_library_ui_layout_test.sh
          sh scripts/check.sh

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Compile and test App
        working-directory: android-app
        run: gradle --no-daemon --stacktrace :app:testDebugUnitTest :app:lintDebug :app:assembleDebug

      - name: Commit verified UI polish
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            android-app/app/src/main/java/io/github/xgl34222220/luoshu/LuoShuAppShell.kt \
            android-app/app/src/main/java/io/github/xgl34222220/luoshu/ui/theme/DockInsets.kt \
            android-app/app/src/main/java/io/github/xgl34222220/luoshu/ui/home/HomeScreenCompact.kt \
            android-app/app/src/main/java/io/github/xgl34222220/luoshu/ui/library/FontLibraryScreenCompact.kt \
            android-app/app/src/main/java/io/github/xgl34222220/luoshu/ui/studio/FontStudioScreenMiuix.kt \
            android-app/app/src/main/java/io/github/xgl34222220/luoshu/ui/logs/LogsScreenCompact.kt \
            android-app/app/src/main/java/io/github/xgl34222220/luoshu/ui/settings/SettingsHubScreen.kt \
            common/app_bridge.sh \
            scripts/font_library_ui_layout_test.sh
          git diff --cached --quiet && { echo 'No verified UI changes to commit' >&2; exit 2; }
          git commit -m 'feat(ui): finish MIUIX edge-to-edge glass polish'
          git push origin HEAD:feat/miuix-edge-to-edge-polish
