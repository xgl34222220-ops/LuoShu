              '''printf '%s\\n' "$MIUIX_DOCK" | grep -q 'blurRadius = 24.dp'
printf '%s\\n' "$MIUIX_DOCK" | grep -q 'noiseFactor = .012f'
printf '%s\\n' "$MIUIX_DOCK" | grep -q 'RoundedCornerShape(31.dp)'
printf '%s\\n' "$MIUIX_DOCK" | grep -q 'activeGlass'
printf '%s\\n' "$MIUIX_DOCK" | grep -q 'Color.White.copy(alpha = .12f)'
''')
          replace(test,
              '''grep -q 'bottom = 24.dp' "$HOME_COMPACT"
grep -q 'bottom = 24.dp' "$LOGS_COMPACT"
''',
              '''grep -q 'maxOf(LocalDockContentPadding.current, 24.dp)' "$HOME_COMPACT"
grep -q 'maxOf(LocalDockContentPadding.current, 28.dp)' "$COMPACT"
grep -q 'maxOf(LocalDockContentPadding.current, 24.dp)' "$LOGS_COMPACT"
grep -q 'CompactStatusCell' "$HOME_COMPACT"
grep -q "self-mount) printf '洛书自挂载'" "$APP_BRIDGE"
grep -q 'mountSummary(h)' "$SETTINGS"
grep -q 'selfMountSummary(h)' "$SETTINGS"
''')

          # Old opaque/viewport-clipping values must not silently return.
          p = Path(test)
          text = p.read_text(encoding='utf-8')
          text = text.replace("! printf '%s\\n' \"$MIUIX_DOCK\" | grep -q 'blurRadius = 36.dp'\n", "! printf '%s\\n' \"$MIUIX_DOCK\" | grep -q 'blurRadius = 36.dp'\n! printf '%s\\n' \"$MIUIX_DOCK\" | grep -q 'blurRadius = 30.dp'\n! grep -q '-> 34.dp' \"$SHELL\"\n")
          p.write_text(text, encoding='utf-8')
          PY

      - name: Verify source contracts
        run: |
          git diff --check
          sh -n common/app_bridge.sh
          sh scripts/font_library_ui_layout_test.sh
          sh scripts/check.sh

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Compile and test App
        working-directory: android-app
        run: gradle --no-daemon --stacktrace :app:testDebugUnitTest :app:lintDebug :app:assembleDebug

      - name: Commit verified UI polish
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            android-app/app/src/main/java/io/github/xgl34222220/luoshu/LuoShuAppShell.kt \
            android-app/app/src/main/java/io/github/xgl34222220/luoshu/ui/theme/DockInsets.kt \
            android-app/app/src/main/java/io/github/xgl34222220/luoshu/ui/home/HomeScreenCompact.kt \
            android-app/app/src/main/java/io/github/xgl34222220/luoshu/ui/library/FontLibraryScreenCompact.kt \
            android-app/app/src/main/java/io/github/xgl34222220/luoshu/ui/studio/FontStudioScreenMiuix.kt \
            android-app/app/src/main/java/io/github/xgl34222220/luoshu/ui/logs/LogsScreenCompact.kt \
            android-app/app/src/main/java/io/github/xgl34222220/luoshu/ui/settings/SettingsHubScreen.kt \
            common/app_bridge.sh \
            scripts/font_library_ui_layout_test.sh
          git diff --cached --quiet && { echo 'No patch changes to commit' >&2; exit 2; }
          git commit -m 'feat(ui): finish MIUIX edge-to-edge glass polish'
          git push origin HEAD:feat/miuix-edge-to-edge-polish
