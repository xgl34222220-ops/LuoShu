name: Apply reviewed variable instance cache

on:
  push:
    branches:
      - agent/variable-instance-cache
    paths:
      - .github/workflows/apply-variable-instance-cache.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/variable-instance-cache
          fetch-depth: 0

      - name: Apply reviewed cache optimization
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('common/device_font_slot_build_base.py')
          text = path.read_text()
          text = text.replace(
              'import unicodedata\nfrom pathlib import Path',
              'import unicodedata\nfrom io import BytesIO\nfrom pathlib import Path',
          )
          old = '''def read_source(path: Path, face_index: int, weight: int) -> TTFont:\n    if not path.is_file() or path.stat().st_size < 12:\n        raise BuildError(f"源字体不可用：{path}")\n    kwargs: dict[str, Any] = {"lazy": False, "recalcTimestamp": False, "recalcBBoxes": True}\n    with path.open("rb") as stream:\n        collection = stream.read(4) == b"ttcf"\n    if collection:\n        kwargs["fontNumber"] = max(0, face_index)\n    font = TTFont(str(path), **kwargs)\n    if "glyf" not in font:\n        font.close()\n        raise BuildError("当前阶段仅支持 TrueType glyf 轮廓；CFF/CFF2 不伪装支持")\n    result = static_instance(font, weight)\n    if result is not font:\n        font.close()\n    if "glyf" not in result:\n        result.close()\n        raise BuildError("静态实例不包含 TrueType glyf 轮廓")\n    return result\n'''
          new = '''# One payload build can request the same variable source/face/weight for many distinct slot\n# signatures. Instancing the full variable font for every signature is pure duplicate CPU/RSS work.\n# Cache only variable-font static instances; static fonts keep the direct path. The file identity is\n# deliberately conservative so same-path/same-size replacements cannot reuse stale font bytes.\n_STATIC_INSTANCE_CACHE: dict[tuple[str, int, int, int, int, int, int, int], bytes] = {}\n_STATIC_INSTANCE_CACHE_LIMIT = 4\n\n\ndef _open_source_font(path: Path, face_index: int, collection: bool) -> TTFont:\n    kwargs: dict[str, Any] = {"lazy": False, "recalcTimestamp": False, "recalcBBoxes": True}\n    if collection:\n        kwargs["fontNumber"] = max(0, face_index)\n    return TTFont(str(path), **kwargs)\n\n\ndef read_source(path: Path, face_index: int, weight: int) -> TTFont:\n    if not path.is_file():\n        raise BuildError(f"源字体不可用：{path}")\n    stat = path.stat()\n    if stat.st_size < 12:\n        raise BuildError(f"源字体不可用：{path}")\n    with path.open("rb") as stream:\n        collection = stream.read(4) == b"ttcf"\n\n    key = (\n        str(path),\n        int(face_index),\n        int(weight),\n        int(stat.st_dev),\n        int(stat.st_ino),\n        int(stat.st_size),\n        int(stat.st_mtime_ns),\n        int(stat.st_ctime_ns),\n    )\n    cached = _STATIC_INSTANCE_CACHE.get(key)\n    if cached is not None:\n        result = TTFont(BytesIO(cached), lazy=False, recalcTimestamp=False, recalcBBoxes=True)\n        if "glyf" not in result:\n            result.close()\n            raise BuildError("静态实例不包含 TrueType glyf 轮廓")\n        return result\n\n    font = _open_source_font(path, face_index, collection)\n    if "glyf" not in font:\n        font.close()\n        raise BuildError("当前阶段仅支持 TrueType glyf 轮廓；CFF/CFF2 不伪装支持")\n    variable = "fvar" in font\n    result = static_instance(font, weight)\n    if result is not font:\n        font.close()\n    if "glyf" not in result:\n        result.close()\n        raise BuildError("静态实例不包含 TrueType glyf 轮廓")\n\n    if variable:\n        buffer = BytesIO()\n        result.save(buffer, reorderTables=False)\n        if len(_STATIC_INSTANCE_CACHE) >= _STATIC_INSTANCE_CACHE_LIMIT:\n            _STATIC_INSTANCE_CACHE.clear()\n        _STATIC_INSTANCE_CACHE[key] = buffer.getvalue()\n    return result\n'''
          if old not in text:
              raise SystemExit('read_source baseline not found; refusing partial edit')
          path.write_text(text.replace(old, new))

          check = Path('scripts/check.sh')
          ctext = check.read_text()
          anchor = 'scripts/assert.sh scripts/duplicate_function_test.sh scripts/device_font_cache_budget_test.sh scripts/provider_pid_scan_test.sh scripts/build.sh'
          replacement = 'scripts/assert.sh scripts/duplicate_function_test.sh scripts/device_font_cache_budget_test.sh scripts/provider_pid_scan_test.sh scripts/slot_build_instance_cache_test.py scripts/build.sh'
          if anchor not in ctext:
              raise SystemExit('check inventory anchor missing')
          ctext = ctext.replace(anchor, replacement, 1)
          run_anchor = 'sh "$ROOT/scripts/provider_pid_scan_test.sh"\n'
          if run_anchor not in ctext:
              raise SystemExit('check run anchor missing')
          ctext = ctext.replace(run_anchor, run_anchor + 'python3 "$ROOT/scripts/slot_build_instance_cache_test.py"\n', 1)
          check.write_text(ctext)
          PY

          cat > scripts/slot_build_instance_cache_test.py <<'PYTEST'
          #!/usr/bin/env python3
          from __future__ import annotations

          import os
          import sys
          import tempfile
          from pathlib import Path

          ROOT = Path(__file__).resolve().parent.parent
          sys.path.insert(0, str(ROOT / "common"))

          from fontTools.fontBuilder import FontBuilder
          from fontTools.pens.ttGlyphPen import TTGlyphPen
          from fontTools.ttLib.tables._g_v_a_r import table__g_v_a_r
          from fontTools.ttLib.tables.TupleVariation import TupleVariation
          from fontTools.varLib import instancer

          import device_font_slot_build_base as builder


          def build_variable_font(path: Path, glyph_count: int = 40) -> None:
              order = [".notdef"] + [f"g{i}" for i in range(glyph_count)]
              fb = FontBuilder(1000, isTTF=True)
              fb.setupGlyphOrder(order)
              fb.setupCharacterMap({0x4E00 + i: f"g{i}" for i in range(glyph_count)})
              glyphs, metrics = {}, {}
              for name in order:
                  pen = TTGlyphPen(None)
                  if name != ".notdef":
                      pen.moveTo((60, 40)); pen.lineTo((320, 70)); pen.lineTo((260, 460)); pen.lineTo((100, 420)); pen.closePath()
                  glyphs[name] = pen.glyph()
                  metrics[name] = (1000, 60)
              fb.setupGlyf(glyphs)
              fb.setupHorizontalMetrics(metrics)
              fb.setupHorizontalHeader(ascent=880, descent=-120)
              fb.setupNameTable({"familyName": "CacheVF", "styleName": "Regular", "psName": "CacheVF-Regular"})
              fb.setupOS2(sTypoAscender=880, sTypoDescender=-120, usWinAscent=880, usWinDescent=120)
              fb.setupPost()
              fb.setupFvar([("wght", 100, 400, 900, "Weight")], [])
              gvar = table__g_v_a_r()
              gvar.version, gvar.reserved, gvar.variations = 1, 0, {}
              for name in order:
                  if name == ".notdef":
                      continue
                  points = len(glyphs[name].coordinates) + 4
                  gvar.variations[name] = [TupleVariation({"wght": (0, 1, 1)}, [(25, 25)] * points)]
              fb.font["gvar"] = gvar
              fb.save(str(path))


          def main() -> int:
              with tempfile.TemporaryDirectory() as tmp:
                  source = Path(tmp) / "CacheVF.ttf"
                  build_variable_font(source)
                  calls = {"n": 0}
                  original = instancer.instantiateVariableFont

                  def counting(*args, **kwargs):
                      calls["n"] += 1
                      return original(*args, **kwargs)

                  builder.instantiateVariableFont = counting
                  builder._STATIC_INSTANCE_CACHE.clear()
                  try:
                      for _ in range(6):
                          font = builder.read_source(source, -1, 400)
                          assert "glyf" in font
                          font.close()
                      assert calls["n"] == 1, f"同源同字重应只实例化 1 次，实际 {calls['n']}"

                      builder.read_source(source, -1, 700).close()
                      assert calls["n"] == 2, f"不同字重应独立实例化，实际 {calls['n']}"

                      before = source.stat()
                      os.chmod(source, 0o600)
                      os.utime(source, ns=(before.st_atime_ns, before.st_mtime_ns))
                      builder.read_source(source, -1, 400).close()
                      assert calls["n"] == 3, f"ctime 身份变化后必须失效，实际 {calls['n']}"

                      build_variable_font(source, glyph_count=41)
                      builder.read_source(source, -1, 400).close()
                      assert calls["n"] == 4, f"源文件变化后必须重新实例化，实际 {calls['n']}"
                  finally:
                      builder.instantiateVariableFont = original
                      builder._STATIC_INSTANCE_CACHE.clear()

                  static = Path(tmp) / "Static.ttf"
                  fb = FontBuilder(1000, isTTF=True)
                  fb.setupGlyphOrder([".notdef", "a"])
                  fb.setupCharacterMap({0x61: "a"})
                  pen = TTGlyphPen(None)
                  pen.moveTo((0, 0)); pen.lineTo((500, 0)); pen.lineTo((500, 700)); pen.lineTo((0, 700)); pen.closePath()
                  fb.setupGlyf({".notdef": TTGlyphPen(None).glyph(), "a": pen.glyph()})
                  fb.setupHorizontalMetrics({".notdef": (600, 0), "a": (600, 0)})
                  fb.setupHorizontalHeader(ascent=800, descent=-200)
                  fb.setupNameTable({"familyName": "Static", "styleName": "Regular", "psName": "Static-Regular"})
                  fb.setupOS2(sTypoAscender=800, sTypoDescender=-200, usWinAscent=800, usWinDescent=200)
                  fb.setupPost()
                  fb.save(str(static))
                  builder._STATIC_INSTANCE_CACHE.clear()
                  builder.read_source(static, -1, 400).close()
                  assert not builder._STATIC_INSTANCE_CACHE, "静态字体不应进入实例缓存"

              print("Slot build variable-instance cache tests passed.")
              return 0


          if __name__ == "__main__":
              raise SystemExit(main())
          PYTEST

          python3 -m py_compile common/device_font_slot_build_base.py scripts/slot_build_instance_cache_test.py
          rm -f .github/workflows/apply-variable-instance-cache.yml

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'perf: reuse variable font instances within payload builds'
          git push origin HEAD:agent/variable-instance-cache
