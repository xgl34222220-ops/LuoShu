name: Prepare v4.0.0 replacement

on:
  push:
    branches: [ main ]
    paths:
      - .github/workflows/replace-v4.0.0-rom-fix.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Remove old v4.0.0 release and tag
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: v4.0.0
        shell: bash
        run: |
          set -euo pipefail

          release_id="$(gh api "repos/$REPO/releases/tags/$TAG" --jq '.id' 2>/dev/null || true)"
          if [ -n "$release_id" ]; then
            gh api --method DELETE "repos/$REPO/releases/$release_id"
          fi

          gh api --method DELETE "repos/$REPO/git/refs/tags/$TAG" 2>/dev/null || true

          if gh api "repos/$REPO/releases/tags/$TAG" >/dev/null 2>&1; then
            echo "Old release still exists: $TAG" >&2
            exit 1
          fi
          if gh api "repos/$REPO/git/ref/tags/$TAG" >/dev/null 2>&1; then
            echo "Old tag still exists: $TAG" >&2
            exit 1
          fi

          echo "v4.0.0 release/tag removed; next main release-notes commit may publish the verified replacement."
