name: Root Android ARM64 qualification
on:
  workflow_dispatch:
  push:
    branches: [feat/stable-runtime-cleanup-20261002, fix/stable-composite-contract-20261003]
    paths:
      - .github/workflows/luoshu-root-android-probe.yml
      - tests/android-root-gate/**
permissions:
  contents: read
  actions: read
concurrency:
  group: root-android-qualification-${{ github.ref }}
  cancel-in-progress: false
jobs:
  qualify:
    name: Original ARM64 ELF on Root Android API35
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    env:
      LUOSHU_APP_DIAGNOSTIC_ONLY: "0"
    steps:
      - uses: actions/checkout@v4
      - name: Fetch immutable official baseline
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p root-gate-output
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/LuoShu-v1.1.1.zip" \
            https://github.com/xgl34222220-ops/LuoShu/releases/download/refactor-v1.1.1/LuoShu-v1.1.1.zip
          echo "c5c8fa86af4ac196107ba05c5ee8cc1944140ae033cc9e763cec8c76f40c848a  $RUNNER_TEMP/LuoShu-v1.1.1.zip" | sha256sum -c -
          python3 -m unittest discover -s tests/android-root-gate -p 'test_*.py'
      - name: Download exact static-collection candidate artifact
        uses: actions/download-artifact@v4
        with:
          name: LuoShu-Test-Candidate
          run-id: 37119550651
          github-token: ${{ github.token }}
          path: candidate-artifact
      - name: Verify static-collection candidate identity
        shell: bash
        run: |
          echo 'fc3f2b3fabda57909d9b453ceadb7e51e43f9431673031d9442ea5476c7be5a9  candidate-artifact/LuoShu-v1.1.1.zip' | sha256sum -c -
          echo 'Static-collection candidate commit: 339046f19315208a352bd3e78b78164cbf6b63e9' | tee root-gate-output/candidate-source.txt
      - name: Fetch authorized official Magisk for this disposable AVD
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/luoshu-magisk"
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/luoshu-magisk/Magisk-v30.7.apk" https://github.com/topjohnwu/Magisk/releases/download/v30.7/Magisk-v30.7.apk
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/luoshu-magisk/host_patch.sh" https://raw.githubusercontent.com/topjohnwu/Magisk/v30.7/scripts/host_patch.sh
          echo "e0d32d2123532860f97123d927b1bb86c4e08e6fd8a48bfc6b5bee0afae9ebd5  $RUNNER_TEMP/luoshu-magisk/Magisk-v30.7.apk" | sha256sum -c -
          echo "1720669a684f75fe90a7318868dd4528f2e736a5ad5363f92a3c51c848d79703  $RUNNER_TEMP/luoshu-magisk/host_patch.sh" | sha256sum -c -
      - name: Record KVM access and verify existing sudo access
        shell: bash
        run: |
          set -o pipefail
          if ! bash tests/android-root-gate/check_kvm.sh 2>&1 | tee root-gate-output/kvm-environment.txt; then
            test -c /dev/kvm
            sudo -n test -r /dev/kvm
            sudo -n test -w /dev/kvm
            echo 'Using authorized, existing sudo for one emulator process; permissions unchanged.' | tee -a root-gate-output/kvm-environment.txt
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare official SDK image and disposable AVD
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee root-gate-output/sdk-preparation.txt) 2>&1
          : "${ANDROID_HOME:=${ANDROID_SDK_ROOT:-}}"
          test -n "$ANDROID_HOME"
          echo "Official SDK root: $ANDROID_HOME"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -maxdepth 3 -type f -name sdkmanager | sort -V | tail -1)
          fi
          test -x "$SDKMANAGER"
          AVDMANAGER="$(dirname "$SDKMANAGER")/avdmanager"
          test -x "$AVDMANAGER"
          echo "SDK manager: $SDKMANAGER"
          echo "AVD manager: $AVDMANAGER"
          "$SDKMANAGER" --install 'platform-tools' 'emulator' 'system-images;android-35;google_apis;x86_64'
          export HOME="$RUNNER_TEMP/luoshu-emulator-home"
          export ANDROID_AVD_HOME="$HOME/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          printf 'no\n' | "$AVDMANAGER" create avd --force --name luoshu_gate --package 'system-images;android-35;google_apis;x86_64' --device pixel_2
          printf '\nhw.ramSize=3072\nvm.heapSize=512\n' >> "$ANDROID_AVD_HOME/luoshu_gate.avd/config.ini"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "HOME=$HOME" >> "$GITHUB_ENV"
          echo "ANDROID_AVD_HOME=$ANDROID_AVD_HOME" >> "$GITHUB_ENV"
      - name: Qualify original ARM64 runtime under one supervised emulator
        shell: bash
        run: python3 tests/android-root-gate/run_emulator.py --module-zip "$RUNNER_TEMP/LuoShu-v1.1.1.zip" --candidate-zip candidate-artifact/LuoShu-v1.1.1.zip --magisk-apk "$RUNNER_TEMP/luoshu-magisk/Magisk-v30.7.apk" --magisk-patch-script "$RUNNER_TEMP/luoshu-magisk/host_patch.sh" --output root-gate-output
      - name: Preserve qualification evidence, including unsupported failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Root-Android-ARM64-Qualification
          path: root-gate-output/
          if-no-files-found: warn
          retention-days: 7
