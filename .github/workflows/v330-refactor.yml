name: Apply v3.3.0 UI and font loading refactor

on:
  push:
    branches:
      - release/v3.3.0-ui-font-performance

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v3.3.0-ui-font-performance
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Apply cache-first loading and MIUIx polish
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import json
          import re

          def read(path):
              return Path(path).read_text(encoding='utf-8')

          def write(path, text):
              Path(path).write_text(text, encoding='utf-8')

          def replace_once(path, old, new):
              text = read(path)
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one match, got {count}: {old[:80]!r}')
              write(path, text.replace(old, new, 1))

          # 1) 首页：系统粗细持久缓存 + 后台校验，消除重复 Root 读取。
          path = 'android-app/app/src/main/java/io/github/xgl34222220/luoshu/Alpha15FeatureViewModel.kt'
          text = read(path)
          text = text.replace('import androidx.lifecycle.ViewModel\n', 'import android.app.Application\nimport android.content.Context\nimport android.os.SystemClock\nimport androidx.lifecycle.AndroidViewModel\n')
          text = text.replace('internal class Alpha15FeatureViewModel : ViewModel() {', 'internal class Alpha15FeatureViewModel(application: Application) : AndroidViewModel(application) {')
          text = text.replace(
              '    private var weightJob: Job? = null\n    private var lastCommittedWeight: Int? = null\n',
              '    private var weightJob: Job? = null\n    private var refreshJob: Job? = null\n    private var lastCommittedWeight: Int? = null\n    private var lastWeightRefreshElapsed = 0L\n    private val weightPrefs = application.getSharedPreferences("system-weight-cache-v1", Context.MODE_PRIVATE)\n',
              1,
          )
          marker = '    var systemWeight by mutableStateOf(SystemWeightState())\n        private set\n\n'
          if marker not in text:
              raise SystemExit('Alpha15FeatureViewModel: systemWeight marker missing')
          init_block = '''    var systemWeight by mutableStateOf(SystemWeightState())
        private set

    init {
        val cachedWeight = weightPrefs.getInt("weight", Int.MIN_VALUE)
        val cachedMin = weightPrefs.getInt("min", 300)
        val cachedMax = weightPrefs.getInt("max", 700).coerceAtLeast(cachedMin)
        val cachedStep = weightPrefs.getInt("step", 10).coerceAtLeast(1)
        if (cachedWeight != Int.MIN_VALUE) {
            val safeWeight = cachedWeight.coerceIn(cachedMin, cachedMax)
            lastCommittedWeight = safeWeight
            systemWeight = SystemWeightState(
                loading = false,
                supported = weightPrefs.getBoolean("supported", true),
                weight = safeWeight,
                adjustment = weightPrefs.getInt("adjustment", safeWeight - 400),
                originalAdjustment = weightPrefs.getInt("originalAdjustment", 0),
                min = cachedMin,
                max = cachedMax,
                step = cachedStep,
                message = "已显示上次值，后台会静默校验",
            )
        }
    }

'''
          text = text.replace(marker, init_block, 1)
          pattern = re.compile(r'    fun refreshSystemWeight\(\) \{.*?\n    \}\n\n    fun previewSystemWeight', re.S)
          replacement = '''    fun refreshSystemWeight(force: Boolean = false) {
        if (systemWeight.applying || refreshJob?.isActive == true) return
        val now = SystemClock.elapsedRealtime()
        if (!force && lastWeightRefreshElapsed > 0L && now - lastWeightRefreshElapsed < 120_000L) return
        val hadCachedValue = !systemWeight.loading
        systemWeight = if (hadCachedValue) {
            systemWeight.copy(message = "正在后台校验系统粗细…", error = "")
        } else {
            systemWeight.copy(loading = true, error = "")
        }
        refreshJob = viewModelScope.launch {
            val result = RootShell.exec(
                "sh ${RootShell.quote(fontManager)} action font_weight_status",
                timeoutMs = 20_000L,
            )
            try {
                if (result.code != 0) error(result.stderr.ifBlank { "系统字体粗细读取失败" })
                val root = firstJson(result.stdout)
                if (root.optString("status") != "ok") error(root.optString("message", "系统字体粗细读取失败"))
                val data = root.getJSONObject("data")
                val minimum = data.optInt("min", 300)
                val maximum = data.optInt("max", 700).coerceAtLeast(minimum)
                val step = data.optInt("step", 10).coerceAtLeast(1)
                val weight = data.optInt("weight", 400).coerceIn(minimum, maximum)
                lastCommittedWeight = weight
                systemWeight = SystemWeightState(
                    loading = false,
                    supported = data.optBoolean("supported", false),
                    weight = weight,
                    adjustment = data.optInt("adjustment", weight - 400),
                    originalAdjustment = data.optInt("originalAdjustment", 0),
                    min = minimum,
                    max = maximum,
                    step = step,
                    message = "拖动后会自动写入，未刷新的应用重新打开即可",
                )
                persistWeightCache()
                lastWeightRefreshElapsed = SystemClock.elapsedRealtime()
            } catch (error: Throwable) {
                systemWeight = if (hadCachedValue) {
                    systemWeight.copy(
                        loading = false,
                        error = "",
                        message = "沿用缓存粗细；后台校验暂时失败",
                    )
                } else {
                    systemWeight.copy(
                        loading = false,
                        supported = false,
                        error = error.message ?: "系统字体粗细读取失败",
                        message = "",
                    )
                }
            } finally {
                refreshJob = null
            }
        }
    }

    fun previewSystemWeight'''
          text, n = pattern.subn(replacement, text, count=1)
          if n != 1:
              raise SystemExit(f'Alpha15FeatureViewModel: refresh function replacement count={n}')
          text = text.replace(
              '                lastCommittedWeight = applied\n                systemWeight = systemWeight.copy(',
              '                lastCommittedWeight = applied\n                systemWeight = systemWeight.copy(',
              1,
          )
          text = text.replace(
              '                    error = "",\n                )\n            } catch (error: Throwable) {',
              '                    error = "",\n                )\n                persistWeightCache()\n                lastWeightRefreshElapsed = SystemClock.elapsedRealtime()\n            } catch (error: Throwable) {',
              1,
          )
          text = text.replace('                refreshSystemWeight()\n', '                refreshSystemWeight(force = true)\n', 1)
          snap_marker = '    private fun snapWeight(value: Int, min: Int, max: Int, step: Int): Int {'
          if snap_marker not in text:
              raise SystemExit('Alpha15FeatureViewModel: snapWeight marker missing')
          helper = '''    private fun persistWeightCache() {
        val state = systemWeight
        weightPrefs.edit()
            .putBoolean("supported", state.supported)
            .putInt("weight", state.weight)
            .putInt("adjustment", state.adjustment)
            .putInt("originalAdjustment", state.originalAdjustment)
            .putInt("min", state.min)
            .putInt("max", state.max)
            .putInt("step", state.step)
            .apply()
    }

'''
          text = text.replace(snap_marker, helper + snap_marker, 1)
          write(path, text)

          # 2) AppShell：启动时不重复读粗细；手动刷新才强制校验；底栏更轻、更薄。
          path = 'android-app/app/src/main/java/io/github/xgl34222220/luoshu/LuoShuAppShell.kt'
          text = read(path)
          text = text.replace('    LaunchedEffect(Unit) {\n        viewModel.refresh()\n        features.refreshSystemWeight()\n    }', '    LaunchedEffect(Unit) {\n        viewModel.refresh()\n    }', 1)
          text = text.replace('                features.refreshSystemWeight()\n            },\n            openFontLibrary', '                features.refreshSystemWeight(force = true)\n            },\n            openFontLibrary', 1)
          text = text.replace('val dockContentPadding = if (edgeToEdgeGlass) navigationBottom + 88.dp else 0.dp', 'val dockContentPadding = if (edgeToEdgeGlass) navigationBottom + 82.dp else 0.dp', 1)
          miuix_start = text.index('private fun MiuixAppDock(')
          before, miuix = text[:miuix_start], text[miuix_start:]
          miuix = miuix.replace('RoundedCornerShape(31.dp)', 'RoundedCornerShape(28.dp)', 1)
          miuix = miuix.replace('RoundedCornerShape(topStart = 30.dp, topEnd = 30.dp)', 'RoundedCornerShape(topStart = 28.dp, topEnd = 28.dp)', 1)
          miuix = miuix.replace('itemHeight = 52.dp', 'itemHeight = 48.dp', 1)
          miuix = miuix.replace('Modifier.padding(horizontal = 12.dp).padding(bottom = bottomInset + 8.dp)', 'Modifier.padding(horizontal = 14.dp).padding(bottom = bottomInset + 7.dp)', 1)
          miuix = miuix.replace('.padding(start = 5.dp, top = 5.dp, end = 5.dp, bottom = if (floating) 5.dp else bottomInset + 5.dp)', '.padding(start = 4.dp, top = 4.dp, end = 4.dp, bottom = if (floating) 4.dp else bottomInset + 4.dp)', 1)
          miuix = miuix.replace('val indicatorInset = if (liquidLens) 5.dp else 7.dp', 'val indicatorInset = if (liquidLens) 6.dp else 7.dp', 1)
          miuix = miuix.replace('val indicatorShape = RoundedCornerShape(if (liquidLens) 20.dp else 18.dp)', 'val indicatorShape = RoundedCornerShape(if (liquidLens) 18.dp else 18.dp)', 1)
          write(path, before + miuix)

          # 3) 字体库：有本地索引就直接显示，不再进页面跑 Root 指纹；一次批量预热预览。
          path = 'android-app/app/src/main/java/io/github/xgl34222220/luoshu/LuoShuViewModel.kt'
          text = read(path)
          if 'import java.io.File\n' not in text:
              text = text.replace('import org.json.JSONObject\n', 'import org.json.JSONObject\nimport java.io.File\n', 1)
          text = text.replace(
              '    private var prewarmRequested = false\n',
              '    private var prewarmRequested = false\n    private var previewPrewarmRequested = false\n    private var previewPrewarmJob: Job? = null\n',
              1,
          )
          text = text.replace(
              '    private fun requestFontPrewarm() {\n        if (prewarmRequested && fonts.isNotEmpty()) return\n        prewarmRequested = true\n        if (fontRequestJob?.isActive == true) return\n        launchFontWork(force = false, showErrors = false)\n    }',
              '''    private fun requestFontPrewarm() {
        if (fonts.isNotEmpty()) {
            requestPreviewPrewarm()
            return
        }
        if (prewarmRequested) return
        prewarmRequested = true
        if (fontRequestJob?.isActive == true) return
        launchFontWork(force = false, showErrors = false)
    }''',
              1,
          )
          text = text.replace(
              '                    else -> refreshOnlyWhenChanged(showErrors = showErrors)\n',
              '                    else -> Unit // 本地索引优先：只有导入/删除/手动刷新才重建。\n',
              1,
          )
          text = text.replace(
              '            persistFontIndex(currentFont = current)\n            fontError = ""\n',
              '            persistFontIndex(currentFont = current)\n            requestPreviewPrewarm(force = true)\n            fontError = ""\n',
              1,
          )
          marker = '    fun refreshMixConfig() {'
          if marker not in text:
              raise SystemExit('LuoShuViewModel: refreshMixConfig marker missing')
          preview_fn = '''    private fun requestPreviewPrewarm(force: Boolean = false) {
        if (!snapshot.installed || fonts.isEmpty()) return
        if (previewPrewarmJob?.isActive == true) return
        if (previewPrewarmRequested && !force) return
        previewPrewarmRequested = true
        val previewDir = File(getApplication<Application>().cacheDir, "native-font-preview")
        previewPrewarmJob = viewModelScope.launch {
            withContext(Dispatchers.IO) { previewDir.mkdirs() }
            RootShell.exec(
                "sh ${RootShell.quote(bridge)} preview_export_batch ${RootShell.quote(previewDir.absolutePath)}",
                timeoutMs = 90_000L,
            )
            previewPrewarmJob = null
        }
    }

'''
          text = text.replace(marker, preview_fn + marker, 1)
          write(path, text)

          # 4) 预览：列表卡片不再各自启动 su；批量缓存未就绪时只显示轻量占位。
          path = 'android-app/app/src/main/java/io/github/xgl34222220/luoshu/NativeFontPreview.kt'
          text = read(path)
          if 'import kotlinx.coroutines.delay\n' not in text:
              text = text.replace('import kotlinx.coroutines.CancellationException\n', 'import kotlinx.coroutines.CancellationException\nimport kotlinx.coroutines.delay\n', 1)
          text = text.replace(
              '    axes: Map<String, Float> = emptyMap(),\n    modifier: Modifier = Modifier,',
              '    axes: Map<String, Float> = emptyMap(),\n    rootFallback: Boolean = true,\n    modifier: Modifier = Modifier,',
              1,
          )
          old_revision = '''    val sourceRevision = remember(font, requestedWeight) {
        font?.let {
            val staticRevision = if (it.variable) "" else "|wght=$requestedWeight"
            "${it.id}|${it.size}|${it.date}$staticRevision"
        }
    }'''
          new_revision = '''    val sourceRevision = remember(font?.id, font?.variable, requestedWeight) {
        font?.let {
            if (it.variable) it.id else "${it.id}|wght=$requestedWeight"
        }
    }'''
          if old_revision not in text:
              raise SystemExit('NativeFontPreview: sourceRevision marker missing')
          text = text.replace(old_revision, new_revision, 1)
          text = text.replace(
              '    val previewKey = remember(sourceRevision, font?.valid, font?.error) {\n        "${sourceRevision.orEmpty()}|${font?.valid}|${font?.error.orEmpty()}"\n    }',
              '    val previewKey = remember(sourceRevision, font?.valid, font?.error, rootFallback) {\n        "${sourceRevision.orEmpty()}|${font?.valid}|${font?.error.orEmpty()}|root=$rootFallback"\n    }',
              1,
          )
          old_export = '''                                var exported = false
                                if (!target.isFile || target.length() == 0L) {
                                    val command = "sh ${RootShell.quote(APP_BRIDGE)} preview_export " +
                                        "${RootShell.quote(font.id)} ${RootShell.quote(target.absolutePath)} $requestedWeight"
                                    val result = RootShell.exec(command, timeoutMs = 25_000L)
                                    val jsonLine = result.stdout.lineSequence()
                                        .firstOrNull { it.trimStart().startsWith("{") }
                                    val root = jsonLine?.let { JSONObject(it.trim()) }
                                    if (result.code != 0 || root?.optString("status") != "ok") {
                                        error(
                                            root?.optString("message").orEmpty().ifBlank {
                                                result.stderr.ifBlank { "预览字体导出失败" }
                                            },
                                        )
                                    }
                                    if (!target.isFile || target.length() == 0L) {
                                        error("预览字体文件为空")
                                    }
                                    exported = true
                                }
                                val loaded = Typeface.createFromFile(target)'''
          new_export = '''                                var exported = false
                                if ((!target.isFile || target.length() == 0L) && !rootFallback) {
                                    for (attempt in 0 until 40) {
                                        if (target.isFile && target.length() > 0L) break
                                        delay(150L)
                                    }
                                }
                                if ((!target.isFile || target.length() == 0L) && rootFallback) {
                                    val command = "sh ${RootShell.quote(APP_BRIDGE)} preview_export " +
                                        "${RootShell.quote(font.id)} ${RootShell.quote(target.absolutePath)} $requestedWeight"
                                    val result = RootShell.exec(command, timeoutMs = 25_000L)
                                    val jsonLine = result.stdout.lineSequence()
                                        .firstOrNull { it.trimStart().startsWith("{") }
                                    val root = jsonLine?.let { JSONObject(it.trim()) }
                                    if (result.code != 0 || root?.optString("status") != "ok") {
                                        error(
                                            root?.optString("message").orEmpty().ifBlank {
                                                result.stderr.ifBlank { "预览字体导出失败" }
                                            },
                                        )
                                    }
                                    if (!target.isFile || target.length() == 0L) {
                                        error("预览字体文件为空")
                                    }
                                    exported = true
                                }
                                if (!target.isFile || target.length() == 0L) {
                                    return@withPermit PreviewTypefaceState()
                                }
                                val loaded = Typeface.createFromFile(target)'''
          if old_export not in text:
              raise SystemExit('NativeFontPreview: export block missing')
          text = text.replace(old_export, new_export, 1)
          write(path, text)

          # 5) Shell 侧一次性批量导出 400 预览：一条 su 命令代替每张卡片一条。
          path = 'common/app_bridge.sh'
          text = read(path)
          marker = 'weight_axis_info() {'
          if marker not in text:
              raise SystemExit('app_bridge: weight_axis_info marker missing')
          batch = r'''preview_cache_key() {
    _pck_value="$1"
    if command -v sha256sum >/dev/null 2>&1; then
        printf '%s' "$_pck_value" | sha256sum 2>/dev/null | awk '{print substr($1,1,24)}'
    elif command -v busybox >/dev/null 2>&1; then
        printf '%s' "$_pck_value" | busybox sha256sum 2>/dev/null | awk '{print substr($1,1,24)}'
    else
        printf '%s' "$_pck_value" | cksum 2>/dev/null | awk '{printf "%024x", $1}'
    fi
}

preview_export_batch() {
    _peb_dest="${1:-}"
    case "$_peb_dest" in
        /data/user/0/io.github.xgl34222220.luoshu/cache/native-font-preview|/data/user/0/io.github.xgl34222220.luoshu/cache/native-font-preview/*|\
        /data/data/io.github.xgl34222220.luoshu/cache/native-font-preview|/data/data/io.github.xgl34222220.luoshu/cache/native-font-preview/*|\
        /data/user/0/io.github.xgl34222220.luoshu.debug/cache/native-font-preview|/data/user/0/io.github.xgl34222220.luoshu.debug/cache/native-font-preview/*|\
        /data/data/io.github.xgl34222220.luoshu.debug/cache/native-font-preview|/data/data/io.github.xgl34222220.luoshu.debug/cache/native-font-preview/*) ;;
        *) printf '{"status":"error","message":"批量预览目标目录不受信任"}\n'; return 1 ;;
    esac
    mkdir -p "$_peb_dest" 2>/dev/null || { printf '{"status":"error","message":"无法创建预览缓存目录"}\n'; return 1; }
    _peb_list="$MODDIR/config/.preview-families.$$"
    : > "$_peb_list" 2>/dev/null || return 1
    for _peb_file in "$USER_FONTS_DIR"/*.ttf "$USER_FONTS_DIR"/*.otf "$USER_FONTS_DIR"/*.ttc \
        "$USER_FONTS_DIR"/*.TTF "$USER_FONTS_DIR"/*.OTF "$USER_FONTS_DIR"/*.TTC; do
        [ -f "$_peb_file" ] || continue
        _peb_name="$(basename "$_peb_file")"
        case "$_peb_name" in SysFont*|SysSans*) continue ;; esac
        _peb_family="${_peb_name%.*}"
        case "$_peb_family" in
            *-Regular|*-Bold|*-Light|*-Medium|*-Thin|*-Black|*-Heavy|*-SemiBold|*-ExtraBold|*-ExtraLight|\
            *-regular|*-bold|*-light|*-medium|*-thin|*-black|*-heavy|*-semibold|*-extrabold|*-extralight)
                _peb_family="${_peb_family%-*}"
                ;;
        esac
        printf '%s\n' "$_peb_family" >> "$_peb_list"
    done
    LC_ALL=C sort -u -o "$_peb_list" "$_peb_list" 2>/dev/null || true
    _peb_count=0
    while IFS= read -r _peb_family; do
        [ -n "$_peb_family" ] || continue
        _peb_src="$(find_preview_source "$_peb_family" 400)"
        [ -f "$_peb_src" ] || continue
        _peb_ext="${_peb_src##*.}"
        _peb_ext="$(printf '%s' "$_peb_ext" | tr '[:upper:]' '[:lower:]')"
        case "$_peb_ext" in ttf|otf|ttc) ;; *) _peb_ext=ttf ;; esac
        _peb_variable_key="$(preview_cache_key "$_peb_family")"
        _peb_static_key="$(preview_cache_key "${_peb_family}|wght=400")"
        [ -n "$_peb_variable_key" ] && [ -n "$_peb_static_key" ] || continue
        _peb_variable="$_peb_dest/${_peb_variable_key}.${_peb_ext}"
        _peb_static="$_peb_dest/${_peb_static_key}.${_peb_ext}"
        cp -f "$_peb_src" "$_peb_variable" 2>/dev/null || continue
        chmod 0644 "$_peb_variable" 2>/dev/null || true
        rm -f "$_peb_static" 2>/dev/null || true
        ln "$_peb_variable" "$_peb_static" 2>/dev/null || cp -f "$_peb_variable" "$_peb_static" 2>/dev/null || true
        chmod 0644 "$_peb_static" 2>/dev/null || true
        _peb_count=$((_peb_count + 1))
    done < "$_peb_list"
    rm -f "$_peb_list" 2>/dev/null || true
    printf '{"status":"ok","data":{"count":%s}}\n' "$_peb_count"
}

'''
          text = text.replace(marker, batch + marker, 1)
          text = text.replace('    preview_export) preview_export "${2:-}" "${3:-}" "${4:-400}" ;;\n', '    preview_export) preview_export "${2:-}" "${3:-}" "${4:-400}" ;;\n    preview_export_batch) preview_export_batch "${2:-}" ;;\n', 1)
          write(path, text)

          # 6) 字体库视觉密度与预览热路径。
          path = 'android-app/app/src/main/java/io/github/xgl34222220/luoshu/ui/library/FontLibraryScreenCompact.kt'
          text = read(path)
          text = text.replace('fontSize = 34.sp,\n                        lineHeight = 39.sp,', 'fontSize = 30.sp,\n                        lineHeight = 35.sp,', 1)
          text = text.replace('shape = RoundedCornerShape(18.dp),', 'shape = RoundedCornerShape(20.dp),', 1)
          # 只收紧卡片预览尺寸，不改状态 pill 的胶囊圆角。
          text = text.replace('modifier = Modifier.size(58.dp),\n                shape = RoundedCornerShape(18.dp),', 'modifier = Modifier.size(52.dp),\n                shape = RoundedCornerShape(16.dp),', 1)
          text = text.replace('modifier = Modifier.size(58.dp),\n                    shape = RoundedCornerShape(18.dp),', 'modifier = Modifier.size(52.dp),\n                    shape = RoundedCornerShape(16.dp),', 1)
          text = text.replace('modifier = Modifier.size(58.dp).padding(6.dp),', 'modifier = Modifier.size(52.dp).padding(5.dp),', 1)
          text = text.replace('textSizeSp = 15.5f,', 'textSizeSp = 15f,', 1)
          text = text.replace('axes = if (font.variable) mapOf("wght" to 400f) else emptyMap(),\n                                modifier =', 'axes = if (font.variable) mapOf("wght" to 400f) else emptyMap(),\n                                rootFallback = false,\n                                modifier =', 1)
          text = text.replace('shape = RoundedCornerShape(22.dp),', 'shape = RoundedCornerShape(20.dp),', 2)
          text = text.replace('Column(Modifier.padding(14.dp))', 'Column(Modifier.padding(12.dp))', 1)
          text = text.replace('modifier = Modifier.fillMaxWidth().padding(14.dp),', 'modifier = Modifier.fillMaxWidth().padding(12.dp),', 1)
          text = text.replace('fontSize = 17.sp,\n                        lineHeight = 21.sp,', 'fontSize = 16.sp,\n                        lineHeight = 20.sp,', 1)
          write(path, text)

          # 7) 首页：状态并入 Hero，去掉重复大卡；粗细永远先显示数值。
          path = 'android-app/app/src/main/java/io/github/xgl34222220/luoshu/ui/home/HomeScreenMiuix.kt'
          text = read(path)
          status_block = '''        item { MiuixSectionTitle("SYSTEM STATUS", "运行状态", "Root 与字体挂载") }
        item {
            Row(horizontalArrangement = Arrangement.spacedBy(10.dp)) {
                MiuixMetricCard(
                    modifier = Modifier.weight(1f),
                    icon = Icons.Rounded.Security,
                    label = "Root",
                    value = if (state.rootGranted) state.rootManager else "未授权",
                    positive = state.rootGranted,
                )
                MiuixMetricCard(
                    modifier = Modifier.weight(1f),
                    icon = Icons.Rounded.Layers,
                    label = "挂载引擎",
