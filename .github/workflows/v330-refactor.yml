本版把 v3.2.0 稳定基线上的性能与界面优化合并为一个正式版本，重点是“预处理一次，前台秒开/秒切”，不引入 v3.2.3 / v3.2.4 的高风险挂载改动。

## 性能
- 合并 PR #181：导入/预热阶段预构建 100–900 UI + Mono 共 18 个字体成品，后续切换命中缓存时不再在前台重复启动 FontTools。
- 字体库改为本地索引优先；已有索引时进入字体库不再执行 Root 目录指纹扫描，导入、删除或手动刷新才重建。
- 新增批量字体预览预热：一次 Root 调用导出字体库 400 字重预览，列表卡片不再逐个执行 `su -> preview_export`。
- 字体预览继续保留内存 LRU 与磁盘缓存；列表缓存未就绪时使用非阻塞占位，不抢 UI 线程。
- 首页全局粗细值持久缓存，启动立即显示上次值；后台静默校验，并合并/节流重复 Root 读取。

## UI / 交互
- MIUIx 首页把 Root / 挂载状态并入当前字体 Hero，删除重复的大状态卡，信息层级更紧凑。
- 全局粗细卡始终优先显示数值，不再用大号“读取中”替代当前值。
- 字体库标题、卡片、预览尺寸与间距整体收紧，首屏可展示更多字体。
- 管理工具统一为更轻的玻璃层，降低彩色大卡片的视觉干扰。
- 设置中心降低标题、分段标签和卡片视觉重量，减少“满屏大卡片”的同质感。
- MIUIx 悬浮 Dock 更薄、更轻，选中液态胶囊更紧凑。

## 安全
- 保留 v3.2.0 的事务快照、payload 校验、挂载同步、Play/GMS provider 同步与失败回滚链路。
- 不重新引入 v3.2.3 / v3.2.4 的 OnePlus / ColorOS 高风险挂载改动。
''', encoding='utf-8')

