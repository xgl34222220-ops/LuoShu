name: v3.3.0 refactor validation

on:
  push:
    branches:
      - release/v3.3.0-ui-font-performance

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v3.3.0-ui-font-performance
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Apply v3.3.0 refactor
        run: python3 scripts/v330_apply.py
      - name: Static validation
        run: |
          git diff --check
          bash -n common/app_bridge.sh
          chmod +x scripts/app_font_loading_performance_test.sh
          sh scripts/app_font_loading_performance_test.sh
          sh scripts/font_library_ui_layout_test.sh
      - name: Compile and unit test App
        working-directory: android-app
        run: gradle --no-daemon --stacktrace :app:compileDebugKotlin :app:testDebugUnitTest
      - name: Commit validated refactor
        run: |
          rm -f scripts/v330_apply.py .github/workflows/v330-refactor.yml .v330-trigger
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: prepare LuoShu v3.3.0 UI and loading performance'
          git push origin HEAD:release/v3.3.0-ui-font-performance
