name: v3.3.0 refactor validation

on:
  push:
    branches:
      - release/v3.3.0-ui-font-performance

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v3.3.0-ui-font-performance
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Apply v3.3.0 refactor
        run: |
          sed -i 's/if count != 1:/if count < 1:/' scripts/v330_apply.py
          python3 scripts/v330_apply.py
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android-app/app/src/main/java/io/github/xgl34222220/luoshu/NativeFontPreview.kt')
          s = p.read_text(encoding='utf-8')
          old = '''    axes: Map<String, Float> = emptyMap(),
    rootFallback: Boolean = true,
    modifier: Modifier = Modifier,
    textSizeSp: Float = 25f,
    gravity: Int = Gravity.START or Gravity.CENTER_VERTICAL,
    maxLines: Int = 2,
'''
          new = '''    axes: Map<String, Float> = emptyMap(),
    modifier: Modifier = Modifier,
    textSizeSp: Float = 25f,
    gravity: Int = Gravity.START or Gravity.CENTER_VERTICAL,
    maxLines: Int = 2,
    rootFallback: Boolean = true,
'''
          if old not in s:
              raise SystemExit('NativeFontPreview signature fix target missing')
          s = s.replace(old, new, 1)
          old_loop = '''                                    repeat(40) {
                                        if (target.isFile && target.length() > 0L) return@repeat
                                        delay(150L)
                                    }
'''
          new_loop = '''                                    for (attempt in 0 until 40) {
                                        if (target.isFile && target.length() > 0L) break
                                        delay(150L)
                                    }
'''
          if old_loop not in s:
              raise SystemExit('NativeFontPreview wait loop fix target missing')
          p.write_text(s.replace(old_loop, new_loop, 1), encoding='utf-8')
          PY
          sed -i 's/navigationBottom + 88.dp/navigationBottom + 82.dp/g; s/RoundedCornerShape(31.dp)/RoundedCornerShape(28.dp)/g; s/RoundedCornerShape(23.dp)/RoundedCornerShape(21.dp)/g; s/Modifier.width(78.dp)/Modifier.width(74.dp)/g' scripts/font_library_ui_layout_test.sh
      - name: Static validation
        run: |
          git diff --check
          bash -n common/app_bridge.sh
          chmod +x scripts/app_font_loading_performance_test.sh
          sh scripts/app_font_loading_performance_test.sh
          sh scripts/font_library_ui_layout_test.sh
      - name: Compile and unit test App
        working-directory: android-app
        run: gradle --no-daemon --stacktrace :app:compileDebugKotlin :app:testDebugUnitTest
      - name: Commit validated refactor
        run: |
          rm -f scripts/v330_apply.py .github/workflows/v330-refactor.yml .v330-trigger
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: prepare LuoShu v3.3.0 UI and loading performance'
          git push origin HEAD:release/v3.3.0-ui-font-performance
