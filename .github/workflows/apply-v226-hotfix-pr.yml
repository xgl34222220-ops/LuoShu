name: Apply v2.2.6 hotfix from PR

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'hotfix/v2.2.6-trust-log' && github.event.pull_request.head.sha != ''
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/v2.2.6-trust-log
          fetch-depth: 0

      - name: Apply validated source payload
        shell: bash
        run: |
          set -euo pipefail
          if ! python3 .github/apply_v226_payload.py > /tmp/v226.out 2> /tmp/v226.err; then
            {
              echo 'STDOUT:'
              cat /tmp/v226.out
              echo
              echo 'STDERR:'
              cat /tmp/v226.err
            } > .github/v226-payload-error.txt
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add .github/v226-payload-error.txt
            git commit -m 'debug: capture v2.2.6 payload failure' || true
            git push origin HEAD:hotfix/v2.2.6-trust-log || true
            exit 1
          fi

      - name: Validate and commit
        shell: bash
        run: |
          set -euo pipefail
          sh -n common/util_functions.sh
          sh -n common/device_font_cache.sh
          grep -q 'val blocking: Boolean = true' android-app/app/src/main/java/io/github/xgl34222220/luoshu/ui/home/DeviceAcceptanceGuide.kt
          grep -q '设备专属对齐属于可选增强' android-app/app/src/main/java/io/github/xgl34222220/luoshu/ui/home/DeviceAcceptanceGuide.kt
          grep -q 'log_rom_detection_once hyperos' common/util_functions.sh
          grep -q 'type luoshu_sync_mount_payload' common/device_font_cache.sh
          ! test -e .github/workflows/apply-v226-hotfix.yml
          ! test -e .github/workflows/apply-v226-hotfix-pr.yml
          ! test -e .github/v226-hotfix-trigger
          ! test -e .github/apply_v226_payload.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'fix: correct trust states and deduplicate ROM logs'
          git push origin HEAD:hotfix/v2.2.6-trust-log
