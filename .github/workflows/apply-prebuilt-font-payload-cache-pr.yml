name: Apply prebuilt cache patch on PR

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'perf/prebuilt-font-payload-cache'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/prebuilt-font-payload-cache
          fetch-depth: 0

      - name: Extract and run one-shot patch
        shell: bash
        run: |
          set -euo pipefail
          sed -n "/python3 - <<'PY'/,/^          PY$/p" .github/workflows/apply-prebuilt-font-payload-cache.yml \
            | sed '1d;$d;s/^          //' > /tmp/apply_prebuilt_cache.py
          python3 - <<'PY'
          from pathlib import Path
          path = Path('/tmp/apply_prebuilt_cache.py')
          text = path.read_text()
          text = text.replace("test.write_text(r'''", "test_content = r'''", 1)
          text = text.replace("''').replace('\\n          ', '\\n').lstrip()\n\ncheck = root / 'scripts/check.sh'", "'''\ntest.write_text(test_content.replace('\\n          ', '\\n').lstrip())\n\ncheck = root / 'scripts/check.sh'", 1)
          path.write_text(text)
          PY
          python3 -m py_compile /tmp/apply_prebuilt_cache.py
          python3 /tmp/apply_prebuilt_cache.py

      - name: Run focused regression tests
        shell: bash
        run: |
          set -euo pipefail
          sh -n common/font_config_weights.sh
          sh -n common/font_manager.sh
          sh -n common/font_import.sh
          sh scripts/font_config_weights_test.sh
          sh scripts/font_payload_cache_test.sh
          sh scripts/font_switch_performance_test.sh
          sh scripts/weight_prepare_batch_test.sh

      - name: Commit implementation
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/apply-prebuilt-font-payload-cache.yml
          rm -f .github/workflows/apply-prebuilt-font-payload-cache-pr.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'perf: prebuild and reuse font payload weights'
          git push origin HEAD:perf/prebuilt-font-payload-cache
