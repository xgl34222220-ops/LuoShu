name: v3.3.0 final recovery validation

on:
  push:
    branches:
      - hotfix/v3.3.0-recover-final

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/v3.3.0-recover-final
          fetch-depth: 0

      - name: Install check dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends curl unzip zip file python3-venv fonts-noto-cjk fonts-dejavu-core >/dev/null

      - uses: actions/cache@v4
        with:
          path: common/python
          key: luoshu-arm64-runtime-${{ runner.os }}-${{ hashFiles('scripts/prepare_composite_runtime.sh') }}

      - name: Prepare ARM64 composite runtime
        run: |
          if [ ! -x common/python/bin/luoshu-python ]; then
            sh ./scripts/prepare_composite_runtime.sh
          fi

      - name: Apply verified recovery
        shell: bash
        run: |
          set -euo pipefail
          git checkout v3.2.0 -- \
            common/font_config_weights.sh \
            common/font_import.sh \
            common/native_import.sh \
            common/font_manager.sh
          python3 - <<'PY'
          from pathlib import Path
          p = Path('common/rom_adapters.sh')
          s = p.read_text(encoding='utf-8')
          old = 'if [ -n "$font_family" ] && type scan_family_weights >/dev/null 2>&1; then'
          count = s.count(old)
          if count < 2:
              raise SystemExit(f'expected >=2 quick-mode guard targets, got {count}')
          s = s.replace(old, 'if [ "$mode" != quick ] && [ -n "$font_family" ] && type scan_family_weights >/dev/null 2>&1; then')
          p.write_text(s, encoding='utf-8')

          p = Path('scripts/check.sh')
          s = p.read_text(encoding='utf-8')
          needle = 'sh "$ROOT/scripts/font_payload_cache_test.sh"\n'
          if needle not in s:
              raise SystemExit('font payload cache test invocation not found')
          p.write_text(s.replace(needle, '', 1), encoding='utf-8')

          p = Path('RELEASE_NOTES_v3.3.0.md')
          s = p.read_text(encoding='utf-8')
          note = '''\n## 覆盖修复\n- 撤回 v3.3.0 首发版新增的字体 payload 预构建缓存后端，恢复 v3.2.0 已验证稳定的字重生成链，优先解决真机“选择字体后系统仍保持默认字体”的回归。\n- 保留 App 字体库缓存与预览优化；这些 UI/浏览性能改动不参与系统字体 payload 生成。\n- ColorOS / HyperOS 的 quick 切换不再扫描 Bold / Medium / Light 等多字重族，减少前台切换重活。\n- 自挂载架构保持 v3.2.0 原样，不引入 v3.2.3 / v3.2.4 的高风险挂载方案。\n'''
          if '## 覆盖修复' not in s:
              s += note
          p.write_text(s, encoding='utf-8')
          PY

      - name: Full regression checks
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          sh -n common/font_config_weights.sh
          sh -n common/font_import.sh
          sh -n common/native_import.sh
          sh -n common/font_manager.sh
          sh -n common/rom_adapters.sh
          ! grep -q 'if \[ -n "$font_family" \] && type scan_family_weights' common/rom_adapters.sh
          grep -q 'if \[ "$mode" != quick \].*scan_family_weights' common/rom_adapters.sh
          sh scripts/self_mount_test.sh
          sh scripts/self_mount_atomic_test.sh
          sh scripts/device_font_foreground_quick_test.sh
          sh scripts/check.sh

      - name: Commit validated recovery
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/v330-recover-final.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: restore stable v3.3.0 font payload generation'
          git push origin HEAD:hotfix/v3.3.0-recover-final
