name: Google font provider fallback tests
on:
  pull_request:
    branches: [main]
    paths:
      - common/google_font_fallback*.py
      - common/google_font_fallback.sh
      - tools/google_font_fallback.py
      - tools/google_font_fallback.sh
      - scripts/google_font_fallback*test.py
      - .github/workflows/google-font-fallback-regression.yml
permissions:
  contents: read
jobs:
  fallback:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify component scope, Chinese integration and rollback
        run: |
          sh -n tools/google_font_fallback.sh
          sh -n common/google_font_fallback.sh
          python3 scripts/google_font_fallback_test.py
          python3 scripts/google_font_fallback_integration_test.py
