name: Font engine and cutover regression

on:
  pull_request:
    paths:
      - common/luoshu_engine.py
      - common/luoshu_engine.sh
      - common/luoshu_merge.py
      - common/luoshu_coverage_audit.py
      - common/luoshu_partial_variations.py
      - common/luoshu_payload.py
      - common/luoshu_verify.py
      - common/luoshu_diagnostics.py
      - common/universal_font_cutover.sh
      - common/universal_composite.sh
      - common/universal_next_boot.sh
      - common/universal_mount_runtime.sh
      - common/universal_font_runtime_verify.sh
      - common/next_boot_payload.sh
      - common/font_manager.sh
      - common/font_switch_task.sh
      - common/app_bridge.sh
      - android-app/app/src/main/java/io/github/xgl34222220/luoshu/LuoShuViewModel.kt
      - android-app/app/src/main/java/io/github/xgl34222220/luoshu/ui/home/HomeContract.kt
      - android-app/app/src/test/java/io/github/xgl34222220/luoshu/ui/home/HomeContractTest.kt
      - scripts/font_fixtures.py
      - scripts/luoshu_engine_test.py
      - scripts/luoshu_coverage_audit_test.py
      - scripts/luoshu_partial_variations_test.py
      - scripts/luoshu_engine_bridge_test.py
      - scripts/luoshu_verify_test.py
      - scripts/luoshu_diagnostics_test.py
      - scripts/universal_font_cutover_test.sh
      - scripts/universal_cutover_next_boot_test.sh
      - scripts/app_bridge_status_test.sh
      - scripts/module_payload_manifest.txt
      - docs/LUOSHU_ENGINE_V3.md
      - .github/workflows/font-production-cutover-regression.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  engine:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: ''
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Install font dependencies
        run: |
          python3 -m pip install --disable-pip-version-check 'fonttools==4.63.0'
      - name: Validate engine v3 and cutover
        run: |
          set -eu
          python3 -m py_compile \
            common/luoshu_engine.py common/luoshu_merge.py common/luoshu_payload.py \
            common/luoshu_coverage_audit.py common/luoshu_partial_variations.py \
            common/luoshu_verify.py common/luoshu_diagnostics.py
          for file in common/luoshu_engine.sh common/universal_font_cutover.sh common/universal_composite.sh \
            common/universal_next_boot.sh common/universal_font_runtime_verify.sh common/next_boot_payload.sh \
            common/font_manager.sh common/font_switch_task.sh common/app_bridge.sh; do
            sh -n "$file"
          done

          python3 scripts/luoshu_engine_test.py
          python3 scripts/luoshu_coverage_audit_test.py
          python3 scripts/luoshu_partial_variations_test.py
          python3 scripts/luoshu_engine_bridge_test.py
          python3 scripts/luoshu_verify_test.py
          python3 scripts/luoshu_diagnostics_test.py
          sh scripts/universal_font_cutover_test.sh
          sh scripts/universal_cutover_next_boot_test.sh
          sh scripts/app_bridge_status_test.sh

          cd android-app
          gradle --no-daemon --stacktrace :app:testDebugUnitTest
          cd ..

          for path in common/luoshu_engine.py common/luoshu_engine.sh common/luoshu_merge.py \
            common/luoshu_payload.py common/luoshu_verify.py common/universal_font_cutover.sh; do
            grep -qx "$path" scripts/module_payload_manifest.txt
          done
