name: v2.2.7 self-mount maintenance

on:
  pull_request:
    branches:
      - maintenance/v2.2.7
    paths:
      - common/mount_compat.sh
      - common/mount_compat_base.sh
      - common/mount_compat_policy.sh
      - common/mount_self_backend.sh
      - common/mount_self_fallback.sh
      - common/private_payload.sh
      - common/private_mount_policy.sh
      - common/font_config_partitions.sh
      - customize.sh
      - post-fs-data.sh
      - post-mount.sh
      - uninstall.sh
      - scripts/module_payload_manifest.txt
      - scripts/mount_compat_test.sh
      - scripts/meta_module_sync_test.sh
      - scripts/self_mount_test.sh
      - scripts/uninstall_cleanup_test.sh
      - scripts/v2_source_audit.sh
      - .github/workflows/v227-self-mount-maintenance.yml

permissions:
  contents: read

jobs:
  shell-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - name: Shell syntax
        run: |
          sh -n common/mount_compat.sh
          sh -n common/mount_compat_base.sh
          sh -n common/mount_compat_policy.sh
          sh -n common/mount_self_fallback.sh
          sh -n common/mount_self_backend.sh
          sh -n common/private_payload.sh
          sh -n common/private_mount_policy.sh
          sh -n customize.sh
          sh -n post-fs-data.sh
          sh -n post-mount.sh
          sh -n uninstall.sh
      - name: Self-mount simulation
        run: sh scripts/self_mount_test.sh
      - name: Uninstall cleanup simulation
        run: sh scripts/uninstall_cleanup_test.sh
      - name: Dual-directory initial sync
        run: sh scripts/mount_compat_test.sh dual-sync
      - name: Dual-directory atomic replacement
        run: sh scripts/mount_compat_test.sh dual-replace
      - name: Dual-directory probe verification
        run: sh scripts/mount_compat_test.sh dual-verify
      - name: Dual-directory unsupported partition policy
        run: sh scripts/mount_compat_test.sh dual-unsupported
      - name: Direct-source mount regression
        run: sh scripts/mount_compat_test.sh direct
      - name: Mount copy timeout regression
        run: sh scripts/mount_compat_test.sh timeout
      - name: Mount conflict diagnostics
        run: sh scripts/mount_compat_test.sh diagnostics
      - name: Mount static contracts
        run: sh scripts/mount_compat_test.sh static
      - name: Standalone meta sync regression
        run: sh scripts/meta_module_sync_test.sh
      - name: Release payload manifest
        run: |
          grep -qx 'common/mount_compat_base.sh' scripts/module_payload_manifest.txt
          grep -qx 'common/mount_compat_policy.sh' scripts/module_payload_manifest.txt
          grep -qx 'common/mount_self_backend.sh' scripts/module_payload_manifest.txt
          grep -qx 'common/mount_self_fallback.sh' scripts/module_payload_manifest.txt
          grep -qx 'common/private_payload.sh' scripts/module_payload_manifest.txt
          grep -qx 'common/private_mount_policy.sh' scripts/module_payload_manifest.txt
          grep -qx '.luoshu-runtime' scripts/module_payload_manifest.txt
          grep -qx 'post-mount.sh' scripts/module_payload_manifest.txt
      - name: Loader and backend contracts
        run: |
          grep -q 'mount_self_fallback.sh' common/mount_compat.sh
          grep -q 'mount_compat_policy.sh' common/mount_compat.sh
          grep -q 'private_mount_policy.sh' common/mount_compat.sh
          grep -q 'private_payload.sh' post-mount.sh
          grep -q 'luoshu_private_self_mount_ensure' post-mount.sh
          grep -q -- '-t overlay KSU' common/mount_self_backend.sh

  build-test-module:
    needs: shell-regression
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install module build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends curl unzip zip file python3-venv fonts-noto-cjk fonts-dejavu-core >/dev/null
      - name: Prepare ARM64 composite runtime
        shell: bash
        run: |
          if [[ ! -x common/python/bin/luoshu-python ]]; then
            sh scripts/prepare_composite_runtime.sh
          fi
      - name: Font validation cache regression
        run: sh scripts/font_validation_cache_test.sh
      - name: Font library layout regression
        run: sh scripts/font_library_ui_layout_test.sh
      - name: Stability regression
        run: sh scripts/stability_test.sh
      - name: Font library cache regression
        run: sh scripts/font_library_cache_test.sh
      - name: Bundled App installer regression
        run: sh scripts/app_installer_test.sh
      - name: Run complete source checks
        id: source_check
        continue-on-error: true
        shell: bash
        run: |
          set +e
          sh scripts/check.sh > "$RUNNER_TEMP/source-check.log" 2>&1
          rc=$?
          if [[ $rc -ne 0 ]]; then
            echo '=== source check failure ==='
            tail -n 160 "$RUNNER_TEMP/source-check.log"
            exit $rc
          fi
          tail -n 30 "$RUNNER_TEMP/source-check.log"
      - name: Upload source-check log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LuoShu-v2.2.7-source-check-log
          path: ${{ runner.temp }}/source-check.log
          if-no-files-found: warn
          retention-days: 14
      - name: Enforce source checks
        if: steps.source_check.outcome == 'failure'
        run: exit 1
      - name: Reuse signed v2.2.7 App and build test module
        shell: bash
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/LuoShu-App-v2.2.7.apk"
          curl -fL --retry 3 \
            'https://github.com/xgl34222220-ops/LuoShu/releases/download/v2.2.7/LuoShu-App-v2.2.7.apk' \
            -o "$app"
          set +e
          LUOSHU_APP_APK="$app" \
          LUOSHU_APP_PACKAGE='io.github.xgl34222220.luoshu' \
          LUOSHU_APP_VERSION_CODE='2020701' \
            sh scripts/build.sh > "$RUNNER_TEMP/module-build.log" 2>&1
          rc=$?
          if [[ $rc -ne 0 ]]; then
            echo '=== module build failure ==='
            tail -n 160 "$RUNNER_TEMP/module-build.log"
            exit $rc
          fi
          set -e
          tail -n 30 "$RUNNER_TEMP/module-build.log"
          cp -f dist/LuoShu-v2.2.7.zip dist/LuoShu-v2.2.7-self-mount-test.zip
          sha256sum dist/LuoShu-v2.2.7-self-mount-test.zip \
            > dist/LuoShu-v2.2.7-self-mount-test.zip.sha256
          unzip -Z1 dist/LuoShu-v2.2.7-self-mount-test.zip | grep -qx 'post-mount.sh'
          unzip -Z1 dist/LuoShu-v2.2.7-self-mount-test.zip | grep -qx 'common/mount_compat_base.sh'
          unzip -Z1 dist/LuoShu-v2.2.7-self-mount-test.zip | grep -qx 'common/mount_compat_policy.sh'
          unzip -Z1 dist/LuoShu-v2.2.7-self-mount-test.zip | grep -qx 'common/mount_self_backend.sh'
          unzip -Z1 dist/LuoShu-v2.2.7-self-mount-test.zip | grep -qx 'common/mount_self_fallback.sh'
          unzip -Z1 dist/LuoShu-v2.2.7-self-mount-test.zip | grep -qx 'common/private_payload.sh'
          unzip -Z1 dist/LuoShu-v2.2.7-self-mount-test.zip | grep -qx 'common/private_mount_policy.sh'
          unzip -Z1 dist/LuoShu-v2.2.7-self-mount-test.zip | grep -qx '.luoshu-runtime/customize-v227.sh'
      - name: Upload v2.2.7 self-mount test module
        uses: actions/upload-artifact@v4
        with:
          name: LuoShu-v2.2.7-self-mount-test
          path: |
            dist/LuoShu-v2.2.7-self-mount-test.zip
            dist/LuoShu-v2.2.7-self-mount-test.zip.sha256
          if-no-files-found: error
          retention-days: 14
