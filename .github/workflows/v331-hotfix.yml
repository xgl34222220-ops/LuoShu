name: v3.3.1 mount hotfix validation

on:
  push:
    branches:
      - hotfix/v3.3.1-mount-package

permissions:
  contents: write

jobs:
  hotfix:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/v3.3.1-mount-package
          fetch-depth: 0

      - name: Apply mount packaging and real quick-mode guards
        shell: bash
        run: |
          set -euo pipefail
          python3 -c 'from pathlib import Path; p=Path("scripts/check.sh"); s=p.read_text(); s=s.replace("module.prop customize.sh post-fs-data.sh service.sh uninstall.sh action.sh", "module.prop customize.sh post-fs-data.sh post-mount.sh service.sh uninstall.sh action.sh", 1); needle="test -s \"$PAYLOAD_MANIFEST\"\n"; ins="test -s \"$PAYLOAD_MANIFEST\"\ngrep -qx \"post-mount.sh\" \"$PAYLOAD_MANIFEST\"\n"; assert needle in s; p.write_text(s.replace(needle, ins, 1))'
          python3 -c 'from pathlib import Path; p=Path("scripts/build.sh"); s=p.read_text(); needle="unzip -t \"$ZIP\" >/dev/null\n"; ins="unzip -t \"$ZIP\" >/dev/null\nunzip -Z1 \"$ZIP\" | grep -qx \"post-mount.sh\" || { echo \"required mount hook missing from final ZIP: post-mount.sh\" >&2; exit 91; }\n"; assert needle in s; p.write_text(s.replace(needle, ins, 1))'
          python3 -c 'from pathlib import Path; p=Path("common/rom_adapters.sh"); s=p.read_text(); old="if [ -n \"$font_family\" ] && type scan_family_weights >/dev/null 2>&1; then"; n=s.count(old); assert n >= 2, n; p.write_text(s.replace(old, "if [ \"$mode\" != quick ] && [ -n \"$font_family\" ] && type scan_family_weights >/dev/null 2>&1; then"))'

      - name: Targeted regression checks
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          sh -n post-fs-data.sh
          sh -n post-mount.sh
          sh -n common/rom_adapters.sh
          sh -n scripts/check.sh
          sh -n scripts/build.sh
          grep -qx 'post-mount.sh' scripts/module_payload_manifest.txt
          grep -q 'post-fs-data.sh post-mount.sh service.sh' scripts/check.sh
          grep -q 'grep -qx "post-mount.sh" "$PAYLOAD_MANIFEST"' scripts/check.sh
          grep -q 'required mount hook missing from final ZIP: post-mount.sh' scripts/build.sh
          ! grep -q 'if \[ -n "$font_family" \] && type scan_family_weights' common/rom_adapters.sh
          grep -q 'if \[ "$mode" != quick \].*scan_family_weights' common/rom_adapters.sh
          sh scripts/self_mount_test.sh
          sh scripts/self_mount_atomic_test.sh
          sh scripts/device_font_foreground_quick_test.sh

      - name: Commit validated hotfix
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/v331-hotfix.yml .v331-trigger
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: restore KSU post-mount hook and true quick mode'
          git push origin HEAD:hotfix/v3.3.1-mount-package
