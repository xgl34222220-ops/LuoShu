name: Restore original LuoShu UI once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/restore-original-ui-v3-once.yml

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Restore pre-refactor UI on review branch and self-delete
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git fetch origin ui-video-rebuild-v3
          git switch -C ui-video-rebuild-v3 origin/ui-video-rebuild-v3
          git checkout 3e3a6abe3aa701afbea69abb259d21ef53c9b204 -- \
            android-app/app/src/main/java/io/github/xgl34222220/luoshu/LuoShuAppShell.kt \
            android-app/app/src/main/java/io/github/xgl34222220/luoshu/ui/home/HomeScreenCompact.kt \
            android-app/app/src/main/java/io/github/xgl34222220/luoshu/ui/library/FontLibraryScreenCompact.kt \
            android-app/app/src/main/java/io/github/xgl34222220/luoshu/ui/logs/LogsRoute.kt \
            android-app/app/src/main/java/io/github/xgl34222220/luoshu/ui/logs/LogsScreenCompact.kt \
            android-app/app/src/main/java/io/github/xgl34222220/luoshu/ui/settings/AppearanceSettingsScreen.kt \
            android-app/app/src/main/java/io/github/xgl34222220/luoshu/ui/studio/FontStudioScreenMaterial.kt \
            android-app/app/src/main/java/io/github/xgl34222220/luoshu/ui/studio/FontStudioScreenMiuix.kt \
            android-app/app/src/main/java/io/github/xgl34222220/luoshu/ui/theme/LuoShuTheme.kt \
            scripts/font_library_ui_layout_test.sh
          git rm -f --ignore-unmatch \
            android-app/app/src/main/java/io/github/xgl34222220/luoshu/ui/design/LuoShuComponents.kt \
            docs/UI_REBUILD_V1.1.md
          git add -A
          git commit -m 'revert: restore original compact UI before failed redesigns'
          git push origin HEAD:ui-video-rebuild-v3

          git switch main
          git pull --ff-only origin main
          rm -f .github/workflows/restore-original-ui-v3-once.yml
          git add -A
          git commit -m 'ops: remove one-shot original UI restore workflow [skip ci]'
          git push origin HEAD:main
