name: Fix final stability contract once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-final-stability-once.yml

permissions:
  contents: write

jobs:
  trace-stability:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Patch routed boot stability contract
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/stability_test.sh')
          s = p.read_text()
          old = "grep -q 'font-payload-rebuild-pending.conf' \"$ROOT/post-fs-data.sh\"\n"
          new = "grep -q 'font-payload-rebuild-pending.conf' \"$ROOT/post-fs-data-v4.sh\"\n" \
                "grep -q 'LEGACY_MODE=' \"$ROOT/post-fs-data.sh\"\n" \
                "grep -q 'exec sh \"$V4_POST_FS\"' \"$ROOT/post-fs-data.sh\"\n" \
                "! grep -q 'font-payload-rebuild-pending.conf' \"$ROOT/post-fs-data.sh\"\n"
          if old not in s:
              raise SystemExit('stability contract target not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Trace stability test
        run: sh -x ./scripts/stability_test.sh
