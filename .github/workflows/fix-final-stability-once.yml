name: Fix final stability contract once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-final-stability-once.yml

permissions:
  contents: write

jobs:
  verify-and-commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Patch routed stability contracts
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/stability_test.sh')
          s = p.read_text()
          old = "grep -q 'font-payload-rebuild-pending.conf' \"$ROOT/post-fs-data.sh\"\n"
          new = "grep -q 'font-payload-rebuild-pending.conf' \"$ROOT/post-fs-data-v4.sh\"\n" \
                "grep -q 'LEGACY_MODE=' \"$ROOT/post-fs-data.sh\"\n" \
                "grep -q 'exec sh \"$V4_POST_FS\"' \"$ROOT/post-fs-data.sh\"\n" \
                "! grep -q 'font-payload-rebuild-pending.conf' \"$ROOT/post-fs-data.sh\"\n"
          if old not in s:
              raise SystemExit('boot stability contract target not found')
          s = s.replace(old, new, 1)
          old = "grep -q 'native_font_index.json' \"$ROOT/common/font_manager.sh\"\n" \
                "grep -q 'native_font_index.key' \"$ROOT/common/font_manager.sh\"\n"
          new = "grep -q 'native_font_index.json' \"$ROOT/common/font_manager.sh\"\n" \
                "grep -q 'CURRENT_MANAGER=' \"$ROOT/common/font_manager.sh\"\n" \
                "grep -q 'native_font_index.json' \"$ROOT/common/font_manager_v4.sh\"\n" \
                "grep -q 'native_font_index.key' \"$ROOT/common/font_manager_v4.sh\"\n"
          if old not in s:
              raise SystemExit('font-manager stability contract target not found')
          s = s.replace(old, new, 1)
          old = "grep -q 'native-v3|' \"$ROOT/common/font_manager.sh\"\n"
          new = "grep -q 'native-v3|' \"$ROOT/common/font_manager_v4.sh\"\n"
          if old not in s:
              raise SystemExit('native cache schema stability target not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Trace stability test
        run: sh -x ./scripts/stability_test.sh
      - name: Commit verified stability contract
        run: |
          git config user.name 'xgl34222220-ops'
          git config user.email 'xgl34222220@gmail.com'
          git add scripts/stability_test.sh
          git diff --cached --quiet && exit 0
          git commit -m 'test: align stability checks with routed font runtime'
          git push origin HEAD:main
