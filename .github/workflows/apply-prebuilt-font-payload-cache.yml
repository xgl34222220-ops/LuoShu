name: Apply prebuilt font payload cache

on:
  push:
    branches:
      - perf/prebuilt-font-payload-cache
    paths:
      - .github/workflows/apply-prebuilt-font-payload-cache.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/prebuilt-font-payload-cache
          fetch-depth: 0

      - name: Apply cache-first font payload changes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path('.')
          weights = root / 'common/font_config_weights.sh'
          text = weights.read_text()

          new_source = r'''_luoshu_config_weight_library_role() {
              case "$1" in
                  100) printf 'thin\n' ;;
                  200) printf 'extralight\n' ;;
                  300) printf 'light\n' ;;
                  500) printf 'medium\n' ;;
                  600) printf 'semibold\n' ;;
                  700) printf 'bold\n' ;;
                  800) printf 'extrabold\n' ;;
                  900) printf 'black\n' ;;
                  *) printf 'regular\n' ;;
              esac
          }

          LUOSHU_CONFIG_WEIGHT_CACHE_VERSION="1"

          _luoshu_config_weight_cache_root() {
              _lcwc_module="$(_luoshu_config_weight_module)"
              printf '%s/config/font-payload-cache-v%s\n' "$_lcwc_module" "$LUOSHU_CONFIG_WEIGHT_CACHE_VERSION"
          }

          _luoshu_config_source_digest() {
              _lcwsd_source="$1"
              if type _font_source_digest >/dev/null 2>&1; then
                  _font_source_digest "$_lcwsd_source" 2>/dev/null && return 0
              fi
              if command -v sha256sum >/dev/null 2>&1; then
                  sha256sum "$_lcwsd_source" 2>/dev/null | awk '{print $1}'
                  return ${PIPESTATUS:-0} 2>/dev/null || true
              fi
              if command -v busybox >/dev/null 2>&1; then
                  busybox sha256sum "$_lcwsd_source" 2>/dev/null | awk '{print $1}'
                  return 0
              fi
              return 1
          }

          _luoshu_config_weight_source() {
              _lcw_weight="$1"
              _lcw_family="${2:-}"
              _lcw_hint="${3:-}"
              _lcw_module="$(_luoshu_config_weight_module)"
              _lcw_fonts="$_lcw_module/system/fonts"
              _lcw_role="$(_luoshu_config_weight_role "$_lcw_weight")"

              # Cache/prewarm path: resolve directly from the user's font family instead of first
              # rebuilding ROM aliases. This makes import-time preprocessing independent of the
              # active mount payload and lets a later switch reuse exactly the same 18 artifacts.
              if [ -n "$_lcw_hint" ] && [ -s "$_lcw_hint" ]; then
                  if [ -n "$_lcw_family" ] && type get_weight_file >/dev/null 2>&1; then
                      _lcw_library_role="$(_luoshu_config_weight_library_role "$_lcw_weight")"
                      _lcw_family_source="$(get_weight_file "$_lcw_family" "$_lcw_library_role" 2>/dev/null)"
                      if [ -s "$_lcw_family_source" ]; then
                          printf '%s\n' "$_lcw_family_source"
                          return 0
                      fi
                  fi
                  printf '%s\n' "$_lcw_hint"
                  return 0
              fi

              for _lcw_file in \
                  "$_lcw_fonts/.luoshu-font-store/wght-${_lcw_weight}.font" \
                  "$_lcw_fonts/${_lcw_weight}.ttf" \
                  "$_lcw_fonts/Roboto-${_lcw_role}.ttf" \
                  "$_lcw_fonts/GoogleSans-${_lcw_role}.ttf" \
                  "$_lcw_fonts/GoogleSansText-${_lcw_role}.ttf" \
                  "$_lcw_fonts/SysFont-${_lcw_role}.ttf" \
                  "$_lcw_fonts/SysSans-En-${_lcw_role}.ttf" \
                  "$_lcw_fonts/Opposans-En-${_lcw_role}.ttf" \
                  "$_lcw_fonts/SourceSansPro-${_lcw_role}.ttf" \
                  "$_lcw_fonts/NotoSans-${_lcw_role}.ttf"; do
                  [ -s "$_lcw_file" ] || continue
                  _lcw_size=$(wc -c < "$_lcw_file" 2>/dev/null | tr -d '[:space:]')
                  case "$_lcw_size" in ''|*[!0-9]*) _lcw_size=0 ;; esac
                  [ "$_lcw_size" -ge 1024 ] || continue
                  printf '%s\n' "$_lcw_file"
                  return 0
              done

              for _lcw_file in \
                  "$_lcw_fonts/.luoshu-font-store/regular.font" \
                  "$_lcw_fonts/.luoshu-font-store/mix-composite.font" \
                  "$_lcw_fonts/400.ttf" \
                  "$_lcw_fonts/Roboto-Regular.ttf" \
                  "$_lcw_fonts/GoogleSans-Regular.ttf" \
                  "$_lcw_fonts/GoogleSansText-Regular.ttf" \
                  "$_lcw_fonts/SysFont-Regular.ttf" \
                  "$_lcw_fonts/SysSans-En-Regular.ttf" \
                  "$_lcw_fonts/MiSansVF.ttf" \
                  "$_lcw_fonts/NotoSansCJK-Regular.ttc" \
                  "$_lcw_fonts/NotoSans-Regular.ttf"; do
                  [ -s "$_lcw_file" ] || continue
                  _lcw_size=$(wc -c < "$_lcw_file" 2>/dev/null | tr -d '[:space:]')
                  case "$_lcw_size" in ''|*[!0-9]*) _lcw_size=0 ;; esac
                  [ "$_lcw_size" -ge 1024 ] || continue
                  printf '%s\n' "$_lcw_file"
                  return 0
              done
              return 1
          }'''

          pattern = re.compile(r'_luoshu_config_weight_source\(\) \{.*?\n\}\n\n_luoshu_config_normalize_weight\(\)', re.S)
          text, count = pattern.subn(new_source + '\n\n_luoshu_config_normalize_weight()', text, count=1)
          assert count == 1, 'failed to replace weight source resolver'

          new_tail = r'''_luoshu_config_weight_cache_key() {
              _lcwk_family="${1:-}"
              _lcwk_hint="${2:-}"
              _lcwk_module="$(_luoshu_config_weight_module)"
              _lcwk_tmp="${CONFIG_DIR:-$_lcwk_module/config}/.font-payload-key.$$"
              mkdir -p "${_lcwk_tmp%/*}" 2>/dev/null || return 1
              : > "$_lcwk_tmp" 2>/dev/null || return 1
              printf 'schema=%s\n' "$LUOSHU_CONFIG_WEIGHT_CACHE_VERSION" >> "$_lcwk_tmp"
              for _lcwk_weight in 100 200 300 400 500 600 700 800 900; do
                  _lcwk_source="$(_luoshu_config_weight_source "$_lcwk_weight" "$_lcwk_family" "$_lcwk_hint")" || {
                      rm -f "$_lcwk_tmp" 2>/dev/null || true
                      return 1
                  }
                  _lcwk_digest="$(_luoshu_config_source_digest "$_lcwk_source")" || {
                      rm -f "$_lcwk_tmp" 2>/dev/null || true
                      return 1
                  }
                  _lcwk_size=$(wc -c < "$_lcwk_source" 2>/dev/null | tr -d '[:space:]')
                  printf '%s|%s|%s\n' "$_lcwk_weight" "$_lcwk_digest" "${_lcwk_size:-0}" >> "$_lcwk_tmp"
              done
              if command -v sha256sum >/dev/null 2>&1; then
                  _lcwk_key=$(sha256sum "$_lcwk_tmp" 2>/dev/null | awk '{print $1}')
              elif command -v busybox >/dev/null 2>&1; then
                  _lcwk_key=$(busybox sha256sum "$_lcwk_tmp" 2>/dev/null | awk '{print $1}')
              else
                  _lcwk_key=''
              fi
              rm -f "$_lcwk_tmp" 2>/dev/null || true
              [ -n "$_lcwk_key" ] || return 1
              printf '%s\n' "$_lcwk_key"
          }

          _luoshu_config_weight_cache_dir() {
              _lcwcd_key="$1"
              printf '%s/%s\n' "$(_luoshu_config_weight_cache_root)" "$_lcwcd_key"
          }

          _luoshu_config_weight_cache_valid() {
              _lcwcv_dir="$1"
              [ -f "$_lcwcv_dir/.complete" ] || return 1
              grep -qx "schema=$LUOSHU_CONFIG_WEIGHT_CACHE_VERSION" "$_lcwcv_dir/.complete" 2>/dev/null || return 1
              for _lcwcv_weight in 100 200 300 400 500 600 700 800 900; do
                  for _lcwcv_prefix in LuoShu LuoShuMono; do
                      _lcwcv_file="$_lcwcv_dir/${_lcwcv_prefix}-${_lcwcv_weight}.ttf"
                      [ -s "$_lcwcv_file" ] || return 1
                      _lcwcv_size=$(wc -c < "$_lcwcv_file" 2>/dev/null | tr -d '[:space:]')
                      case "$_lcwcv_size" in ''|*[!0-9]*) return 1 ;; esac
                      [ "$_lcwcv_size" -ge 1024 ] || return 1
                  done
              done
              return 0
          }

          _luoshu_config_weight_cache_restore() {
              _lcwcr_dir="$1"
              _lcwcr_module="$(_luoshu_config_weight_module)"
              _lcwcr_fonts="$_lcwcr_module/system/fonts"
              _luoshu_config_weight_cache_valid "$_lcwcr_dir" || return 1
              mkdir -p "$_lcwcr_fonts" 2>/dev/null || return 1
              for _lcwcr_weight in 100 200 300 400 500 600 700 800 900; do
                  for _lcwcr_prefix in LuoShu LuoShuMono; do
                      _lcwcr_source="$_lcwcr_dir/${_lcwcr_prefix}-${_lcwcr_weight}.ttf"
                      _lcwcr_dest="$_lcwcr_fonts/${_lcwcr_prefix}-${_lcwcr_weight}.ttf"
                      rm -f "$_lcwcr_dest" 2>/dev/null || true
                      ln "$_lcwcr_source" "$_lcwcr_dest" 2>/dev/null || cp -f "$_lcwcr_source" "$_lcwcr_dest" 2>/dev/null || return 1
                      chmod 0644 "$_lcwcr_dest" 2>/dev/null || true
                  done
              done
              return 0
          }

          _luoshu_config_weight_cache_store() {
              _lcwcs_stage="$1"
              _lcwcs_key="$2"
              [ -d "$_lcwcs_stage" ] && [ -n "$_lcwcs_key" ] || return 1
              _lcwcs_root="$(_luoshu_config_weight_cache_root)"
              _lcwcs_dir="$(_luoshu_config_weight_cache_dir "$_lcwcs_key")"
              if _luoshu_config_weight_cache_valid "$_lcwcs_dir"; then
                  return 0
              fi
              mkdir -p "$_lcwcs_root" 2>/dev/null || return 1
              _lcwcs_tmp="${_lcwcs_dir}.tmp.$$"
              rm -rf "$_lcwcs_tmp" 2>/dev/null || true
              mkdir -p "$_lcwcs_tmp" 2>/dev/null || return 1
              for _lcwcs_weight in 100 200 300 400 500 600 700 800 900; do
                  for _lcwcs_prefix in LuoShu LuoShuMono; do
                      _lcwcs_source="$_lcwcs_stage/${_lcwcs_prefix}-${_lcwcs_weight}.ttf"
                      _lcwcs_dest="$_lcwcs_tmp/${_lcwcs_prefix}-${_lcwcs_weight}.ttf"
                      [ -s "$_lcwcs_source" ] || { rm -rf "$_lcwcs_tmp"; return 1; }
                      ln "$_lcwcs_source" "$_lcwcs_dest" 2>/dev/null || cp -f "$_lcwcs_source" "$_lcwcs_dest" 2>/dev/null || {
                          rm -rf "$_lcwcs_tmp" 2>/dev/null || true
                          return 1
                      }
                      chmod 0644 "$_lcwcs_dest" 2>/dev/null || true
                  done
              done
              printf 'schema=%s\nkey=%s\n' "$LUOSHU_CONFIG_WEIGHT_CACHE_VERSION" "$_lcwcs_key" > "$_lcwcs_tmp/.complete" 2>/dev/null || {
                  rm -rf "$_lcwcs_tmp" 2>/dev/null || true
                  return 1
              }
              chmod 0644 "$_lcwcs_tmp/.complete" 2>/dev/null || true
              rm -rf "$_lcwcs_dir" 2>/dev/null || true
              mv -f "$_lcwcs_tmp" "$_lcwcs_dir" 2>/dev/null || {
                  rm -rf "$_lcwcs_tmp" 2>/dev/null || true
                  return 1
              }
              return 0
          }

          _luoshu_config_build_weight_stage() {
              _lcwbs_stage="$1"
              _lcwbs_family="${2:-}"
              _lcwbs_hint="${3:-}"
              rm -rf "$_lcwbs_stage" 2>/dev/null || true
              mkdir -p "$_lcwbs_stage" 2>/dev/null || return 1
              for _lcwbs_weight in 100 200 300 400 500 600 700 800 900; do
                  _lcwbs_source="$(_luoshu_config_weight_source "$_lcwbs_weight" "$_lcwbs_family" "$_lcwbs_hint")" || {
                      rm -rf "$_lcwbs_stage" 2>/dev/null || true
                      return 1
                  }
                  _lcwbs_target="$_lcwbs_stage/LuoShu-${_lcwbs_weight}.ttf"
                  _lcwbs_mono="$_lcwbs_stage/LuoShuMono-${_lcwbs_weight}.ttf"
                  _luoshu_config_normalize_weight "$_lcwbs_source" "$_lcwbs_target" "$_lcwbs_weight" || {
                      rm -rf "$_lcwbs_stage" 2>/dev/null || true
                      return 1
                  }
                  _luoshu_config_make_mono_weight "$_lcwbs_target" "$_lcwbs_mono" "$_lcwbs_weight" || {
                      rm -rf "$_lcwbs_stage" 2>/dev/null || true
                      return 1
                  }
              done
              return 0
          }

          font_config_prewarm_payload_weights() {
              _lcwp_family="${1:-}"
              _lcwp_hint="${2:-}"
              [ -n "$_lcwp_hint" ] && [ -s "$_lcwp_hint" ] || return 1
              _lcwp_module="$(_luoshu_config_weight_module)"
              _lcwp_key="$(_luoshu_config_weight_cache_key "$_lcwp_family" "$_lcwp_hint")" || return 1
              _lcwp_cache="$(_luoshu_config_weight_cache_dir "$_lcwp_key")"
              _luoshu_config_weight_cache_valid "$_lcwp_cache" && return 0
              _lcwp_stage="${CONFIG_DIR:-$_lcwp_module/config}/font-config-prewarm.$$"
              _luoshu_config_build_weight_stage "$_lcwp_stage" "$_lcwp_family" "$_lcwp_hint" || return 1
              _luoshu_config_weight_cache_store "$_lcwp_stage" "$_lcwp_key"
              _lcwp_rc=$?
              rm -rf "$_lcwp_stage" 2>/dev/null || true
              return "$_lcwp_rc"
          }

          font_config_prepare_payload_weights() {
              _lcw_family="${1:-}"
              _lcw_hint="${2:-}"
              _lcw_module="$(_luoshu_config_weight_module)"
              _lcw_fonts="$_lcw_module/system/fonts"
              mkdir -p "$_lcw_fonts" "$_lcw_module/config" 2>/dev/null || return 1

              _lcw_key="$(_luoshu_config_weight_cache_key "$_lcw_family" "$_lcw_hint" 2>/dev/null || true)"
              if [ -n "$_lcw_key" ]; then
                  _lcw_cache="$(_luoshu_config_weight_cache_dir "$_lcw_key")"
                  if _luoshu_config_weight_cache_restore "$_lcw_cache"; then
                      return 0
                  fi
              fi

              _lcw_stage="$_lcw_module/config/font-config-weights.$$"
              _luoshu_config_build_weight_stage "$_lcw_stage" "$_lcw_family" "$_lcw_hint" || return 1

              if [ -n "$_lcw_key" ]; then
                  _luoshu_config_weight_cache_store "$_lcw_stage" "$_lcw_key" >/dev/null 2>&1 || true
              fi

              for _lcw_weight in 100 200 300 400 500 600 700 800 900; do
                  for _lcw_prefix in LuoShu LuoShuMono; do
                      _lcw_ready="$_lcw_stage/${_lcw_prefix}-${_lcw_weight}.ttf"
                      _lcw_dest="$_lcw_fonts/${_lcw_prefix}-${_lcw_weight}.ttf"
                      rm -f "$_lcw_dest" 2>/dev/null || true
                      mv -f "$_lcw_ready" "$_lcw_dest" 2>/dev/null || {
                          rm -rf "$_lcw_stage" 2>/dev/null || true
                          return 1
                      }
                  done
              done
              rmdir "$_lcw_stage" 2>/dev/null || true
              return 0
          }

          font_config_enable_for_payload() {
              _lcw_family="${1:-unknown}"
              _lcw_hint="${2:-}"
              type font_config_generate >/dev/null 2>&1 || return 1
              font_config_prepare_payload_weights "$_lcw_family" "$_lcw_hint" || {
                  type font_config_disable >/dev/null 2>&1 && font_config_disable
                  return 1
              }
              font_config_generate "$_lcw_family"
          }
          '''

          start = text.find('font_config_prepare_payload_weights() {')
          assert start >= 0, 'missing prepare function'
          text = text[:start] + new_tail
          weights.write_text(text)

          manager = root / 'common/font_manager.sh'
          m = manager.read_text()
          old = 'font_config_enable_for_payload "$_font_id" || \\\n'
          new = 'font_config_enable_for_payload "$_font_id" "$_source" || \\\n'
          assert old in m, 'font manager enable call not found'
          manager.write_text(m.replace(old, new, 1))

          imp = root / 'common/font_import.sh'
          s = imp.read_text()
          marker = 'IMPORT_PYBIN="${IMPORT_PYBIN:-$IMPORT_PYROOT/bin/luoshu-python}"\n'
          addition = marker + '''\n# Import is the right place to pay the expensive FontTools cost. Build the deterministic\n# 100-900 UI/Mono payload once here; later switches only restore hard-linked cache entries.\n[ -f "${MODULE_DIR:-/data/adb/modules/LuoShu}/common/font_config_runtime.sh" ] && \\\n    . "${MODULE_DIR:-/data/adb/modules/LuoShu}/common/font_config_runtime.sh"\n[ -f "${MODULE_DIR:-/data/adb/modules/LuoShu}/common/font_config_weights.sh" ] && \\\n    . "${MODULE_DIR:-/data/adb/modules/LuoShu}/common/font_config_weights.sh"\n'''
          assert marker in s, 'import runtime marker not found'
          s = s.replace(marker, addition, 1)
          call = '        import_write_font_config "$_font_id" "$_display_name" "$_zip_name" "$_module_version" "$_module_author" "$_supports_cjk" "$_best_variable" || true\n'
          prewarm = call + '''        _prewarm_source="$USER_FONTS_DIR/$_target_name"\n        if [ -s "$_prewarm_source" ] && type font_config_prewarm_payload_weights >/dev/null 2>&1; then\n            font_config_prewarm_payload_weights "$_font_id" "$_prewarm_source" >/dev/null 2>&1 || true\n        fi\n'''
          assert call in s, 'import metadata call not found'
          imp.write_text(s.replace(call, prewarm, 1))

          test = root / 'scripts/font_payload_cache_test.sh'
          test.write_text(r'''#!/bin/sh
          set -eu
          ROOT=$(CDPATH= cd -- "$(dirname -- "$0")/.." && pwd)
          TMP=$(mktemp -d)
          trap 'rm -rf "$TMP"' EXIT HUP INT TERM
          MOD="$TMP/module"
          LIB="$TMP/fonts"
          mkdir -p "$MOD/common" "$MOD/system/fonts" "$MOD/config" "$LIB"
          cp -f "$ROOT/common/font_config_weights.sh" "$MOD/common/font_config_weights.sh"

          SRC="$LIB/Demo-Regular.ttf"
          dd if=/dev/zero of="$SRC" bs=2048 count=1 2>/dev/null
          printf 'demo-font-v1\n' >> "$SRC"

          export MODDIR="$MOD"
          export MODULE_DIR="$MOD"
          export CONFIG_DIR="$MOD/config"
          export USER_FONTS_DIR="$LIB"

          get_weight_file() { printf '%s\n' "$SRC"; }
          _font_source_digest() { sha256sum "$1" | awk '{print $1}'; }
          . "$MOD/common/font_config_weights.sh"
          set -eu

          # Host test substitutes cheap builders; the cache contract must not depend on FontTools.
          _luoshu_config_normalize_weight() { cp -f "$1" "$2"; }
          _luoshu_config_make_mono_weight() { cp -f "$1" "$2"; }

          KEY1=$(_luoshu_config_weight_cache_key Demo "$SRC")
          font_config_prewarm_payload_weights Demo "$SRC"
          CACHE=$(_luoshu_config_weight_cache_dir "$KEY1")
          _luoshu_config_weight_cache_valid "$CACHE"

          # Prewarm is side-effect free for the currently active payload.
          test ! -e "$MOD/system/fonts/LuoShu-400.ttf"
          test ! -e "$MOD/system/fonts/LuoShuMono-400.ttf"

          MARKER="$TMP/generator-called"
          _luoshu_config_normalize_weight() { printf 'called\n' >> "$MARKER"; return 99; }
          _luoshu_config_make_mono_weight() { printf 'called\n' >> "$MARKER"; return 99; }
          font_config_prepare_payload_weights Demo "$SRC"
          test ! -e "$MARKER"

          for weight in 100 200 300 400 500 600 700 800 900; do
              test -s "$MOD/system/fonts/LuoShu-${weight}.ttf"
              test -s "$MOD/system/fonts/LuoShuMono-${weight}.ttf"
          done

          # Changing source bytes must invalidate the complete payload key.
          printf 'changed\n' >> "$SRC"
          KEY2=$(_luoshu_config_weight_cache_key Demo "$SRC")
          test "$KEY1" != "$KEY2"

          printf 'Font payload cache tests passed.\n'
          ''').replace('\n          ', '\n').lstrip()

          check = root / 'scripts/check.sh'
          c = check.read_text()
          list_marker = 'scripts/device_font_cache_budget_test.sh scripts/provider_pid_scan_test.sh scripts/weight_prepare_batch_test.sh scripts/slot_build_instance_cache_test.py'
          assert list_marker in c, 'check manifest marker missing'
          c = c.replace(list_marker, 'scripts/device_font_cache_budget_test.sh scripts/provider_pid_scan_test.sh scripts/weight_prepare_batch_test.sh scripts/font_payload_cache_test.sh scripts/slot_build_instance_cache_test.py', 1)
          run_marker = 'sh "$ROOT/scripts/weight_prepare_batch_test.sh"\n'
          assert run_marker in c, 'check run marker missing'
          c = c.replace(run_marker, run_marker + 'sh "$ROOT/scripts/font_payload_cache_test.sh"\n', 1)
          check.write_text(c)
          PY

      - name: Run focused regression tests
        shell: bash
        run: |
          set -euo pipefail
          sh -n common/font_config_weights.sh
          sh -n common/font_manager.sh
          sh -n common/font_import.sh
          sh scripts/font_config_weights_test.sh
          sh scripts/font_payload_cache_test.sh
          sh scripts/font_switch_performance_test.sh
          sh scripts/weight_prepare_batch_test.sh

      - name: Commit patch and remove one-shot workflow
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -f .github/workflows/apply-prebuilt-font-payload-cache.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'perf: prebuild and reuse font payload weights'
          git push origin HEAD:perf/prebuilt-font-payload-cache
