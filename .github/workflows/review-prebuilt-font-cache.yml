name: Apply prebuilt cache review fixes

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  review-fix:
    if: github.head_ref == 'perf/prebuilt-font-payload-cache'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/prebuilt-font-payload-cache
          fetch-depth: 0

      - name: Apply review fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path('.')
          path = root / 'common/font_config_weights.sh'
          text = path.read_text()

          digest_pattern = re.compile(r'_luoshu_config_source_digest\(\) \{.*?\n\}\n\n_luoshu_config_weight_source\(\)', re.S)
          digest_replacement = r'''_luoshu_config_fast_size() {
              _lcwfs_file="$1"
              if command -v stat >/dev/null 2>&1; then
                  stat -c '%s' "$_lcwfs_file" 2>/dev/null && return 0
              fi
              if command -v toybox >/dev/null 2>&1; then
                  toybox stat -c '%s' "$_lcwfs_file" 2>/dev/null && return 0
              fi
              wc -c < "$_lcwfs_file" 2>/dev/null | tr -d '[:space:]'
          }

          _luoshu_config_source_digest() {
              _lcwsd_source="$1"
              _lcwsd_digest=''
              if type _font_source_digest >/dev/null 2>&1; then
                  _lcwsd_digest="$(_font_source_digest "$_lcwsd_source" 2>/dev/null)" || _lcwsd_digest=''
              fi
              if [ -z "$_lcwsd_digest" ] && command -v sha256sum >/dev/null 2>&1; then
                  _lcwsd_digest="$(sha256sum "$_lcwsd_source" 2>/dev/null | awk '{print $1}')"
              fi
              if [ -z "$_lcwsd_digest" ] && command -v busybox >/dev/null 2>&1; then
                  _lcwsd_digest="$(busybox sha256sum "$_lcwsd_source" 2>/dev/null | awk '{print $1}')"
              fi
              [ -n "$_lcwsd_digest" ] || return 1
              printf '%s\n' "$_lcwsd_digest"
          }

          _luoshu_config_weight_source()'''
          text, count = digest_pattern.subn(digest_replacement, text, count=1)
          assert count == 1, 'digest block not found'

          text = text.replace('_lcw_size=$(wc -c < "$_lcw_file" 2>/dev/null | tr -d \'[:space:]\')', '_lcw_size=$(_luoshu_config_fast_size "$_lcw_file")')
          text = text.replace('_lcw_size=$(wc -c < "$_lcw_output" 2>/dev/null | tr -d \'[:space:]\')', '_lcw_size=$(_luoshu_config_fast_size "$_lcw_output")')
          text = text.replace('_lcwk_size=$(wc -c < "$_lcwk_source" 2>/dev/null | tr -d \'[:space:]\')', '_lcwk_size=$(_luoshu_config_fast_size "$_lcwk_source")')
          text = text.replace('_lcwcv_size=$(wc -c < "$_lcwcv_file" 2>/dev/null | tr -d \'[:space:]\')', '_lcwcv_size=$(_luoshu_config_fast_size "$_lcwcv_file")')

          restore_pattern = re.compile(r'_luoshu_config_weight_cache_restore\(\) \{.*?\n\}\n\n_luoshu_config_weight_cache_store\(\)', re.S)
          restore_replacement = r'''_luoshu_config_weight_active_clear() {
              _lcwac_module="$(_luoshu_config_weight_module)"
              _lcwac_fonts="$_lcwac_module/system/fonts"
              for _lcwac_weight in 100 200 300 400 500 600 700 800 900; do
                  rm -f "$_lcwac_fonts/LuoShu-${_lcwac_weight}.ttf" \
                        "$_lcwac_fonts/LuoShuMono-${_lcwac_weight}.ttf" 2>/dev/null || true
              done
          }

          _luoshu_config_weight_cache_restore() {
              _lcwcr_dir="$1"
              _lcwcr_module="$(_luoshu_config_weight_module)"
              _lcwcr_fonts="$_lcwcr_module/system/fonts"
              _luoshu_config_weight_cache_valid "$_lcwcr_dir" || return 1
              mkdir -p "$_lcwcr_fonts" "${CONFIG_DIR:-$_lcwcr_module/config}" 2>/dev/null || return 1
              _lcwcr_stage="${CONFIG_DIR:-$_lcwcr_module/config}/font-config-cache-restore.$$"
              rm -rf "$_lcwcr_stage" 2>/dev/null || true
              mkdir -p "$_lcwcr_stage" 2>/dev/null || return 1
              for _lcwcr_weight in 100 200 300 400 500 600 700 800 900; do
                  for _lcwcr_prefix in LuoShu LuoShuMono; do
                      _lcwcr_source="$_lcwcr_dir/${_lcwcr_prefix}-${_lcwcr_weight}.ttf"
                      _lcwcr_ready="$_lcwcr_stage/${_lcwcr_prefix}-${_lcwcr_weight}.ttf"
                      ln "$_lcwcr_source" "$_lcwcr_ready" 2>/dev/null || cp -f "$_lcwcr_source" "$_lcwcr_ready" 2>/dev/null || {
                          rm -rf "$_lcwcr_stage" 2>/dev/null || true
                          return 1
                      }
                      chmod 0644 "$_lcwcr_ready" 2>/dev/null || true
                  done
              done
              for _lcwcr_weight in 100 200 300 400 500 600 700 800 900; do
                  for _lcwcr_prefix in LuoShu LuoShuMono; do
                      _lcwcr_ready="$_lcwcr_stage/${_lcwcr_prefix}-${_lcwcr_weight}.ttf"
                      _lcwcr_dest="$_lcwcr_fonts/${_lcwcr_prefix}-${_lcwcr_weight}.ttf"
                      rm -f "$_lcwcr_dest" 2>/dev/null || true
                      mv -f "$_lcwcr_ready" "$_lcwcr_dest" 2>/dev/null || {
                          rm -rf "$_lcwcr_stage" 2>/dev/null || true
                          _luoshu_config_weight_active_clear
                          return 1
                      }
                  done
              done
              rmdir "$_lcwcr_stage" 2>/dev/null || true
              touch "$_lcwcr_dir/.complete" 2>/dev/null || true
              return 0
          }

          _luoshu_config_weight_cache_store()'''
          text, count = restore_pattern.subn(restore_replacement, text, count=1)
          assert count == 1, 'cache restore block not found'

          store_end = '''    return 0\n}\n\n_luoshu_config_build_weight_stage() {'''
          prune = '''    _luoshu_config_weight_cache_prune >/dev/null 2>&1 || true\n    return 0\n}\n\nLUOSHU_CONFIG_WEIGHT_CACHE_MAX_ENTRIES="${LUOSHU_CONFIG_WEIGHT_CACHE_MAX_ENTRIES:-3}"\n\n_luoshu_config_weight_cache_prune() {\n    _lcwcp_root="$(_luoshu_config_weight_cache_root)"\n    _lcwcp_max="$LUOSHU_CONFIG_WEIGHT_CACHE_MAX_ENTRIES"\n    case "$_lcwcp_max" in ''|*[!0-9]*) _lcwcp_max=3 ;; esac\n    [ "$_lcwcp_max" -ge 1 ] 2>/dev/null || _lcwcp_max=1\n    [ -d "$_lcwcp_root" ] || return 0\n    _lcwcp_count=0\n    for _lcwcp_dir in $(ls -1dt "$_lcwcp_root"/* 2>/dev/null); do\n        [ -d "$_lcwcp_dir" ] || continue\n        _lcwcp_count=$((_lcwcp_count + 1))\n        [ "$_lcwcp_count" -le "$_lcwcp_max" ] && continue\n        rm -rf "$_lcwcp_dir" 2>/dev/null || true\n    done\n    return 0\n}\n\n_luoshu_config_link_font() {\n    _lcwlf_source="$1"\n    _lcwlf_dest="$2"\n    rm -f "$_lcwlf_dest" 2>/dev/null || true\n    ln "$_lcwlf_source" "$_lcwlf_dest" 2>/dev/null || cp -f "$_lcwlf_source" "$_lcwlf_dest" 2>/dev/null || return 1\n    chmod 0644 "$_lcwlf_dest" 2>/dev/null || true\n    _lcwlf_size=$(_luoshu_config_fast_size "$_lcwlf_dest")\n    case "$_lcwlf_size" in ''|*[!0-9]*) return 1 ;; esac\n    [ "$_lcwlf_size" -ge 1024 ]\n}\n\n_luoshu_config_build_weight_stage() {'''
          assert store_end in text, 'cache store tail not found'
          text = text.replace(store_end, prune, 1)

          build_pattern = re.compile(r'_luoshu_config_build_weight_stage\(\) \{.*?\n\}\n\nfont_config_prewarm_payload_weights\(\)', re.S)
          build_replacement = r'''_luoshu_config_build_weight_stage() {
              _lcwbs_stage="$1"
              _lcwbs_family="${2:-}"
              _lcwbs_hint="${3:-}"
              rm -rf "$_lcwbs_stage" 2>/dev/null || true
              mkdir -p "$_lcwbs_stage" 2>/dev/null || return 1
              for _lcwbs_weight in 100 200 300 400 500 600 700 800 900; do
                  _lcwbs_source="$(_luoshu_config_weight_source "$_lcwbs_weight" "$_lcwbs_family" "$_lcwbs_hint")" || {
                      rm -rf "$_lcwbs_stage" 2>/dev/null || true
                      return 1
                  }
                  _lcwbs_target="$_lcwbs_stage/LuoShu-${_lcwbs_weight}.ttf"
                  _luoshu_config_normalize_weight "$_lcwbs_source" "$_lcwbs_target" "$_lcwbs_weight" || {
                      rm -rf "$_lcwbs_stage" 2>/dev/null || true
                      return 1
                  }
              done

              # Monospace only needs one normalized outline. Android selects the declared XML weight;
              # the eight aliases can safely share the 400 file, matching the existing finalizer.
              _lcwbs_mono400="$_lcwbs_stage/LuoShuMono-400.ttf"
              _luoshu_config_make_mono_weight "$_lcwbs_stage/LuoShu-400.ttf" "$_lcwbs_mono400" 400 || {
                  rm -rf "$_lcwbs_stage" 2>/dev/null || true
                  return 1
              }
              for _lcwbs_weight in 100 200 300 500 600 700 800 900; do
                  _luoshu_config_link_font "$_lcwbs_mono400" "$_lcwbs_stage/LuoShuMono-${_lcwbs_weight}.ttf" || {
                      rm -rf "$_lcwbs_stage" 2>/dev/null || true
                      return 1
                  }
              done
              return 0
          }

          font_config_prewarm_payload_weights()'''
          text, count = build_pattern.subn(build_replacement, text, count=1)
          assert count == 1, 'build stage block not found'
          path.write_text(text)

          imp = root / 'common/font_import.sh'
          s = imp.read_text()
          runtime_marker = '# Import is the right place to pay the expensive FontTools cost.'
          assert runtime_marker in s, 'font import prewarm block missing'
          source_line = '[ -f "${MODULE_DIR:-/data/adb/modules/LuoShu}/common/font_config_runtime.sh" ] && \\\n    . "${MODULE_DIR:-/data/adb/modules/LuoShu}/common/font_config_runtime.sh"'
          rom_line = '[ -f "${MODULE_DIR:-/data/adb/modules/LuoShu}/common/rom_adapters.sh" ] && \\\n    . "${MODULE_DIR:-/data/adb/modules/LuoShu}/common/rom_adapters.sh"\n'
          assert source_line in s, 'font import runtime source line missing'
          s = s.replace(source_line, rom_line + source_line, 1)
          imp.write_text(s)

          native = root / 'common/native_import.sh'
          n = native.read_text()
          duplicate_marker = '''        _family=$(detect_font_family "$(basename "$_duplicate")")\n        printf '{"status":"ok","data":{"kind":"font","id":"%s","name":"%s","format":"%s","duplicate":true,"message":"字体已存在，未重复导入"}}\\n' \\\n'''
          duplicate_insert = '''        _family=$(detect_font_family "$(basename "$_duplicate")")\n        if type font_config_prewarm_payload_weights >/dev/null 2>&1; then\n            font_config_prewarm_payload_weights "$_family" "$_duplicate" >/dev/null 2>&1 || true\n        fi\n        printf '{"status":"ok","data":{"kind":"font","id":"%s","name":"%s","format":"%s","duplicate":true,"message":"字体已存在，未重复导入"}}\\n' \\\n'''
          assert duplicate_marker in n, 'duplicate import marker missing'
          n = n.replace(duplicate_marker, duplicate_insert, 1)
          new_marker = '''    } > "$USER_FONTS_DIR/${_family}.conf" 2>/dev/null || true\n    printf '{"status":"ok","data":{"kind":"font","id":"%s","name":"%s","format":"%s","supportsCjk":%s,"duplicate":false,"message":"字体已导入"}}\\n' \\\n'''
          new_insert = '''    } > "$USER_FONTS_DIR/${_family}.conf" 2>/dev/null || true\n    if type font_config_prewarm_payload_weights >/dev/null 2>&1; then\n        font_config_prewarm_payload_weights "$_family" "$_target" >/dev/null 2>&1 || true\n    fi\n    printf '{"status":"ok","data":{"kind":"font","id":"%s","name":"%s","format":"%s","supportsCjk":%s,"duplicate":false,"message":"字体已导入"}}\\n' \\\n'''
          assert new_marker in n, 'new import marker missing'
          native.write_text(n.replace(new_marker, new_insert, 1))

          test = root / 'scripts/font_payload_cache_test.sh'
          t = test.read_text()
          marker = '''font_config_prewarm_payload_weights Demo "$SRC"\nCACHE=$(_luoshu_config_weight_cache_dir "$KEY1")\n_luoshu_config_weight_cache_valid "$CACHE"\n'''
          addition = marker + '''\n# Mono aliases share one cached inode instead of serializing the same outlines nine times.\nMONO_INODE=$(stat -c '%i' "$CACHE/LuoShuMono-400.ttf")\nfor weight in 100 200 300 500 600 700 800 900; do\n    test "$(stat -c '%i' "$CACHE/LuoShuMono-${weight}.ttf")" = "$MONO_INODE"\ndone\n'''
          assert marker in t, 'cache test prewarm marker missing'
          t = t.replace(marker, addition, 1)
          test.write_text(t)
          PY

      - name: Run focused regression tests
        shell: bash
        run: |
          set -euo pipefail
          sh -n common/font_config_weights.sh
          sh -n common/font_import.sh
          sh -n common/native_import.sh
          sh scripts/font_config_weights_test.sh
          sh scripts/font_payload_cache_test.sh
          sh scripts/font_switch_performance_test.sh
          sh scripts/weight_prepare_batch_test.sh
          sh scripts/font_import_compat_test.sh
          if [ -d common/python/lib/python3.14/site-packages/fontTools ]; then
            sh scripts/native_zip_import_test.sh
          fi

      - name: Commit review fixes
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/review-prebuilt-font-cache.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'perf: harden prebuilt font cache fast path'
          git push origin HEAD:perf/prebuilt-font-payload-cache
