name: Apply v2.5 Beta 1 overlay once

on:
  push:
    branches:
      - feat/safety-update-presets
    paths:
      - scripts/apply_v25_beta1.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/safety-update-presets
          fetch-depth: 0

      - name: Apply prepared overlay
        run: python3 scripts/apply_v25_beta1.py "$GITHUB_WORKSPACE"

      - name: Validate backend additions
        run: |
          bash scripts/switch_history_test.sh
          bash scripts/full_backup_root_test.sh
          python3 -m py_compile common/font_coverage_info.py
          bash -n system/bin/luoshu-history
          bash -n system/bin/luoshu-backup

      - name: Remove bootstrap helpers
        run: |
          rm -f .github/workflows/v2.5-beta1-apply-once.yml
          rm -f scripts/apply_v25_beta1.py
          rm -f V2.5.0_BETA1_IMPLEMENTATION.md

      - name: Commit final v2.5 Beta 1 changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            android-app/app/src/main/java/io/github/xgl34222220/luoshu/ui/settings/SystemCenterViewModel.kt \
            android-app/app/src/main/java/io/github/xgl34222220/luoshu/ui/settings/SettingsHubScreen.kt \
            android-app/app/src/main/java/io/github/xgl34222220/luoshu/ui/settings/FullBackupManager.kt \
            android-app/app/src/main/java/io/github/xgl34222220/luoshu/ui/studio/StudioPresetStore.kt \
            android-app/app/src/main/java/io/github/xgl34222220/luoshu/ui/studio/FontStudioRoute.kt \
            android-app/app/src/main/java/io/github/xgl34222220/luoshu/ui/studio/StudioToolLauncher.kt \
            android-app/app/src/main/java/io/github/xgl34222220/luoshu/ui/studio/StudioGlyphBrowser.kt \
            android-app/app/src/main/java/io/github/xgl34222220/luoshu/ui/studio/StudioCompositePreviewCompact.kt \
            android-app/app/src/main/java/io/github/xgl34222220/luoshu/ui/studio/SwitchHistoryDialog.kt \
            android-app/app/src/main/java/io/github/xgl34222220/luoshu/ui/studio/CoverageMapPanel.kt \
            android-app/app/src/main/java/io/github/xgl34222220/luoshu/Alpha15FeatureViewModel.kt \
            common/font_switch_task.sh \
            common/font_coverage_info.py \
            system/bin/luoshu-history \
            system/bin/luoshu-backup \
            scripts/switch_history_test.sh \
            scripts/full_backup_root_test.sh \
            .github/workflows/v2.5-beta1-feature-checks.yml \
            .github/workflows/v2.5-beta1-apply-once.yml \
            scripts/apply_v25_beta1.py \
            V2.5.0_BETA1_IMPLEMENTATION.md
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "feat: add v2.5 beta1 backup history preview and coverage"
          git push origin HEAD:feat/safety-update-presets
