name: Global font LSPosed module (built into App)
# The LSPosed global-font module ships inside the main LuoShu App (android-app/global-font-hook,
# a library the App depends on). No standalone companion APK is built or published any more;
# this workflow verifies the module inside the App APK.
on:
  pull_request:
    branches: [main]
    paths:
      - android-app/**
      - docs/GLOBAL_FONT_HOOK.md
      - common/font_import.sh
      - common/font_inventory.py
      - module.prop
      - .github/workflows/global-font-hook.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  module:
    name: Module inside the App
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: ''
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Module unit tests, benchmark and App APK
        working-directory: android-app
        shell: bash
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/global-font-gradle.log"
          if ! gradle --no-daemon --stacktrace :global-font-hook:testDebugUnitTest :app:assembleDebug >"$log" 2>&1; then
            grep -nE '(error:|^e: |FAILURE:|What went wrong|Execution failed for task|Could not resolve|FAILED)' "$log" >&2 || true
            tail -n 150 "$log" >&2
            exit 1
          fi
          tail -n 20 "$log"
          echo '--- overhead benchmark (JVM, ns/op) ---'
          cat global-font-hook/build/reports/global-font-benchmark.txt

      - name: App APK carries the LSPosed module
        shell: bash
        run: |
          set -euo pipefail
          apk='android-app/app/build/outputs/apk/debug/app-debug.apk'
          test -s "$apk"
          # Entry point LSPosed loads by name.
          unzip -p "$apk" assets/xposed_init | grep -qx 'io.github.xgl34222220.luoshu.globalfont.HookEntry'
          # Hook classes survive R8 under their real names (xposed_init + self status hook).
          dex="$RUNNER_TEMP/app-dex.bin"
          unzip -p "$apk" 'classes*.dex' > "$dex"
          for cls in HookEntry FontHooks WebFontHooks Deopt ModuleStatus ModuleConfig SettingsActivity; do
            grep -aq "Lio/github/xgl34222220/luoshu/globalfont/$cls;" "$dex" || { echo "missing class $cls in App dex" >&2; exit 1; }
          done
          grep -aq 'isModuleActive' "$dex"
          grep -aq 'luoshu.gfh.active' "$dex"
          # Xposed metadata in the merged App manifest; still a single launcher activity.
          aapt2="$(find "$ANDROID_HOME/build-tools" -name aapt2 -type f | sort -V | tail -n1)"
          test -x "$aapt2"
          manifest="$RUNNER_TEMP/app-manifest.txt"
          "$aapt2" dump xmltree --file AndroidManifest.xml "$apk" > "$manifest"
          for key in xposedmodule xposeddescription xposedminversion xposedsharedprefs xposedscope; do
            grep -q "\"$key\"" "$manifest" || { echo "missing meta-data $key" >&2; exit 1; }
          done
          grep -q 'de.robv.android.xposed.category.MODULE_SETTINGS' "$manifest"
          test "$(grep -c 'android.intent.category.LAUNCHER' "$manifest")" = 1
          "$aapt2" dump packagename "$apk" | grep -qx 'io.github.xgl34222220.luoshu.debug'
          ls -l "$apk"
          {
            echo "### 洛书全局字体（LSPosed，内置于主 App）"
            echo "App APK: $(stat -c %s "$apk") 字节"
            echo '```'
            cat android-app/global-font-hook/build/reports/global-font-benchmark.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: No standalone companion build remains
        shell: bash
        run: |
          set -euo pipefail
          test ! -e global-font-hook
          ! grep -n 'global-font-hook' scripts/module_payload_manifest.txt scripts/build.sh
          ! grep -rn 'LuoShu-GlobalFont' .github/workflows --include='*.yml' | grep -v 'global-font-hook.yml'

      - uses: actions/upload-artifact@v4
        with:
          name: LuoShu-GlobalFont-Benchmark
          path: android-app/global-font-hook/build/reports/global-font-benchmark.txt
          if-no-files-found: error
          retention-days: 14

  # Instrumented coverage checks (no LSPosed on the emulator): every hook target exists on the API
  # level, res/font / ResourcesCompat (Compose Font(R.font.x)) / assets / Typeface.Builder /
  # descriptor sources load, and the naming + sfnt + family verdicts hold for real font files.
  instrumented:
    name: Instrumented coverage API ${{ matrix.api }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        api: [28, 29, 34, 35]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: ''
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Build module test APK
        working-directory: android-app
        shell: bash
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/global-font-androidtest-build.log"
          if ! gradle --no-daemon --stacktrace :global-font-hook:assembleDebugAndroidTest >"$log" 2>&1; then
            grep -nE '(error:|FAILURE:|What went wrong|Execution failed for task|Could not resolve|FAILED)' "$log" >&2 || true
            tail -n 150 "$log" >&2
            exit 1
          fi
          tail -n 5 "$log"
      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo udevadm settle --timeout=15
          for attempt in 1 2 3 4 5; do
            if test -r /dev/kvm && test -w /dev/kvm; then break; fi
            sleep 1
          done
          ls -l /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm
      - name: Run instrumented coverage tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          ram-size: 3072M
          emulator-boot-timeout: 600
          disable-animations: true
          emulator-options: -no-window -gpu software -no-snapshot -noaudio -no-boot-anim -camera-back none
          # Hidden-API reflection is only used to assert the Android 9 FontFamily surface exists.
          script: |
            adb shell settings put global hidden_api_policy_pre_p_apps 1 || true
            adb shell settings put global hidden_api_policy_p_apps 1 || true
            adb shell settings put global hidden_api_policy 1 || true
            cd android-app && gradle --no-daemon :global-font-hook:connectedDebugAndroidTest
      - name: Upload instrumented test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LuoShu-GlobalFont-Instrumented-API-${{ matrix.api }}
          path: |
            android-app/global-font-hook/build/reports/androidTests/
            android-app/global-font-hook/build/outputs/androidTest-results/
          if-no-files-found: warn
          retention-days: 14
