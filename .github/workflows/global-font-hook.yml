name: Global font hook companion
on:
  pull_request:
    branches: [main]
    paths:
      - global-font-hook/**
      - docs/GLOBAL_FONT_HOOK.md
      - common/font_import.sh
      - common/font_inventory.py
      - module.prop
      - .github/workflows/global-font-hook.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  companion:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: ''
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      # Sign with the production identity only outside pull requests (secrets are not
      # exposed to PR builds); PR builds are debug-key signed test packages.
      - name: Prepare signing
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.LUOSHU_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [[ -n "$KEYSTORE_BASE64" ]]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/luoshu-globalfont.jks"
            chmod 0600 "$RUNNER_TEMP/luoshu-globalfont.jks"
            echo "LUOSHU_KEYSTORE_FILE=$RUNNER_TEMP/luoshu-globalfont.jks" >> "$GITHUB_ENV"
          fi

      - name: Unit tests, benchmark and APK
        working-directory: global-font-hook
        shell: bash
        env:
          LUOSHU_KEYSTORE_PASSWORD: ${{ secrets.LUOSHU_KEYSTORE_PASSWORD }}
          LUOSHU_KEY_ALIAS: ${{ secrets.LUOSHU_KEY_ALIAS }}
          LUOSHU_KEY_PASSWORD: ${{ secrets.LUOSHU_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/global-font-gradle.log"
          if ! gradle --no-daemon --stacktrace :app:testDebugUnitTest :app:assembleRelease >"$log" 2>&1; then
            grep -nE '(error:|FAILURE:|What went wrong|Execution failed for task|Could not resolve|FAILED)' "$log" >&2 || true
            tail -n 150 "$log" >&2
            exit 1
          fi
          tail -n 20 "$log"
          echo '--- overhead benchmark (JVM, ns/op) ---'
          cat app/build/reports/global-font-benchmark.txt
          apk="$(find app/build/outputs/apk/release -name '*.apk' -print -quit)"
          test -n "$apk"
          mkdir -p "$RUNNER_TEMP/out"
          cp "$apk" "$RUNNER_TEMP/out/LuoShu-GlobalFont.apk"
          cp app/build/reports/global-font-benchmark.txt "$RUNNER_TEMP/out/"
          unzip -l "$apk" | grep -E 'assets/xposed_init' 
          unzip -p "$apk" assets/xposed_init | grep -qx 'io.github.xgl34222220.luoshu.globalfont.HookEntry'
          ls -l "$RUNNER_TEMP/out"
          echo "### 洛书全局字体伴随模块" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat app/build/reports/global-font-benchmark.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Main module ZIP stays untouched
        shell: bash
        run: |
          set -euo pipefail
          ! grep -n 'global-font-hook' scripts/module_payload_manifest.txt scripts/build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: LuoShu-GlobalFont-Companion
          path: ${{ runner.temp }}/out/*
          if-no-files-found: error
          retention-days: 14

  # Instrumented coverage checks (no LSPosed on the emulator): every hook target exists on the API
  # level, res/font / ResourcesCompat (Compose Font(R.font.x)) / assets / Typeface.Builder /
  # descriptor sources load, and the naming + sfnt + family verdicts hold for real font files.
  instrumented:
    name: Instrumented coverage API ${{ matrix.api }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        api: [28, 29, 34, 35]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: ''
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Build app and test APKs
        working-directory: global-font-hook
        shell: bash
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/global-font-androidtest-build.log"
          if ! gradle --no-daemon --stacktrace :app:assembleDebug :app:assembleDebugAndroidTest >"$log" 2>&1; then
            grep -nE '(error:|FAILURE:|What went wrong|Execution failed for task|Could not resolve|FAILED)' "$log" >&2 || true
            tail -n 150 "$log" >&2
            exit 1
          fi
          tail -n 5 "$log"
      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo udevadm settle --timeout=15
          for attempt in 1 2 3 4 5; do
            if test -r /dev/kvm && test -w /dev/kvm; then break; fi
            sleep 1
          done
          ls -l /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm
      - name: Run instrumented coverage tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          ram-size: 3072M
          emulator-boot-timeout: 600
          disable-animations: true
          emulator-options: -no-window -gpu software -no-snapshot -noaudio -no-boot-anim -camera-back none
          # Hidden-API reflection is only used to assert the Android 9 FontFamily surface exists.
          script: |
            adb shell settings put global hidden_api_policy_pre_p_apps 1 || true
            adb shell settings put global hidden_api_policy_p_apps 1 || true
            adb shell settings put global hidden_api_policy 1 || true
            cd global-font-hook && gradle --no-daemon :app:connectedDebugAndroidTest
      - name: Upload instrumented test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LuoShu-GlobalFont-Instrumented-API-${{ matrix.api }}
          path: |
            global-font-hook/app/build/reports/androidTests/
            global-font-hook/app/build/outputs/androidTest-results/
          if-no-files-found: warn
          retention-days: 14
