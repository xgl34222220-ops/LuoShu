name: Apply liquid glass dock patch

on:
  push:
    branches:
      - agent/ui-interaction-v226
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ui-interaction-v226
          fetch-depth: 0
      - name: Apply patch
        run: python3 scripts/apply_liquid_glass_patch.py
      - name: Validate focused UI checks
        run: |
          sh -n scripts/font_library_ui_layout_test.sh
          sh scripts/font_library_ui_layout_test.sh
      - name: Remove one-time patch files
        run: |
          rm -f scripts/apply_liquid_glass_patch.py
          rm -f .github/workflows/apply-liquid-glass-patch.yml
      - name: Commit result
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add android-app/app/src/main/java/io/github/xgl34222220/luoshu/LuoShuAppShell.kt \
            android-app/app/src/main/java/io/github/xgl34222220/luoshu/ui/settings/AppearanceSettingsScreen.kt \
            scripts/font_library_ui_layout_test.sh \
            scripts/apply_liquid_glass_patch.py \
            .github/workflows/apply-liquid-glass-patch.yml
          git commit -m "fix(ui): render MIUIx liquid glass dock"
          git push origin HEAD:agent/ui-interaction-v226
