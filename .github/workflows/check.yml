name: Apply reviewed background CPU hardening

on:
  push:
    branches:
      - agent/bg-cpu-hardening

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply patch, safety fixups and focused regressions
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          base64 -d .github/patches/luoshu-complete-5.diff.gz.b64 | gzip -dc > /tmp/luoshu-5.diff
          git apply --check /tmp/luoshu-5.diff
          git apply /tmp/luoshu-5.diff
          python3 .github/patches/luoshu-complete-5-fixup.py

          sh -n common/device_font_cache.sh common/device_font_dynamic_guard.sh common/google_font_provider_bridge.sh
          sh scripts/device_font_cache_budget_test.sh
          sh scripts/provider_pid_scan_test.sh
          sh scripts/google_font_provider_mount_test.sh

          rm -f .github/patches/luoshu-complete-5.diff.gz.b64
          rm -f .github/patches/luoshu-complete-5-fixup.py
          git checkout origin/main -- .github/workflows/check.yml

          git add -A
          git diff --cached --check
          git commit -m 'perf: bound background cache retries and provider PID scans'
          git push origin HEAD:agent/bg-cpu-hardening
