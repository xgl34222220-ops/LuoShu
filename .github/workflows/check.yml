name: Validate App-only source

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/check.yml
      - .github/workflows/apply-test-hardening.yml
      - .github/patches/**
      - scripts/**
      - common/**

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/test-infrastructure-hardening

      - name: Apply remaining uploaded hardening patches
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main

          cat .github/patches/p1small*.b64 > /tmp/remaining-1.diff.gz.b64
          base64 -d /tmp/remaining-1.diff.gz.b64 > /tmp/remaining-1.diff.gz
          gunzip -t /tmp/remaining-1.diff.gz
          gunzip -c /tmp/remaining-1.diff.gz > /tmp/remaining-1.diff
          echo "patch1-bytes=$(wc -c < /tmp/remaining-1.diff)"

          gunzip -t .github/patches/remaining-2.diff.gz
          gunzip -c .github/patches/remaining-2.diff.gz > /tmp/remaining-2.diff
          echo "patch2-bytes=$(wc -c < /tmp/remaining-2.diff)"

          if git apply --check /tmp/remaining-1.diff; then
            git apply /tmp/remaining-1.diff
          else
            git apply --3way /tmp/remaining-1.diff
          fi

          if git apply --check /tmp/remaining-2.diff; then
            git apply /tmp/remaining-2.diff
          else
            git apply --3way /tmp/remaining-2.diff
          fi

          rm -rf .github/patches
          rm -f .github/workflows/apply-test-hardening.yml
          git show origin/main:.github/workflows/check.yml > .github/workflows/check.yml

          git config user.name 'LuoShu CI'
          git config user.email 'dev@luoshu.local'
          git add -A
          git diff --cached --check
          git commit -m 'test: harden shell assertions and coverage'
          git push origin HEAD:agent/test-infrastructure-hardening
