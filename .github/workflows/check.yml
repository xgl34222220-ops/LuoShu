name: Validate App-only source

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/check.yml
      - .github/workflows/apply-test-hardening.yml
      - .github/patches/**
      - scripts/**
      - common/**

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/test-infrastructure-hardening

      - name: Apply remaining uploaded hardening patches
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main

          : > /tmp/remaining-2.diff
          for f in .github/patches/p2part*.b64; do
            base64 -d "$f" >> /tmp/remaining-2.diff
          done
          test "$(wc -c < /tmp/remaining-2.diff | tr -d ' ')" -eq 47051

          if git apply --check .github/patches/remaining-1.diff; then
            git apply .github/patches/remaining-1.diff
          else
            git apply --3way .github/patches/remaining-1.diff
          fi

          if git apply --check /tmp/remaining-2.diff; then
            git apply /tmp/remaining-2.diff
          else
            git apply --3way /tmp/remaining-2.diff
          fi

          rm -rf .github/patches
          rm -f .github/workflows/apply-test-hardening.yml
          git show origin/main:.github/workflows/check.yml > .github/workflows/check.yml

          git config user.name 'LuoShu CI'
          git config user.email 'dev@luoshu.local'
          git add -A
          git diff --cached --check
          git commit -m 'test: harden shell assertions and coverage'
          git push origin HEAD:agent/test-infrastructure-hardening
