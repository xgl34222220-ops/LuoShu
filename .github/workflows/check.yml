name: Apply reviewed performance patch

on:
  push:
    branches:
      - agent/perf-batch-font-config

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply reviewed patch and regression tests
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          base64 -d .perf4.patch.gz.b64 | gzip -dc > /tmp/perf4.patch
          base64 -d .perf-followup.patch.gz.b64 | gzip -dc > /tmp/followup.patch

          git apply --check /tmp/perf4.patch
          git apply /tmp/perf4.patch
          git apply --check /tmp/followup.patch
          git apply /tmp/followup.patch

          sh -n common/font_config_runtime.sh common/font_finalize_hotfix.sh common/font_safety.sh common/rom_adapters.sh scripts/generic_xml_partial_coverage_test.sh scripts/font_digest_memo_test.sh
          python3 -m py_compile common/font_config_overlay.py common/font_config_targets.py scripts/font_config_batch_test.py
          python3 scripts/font_config_batch_test.py
          sh scripts/font_digest_memo_test.sh

          rm -f .perf4.patch.gz.b64 .perf-followup.patch.gz.b64
          git checkout origin/main -- .github/workflows/check.yml
          git add -A
          git diff --cached --check
          git commit -m 'perf: batch font config work and memoize source digests'
          git push origin HEAD:agent/perf-batch-font-config
