name: Review preserved Root artifact
on:
  workflow_dispatch:
  push:
    branches: [fix/stable-composite-contract-20261003]
    paths:
      - .github/workflows/reviewed-root-artifact.yml
      - .github/reviewed-root-artifact.json
      - tests/reviewed-artifacts/review_ci.py
permissions:
  contents: read
  actions: read
jobs:
  review:
    name: Read-only archive review, not Android execution
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Independently verify pinned original archives and verdict
        env:
          REVIEW_TOKEN: ${{ github.token }}
        run: python3 tests/reviewed-artifacts/review_ci.py .github/reviewed-root-artifact.json artifact-review-output
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Reviewed-Root-Artifact
          path: artifact-review-output/
          if-no-files-found: error
          retention-days: 14
