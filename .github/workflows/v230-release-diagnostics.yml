name: v2.3.0 release diagnostics

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Collect workflow and test sources
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/diagnostics"
          cp -R .github/workflows "$RUNNER_TEMP/diagnostics/"
          cp -R scripts "$RUNNER_TEMP/diagnostics/"
          cp -R common "$RUNNER_TEMP/diagnostics/"
          cp -f customize.sh post-fs-data.sh post-mount.sh service.sh uninstall.sh module.prop "$RUNNER_TEMP/diagnostics/"
      - name: Upload diagnostic source bundle
        uses: actions/upload-artifact@v4
        with:
          name: LuoShu-v2.3.0-release-diagnostics
          path: ${{ runner.temp }}/diagnostics
          if-no-files-found: error
          retention-days: 1
