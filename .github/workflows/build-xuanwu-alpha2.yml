name: Build Xuanwu Tombstone Alpha2

on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/xuanwu-alpha2/**'
      - '.github/workflows/build-xuanwu-alpha2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Restore fixed signing key
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.LUOSHU_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.LUOSHU_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.LUOSHU_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.LUOSHU_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for value in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            [[ -n "${!value}" ]] || { echo "Missing signing secret: $value" >&2; exit 3; }
          done
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/xuanwu-release.jks"
          keytool -list -keystore "$RUNNER_TEMP/xuanwu-release.jks" \
            -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null

      - name: Unpack source
        working-directory: tools/xuanwu-alpha2
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build-src
          mkdir -p build-src
          base64 -d source.tar.gz.b64 | tar -xz -C build-src

      - name: Build signed release APK
        working-directory: tools/xuanwu-alpha2/build-src
        env:
          LUOSHU_KEYSTORE_FILE: ${{ runner.temp }}/xuanwu-release.jks
          LUOSHU_KEYSTORE_PASSWORD: ${{ secrets.LUOSHU_KEYSTORE_PASSWORD }}
          LUOSHU_KEY_ALIAS: ${{ secrets.LUOSHU_KEY_ALIAS }}
          LUOSHU_KEY_PASSWORD: ${{ secrets.LUOSHU_KEY_PASSWORD }}
        run: gradle --no-daemon --stacktrace :app:assembleRelease

      - name: Verify package and signature
        shell: bash
        run: |
          set -euo pipefail
          apk='tools/xuanwu-alpha2/build-src/app/build/outputs/apk/release/app-release.apk'
          test -s "$apk"
          size="$(stat -c %s "$apk")"
          [[ "$size" -ge 500000 ]] || { echo "APK unexpectedly small: $size" >&2; exit 4; }
          [[ "$size" -le 25000000 ]] || { echo "APK unexpectedly large: $size" >&2; exit 4; }
          apksigner="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          aapt="$ANDROID_HOME/build-tools/35.0.0/aapt"
          "$apksigner" verify --verbose --print-certs "$apk" | tee "$RUNNER_TEMP/signature.txt"
          grep -Eq '^Verified using v2 scheme.*: true$' "$RUNNER_TEMP/signature.txt"
          grep -Eq '^Verified using v3 scheme.*: true$' "$RUNNER_TEMP/signature.txt"
          "$aapt" dump badging "$apk" | tee "$RUNNER_TEMP/badging.txt"
          grep -q "package: name='com.xuanwu.tombstone' versionCode='2'" "$RUNNER_TEMP/badging.txt"
          grep -q "application-label:'玄武墓碑'" "$RUNNER_TEMP/badging.txt"
          mkdir -p tools/xuanwu-alpha2/build-src/dist
          cp -f "$apk" tools/xuanwu-alpha2/build-src/dist/Xuanwu-Tombstone-Alpha2.apk
          sha256sum tools/xuanwu-alpha2/build-src/dist/Xuanwu-Tombstone-Alpha2.apk | tee tools/xuanwu-alpha2/build-src/dist/Xuanwu-Tombstone-Alpha2.apk.sha256
          {
            echo "APK_BYTES=$size"
            cat "$RUNNER_TEMP/signature.txt"
            echo
            head -n 8 "$RUNNER_TEMP/badging.txt"
          } > tools/xuanwu-alpha2/build-src/dist/build-report.txt

      - uses: actions/upload-artifact@v4
        with:
          name: xuanwu-alpha2-signed
          path: tools/xuanwu-alpha2/build-src/dist/*
          if-no-files-found: error
          retention-days: 7
