name: Pre-release Readiness
on:
  workflow_dispatch:
    inputs:
      target:
        description: Target release line
        required: false
        default: ''
        type: string
      enforce:
        description: Fail when blockers remain
        required: true
        default: true
        type: boolean
      stable:
        description: Enforce the minimum real-device matrix for a stable release
        required: true
        default: false
        type: boolean
  pull_request:
    branches:
      - main
    paths:
      - module.prop
      - config/version_notes.conf
      - common/**
      - scripts/**
      - android-app/**
      - docs/device_validation.json
      - .github/workflows/pre-release-readiness.yml
permissions:
  contents: read
jobs:
  report:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Generate readiness report
        shell: bash
        run: |
          set -euo pipefail
          target='${{ inputs.target }}'
          args=()
          [ -z "$target" ] || args+=(--target "$target")
          if [ '${{ inputs.enforce }}' != 'false' ]; then
            args+=(--enforce)
          fi
          if [ '${{ inputs.stable }}' == 'true' ]; then
            args+=(--stable)
          fi
          sh ./scripts/pre_release_readiness.sh "${args[@]}"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: LuoShu-Pre-release-Readiness
          path: dist/pre-release-readiness/*
          if-no-files-found: error
          retention-days: 30
