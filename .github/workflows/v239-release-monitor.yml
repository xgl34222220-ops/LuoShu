name: Verify LuoShu v2.3.9 formal release once

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
    paths:
      - .github/release-v239-monitor-trigger

permissions:
  contents: read
  actions: read

jobs:
  verify-release:
    if: github.head_ref == 'ops/v2.3.9-release-monitor'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Wait for signed release workflow and verify publication
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TRIGGER_SHA: aeeb22c97b19df87f46d39d282adbc7eaaf617ad
          TAG: v2.3.9
        shell: bash
        run: |
          set -euo pipefail

          find_run() {
            gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/release.yml/runs?event=push&branch=main&per_page=30" |
              jq -r --arg sha "$RELEASE_TRIGGER_SHA" \
                '[.workflow_runs[] | select(.head_sha == $sha)][0].id // empty'
          }

          run_id=''
          for _ in {1..30}; do
            run_id="$(find_run)"
            [[ -z "$run_id" ]] || break
            echo 'Waiting for the v2.3.9 release workflow run to appear...'
            sleep 10
          done
          [[ -n "$run_id" ]] || { echo 'Unable to locate v2.3.9 release workflow run' >&2; exit 2; }
          echo "release_run_id=$run_id" >> "$GITHUB_OUTPUT"

          for _ in {1..180}; do
            run_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}")"
            status="$(jq -r '.status' <<<"$run_json")"
            conclusion="$(jq -r '.conclusion // ""' <<<"$run_json")"
            echo "release_run=$run_id status=$status conclusion=${conclusion:-pending}"
            if [[ "$status" == completed ]]; then
              [[ "$conclusion" == success ]] || {
                echo "Signed release workflow failed: run=$run_id conclusion=$conclusion" >&2
                exit 3
              }
              break
            fi
            sleep 20
          done

          release_json="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json tagName,name,isDraft,isPrerelease,assets,url)"
          [[ "$(jq -r '.tagName' <<<"$release_json")" == "$TAG" ]]
          [[ "$(jq -r '.isDraft' <<<"$release_json")" == false ]]
          [[ "$(jq -r '.isPrerelease' <<<"$release_json")" == false ]]
          assets="$(jq -r '.assets[].name' <<<"$release_json")"
          for name in \
            LuoShu-v2.3.9.zip \
            LuoShu-v2.3.9.zip.sha256 \
            LuoShu-App-v2.3.9.apk \
            LuoShu-App-v2.3.9.apk.sha256; do
            grep -qx "$name" <<<"$assets" || { echo "Missing release asset: $name" >&2; exit 4; }
          done
          echo "release_url=$(jq -r '.url' <<<"$release_json")" >> "$GITHUB_OUTPUT"

      - name: Download and verify immutable release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v2.3.9
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p formal-release
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir formal-release \
            --pattern 'LuoShu-v2.3.9.zip' \
            --pattern 'LuoShu-v2.3.9.zip.sha256' \
            --pattern 'LuoShu-App-v2.3.9.apk' \
            --pattern 'LuoShu-App-v2.3.9.apk.sha256'
          (cd formal-release && sha256sum -c LuoShu-v2.3.9.zip.sha256)
          (cd formal-release && sha256sum -c LuoShu-App-v2.3.9.apk.sha256)
          unzip -t formal-release/LuoShu-v2.3.9.zip >/dev/null

      - name: Preserve formal release downloads
        uses: actions/upload-artifact@v4
        with:
          name: LuoShu-v2.3.9-formal-release
          path: formal-release/
          if-no-files-found: error
          retention-days: 14
