name: Build Xuanwu Tombstone App
on:
  push:
    branches:
      - tmp/xuanwu-tombstone-app-build
    paths:
      - 'tools/xuanwu-tombstone-app/**'
      - '.github/workflows/build-xuanwu-app.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'tools/xuanwu-tombstone-app/**'
      - '.github/workflows/build-xuanwu-app.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/xuanwu-tombstone-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Unpack source
        run: |
          rm -rf build-src
          mkdir -p build-src
          base64 -d source.tar.gz.b64 | tar -xz -C build-src
      - name: Build unsigned release APK
        working-directory: tools/xuanwu-tombstone-app/build-src
        run: gradle :app:assembleRelease --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: xuanwu-tombstone-unsigned
          path: tools/xuanwu-tombstone-app/build-src/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
