name: Build Xuanwu Tombstone App
on:
  push:
    branches:
      - tmp/xuanwu-tombstone-app-build
    paths:
      - 'tools/xuanwu-tombstone-app/**'
      - '.github/workflows/build-xuanwu-app.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'tools/xuanwu-tombstone-app/**'
      - '.github/workflows/build-xuanwu-app.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/xuanwu-tombstone-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Unpack source
        run: |
          rm -rf build-src
          mkdir -p build-src
          base64 -d source.tar.gz.b64 | tar -xz -C build-src
      - name: Build unsigned release APK
        working-directory: tools/xuanwu-tombstone-app/build-src
        run: |
          set +e
          gradle :app:assembleRelease --no-daemon --console=plain > build.log 2>&1
          code=$?
          echo "$code" > build.exit
          tail -n 220 build.log
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: xuanwu-build-output
          path: |
            tools/xuanwu-tombstone-app/build-src/build.log
            tools/xuanwu-tombstone-app/build-src/build.exit
            tools/xuanwu-tombstone-app/build-src/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: warn
      - name: Check build result
        working-directory: tools/xuanwu-tombstone-app/build-src
        run: test "$(cat build.exit)" = '0'
