name: Prepare v2.2.5 release

on:
  push:
    branches:
      - release/v2.2.5
    paths:
      - .github/workflows/prepare-v225-release.yml

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v2.2.5
          fetch-depth: 0

      - name: Prepare stable release metadata
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json

          root = Path('.')

          module = root / 'module.prop'
          text = module.read_text()
          text = text.replace('version=v2.2.4\n', 'version=v2.2.5\n', 1)
          text = text.replace('versionCode=20204\n', 'versionCode=20205\n', 1)
          if 'version=v2.2.5\n' not in text or 'versionCode=20205\n' not in text:
              raise SystemExit('module.prop version replacement failed')
          module.write_text(text)

          (root / 'config/version_notes.conf').write_text(
              'version=v2.2.5\n'
              'summary=强化元模块逐分区挂载验证并修复 MIUIx 页面遮挡与验收提示\n'
              'notes=v2.2.5 在 v2.2.4 基础上完善 meta-overlayfs、Hybrid Mount、Mountify 与 Magic Mount 兼容：只识别实际启用的挂载后端，按 system、vendor、product、system_ext、odm、oem 及设备声明分区原子同步负载，使用有界总超时并在失败时保留旧树；开机逐分区探针必须全部通过后才写入 verified + aligned，失败会记录具体后端与分区。MIUIx 重构四项液态玻璃底栏、组合页标题栏与内容安全区、紧凑字体库和任务/问题/日志分栏，移除悬浮覆盖与旧 v2.2.2 门禁硬编码。模块 versionCode 20205，App versionCode 2020501。\n'
          )

          update = {
              'version': 'v2.2.5',
              'versionCode': 20205,
              'zipUrl': 'https://github.com/xgl34222220-ops/LuoShu/releases/download/v2.2.5/LuoShu-v2.2.5.zip',
              'changelog': 'https://raw.githubusercontent.com/xgl34222220-ops/LuoShu/main/CHANGELOG.md',
          }
          (root / 'update.json').write_text(json.dumps(update, ensure_ascii=False, indent=2) + '\n')

          changelog = root / 'CHANGELOG.md'
          old = changelog.read_text()
          anchor = '## [Unreleased]\n\n- 暂无。\n\n'
          section = '''## [Unreleased]

- 暂无。

## [v2.2.5] - 2026-07-25

- 元模块识别不再依赖残留目录，同时检查模块元数据、禁用/移除标记和真实挂载证据，支持 meta-overlayfs、Hybrid Mount、Mountify 与 Magic Mount。
- 字体负载按实际使用分区原子同步，使用单次有界总超时；超时或复制失败时保留上一份有效树，不再进入无界 `cp` 回退。
- 开机验证改为逐分区探针，`system`、`vendor`、`product`、`system_ext`、`odm`、`oem` 及设备声明分区必须全部通过后才确认设备字体已加载。
- 验证状态记录挂载后端、已验证分区和失败分区；多个元模块同时启用时给出冲突警告，Magic Mount 配置更新增加锁、备份与唯一分区检查。
- MIUIx 使用四项液态玻璃底栏，设置入口移回首页；字体库、组合页和任务中心统一为紧凑内容结构。
- 组合工具与刷新按钮进入同一标题栏布局，页面内容视口结束于底栏上方，移除覆盖字体槽位和生成操作的悬浮控件。
- 任务中心拆分为任务、问题和日志；验收向导移除固定 `v2.2.2` 文案，跟随当前版本并提供明确的重新应用字体、完整重启和后台缓存提示。
- 正式版本为 `v2.2.5 / 20205`，正式 App `versionCode` 为 `2020501`。

'''
          if '## [v2.2.5]' not in old:
              if anchor not in old:
                  raise SystemExit('CHANGELOG Unreleased anchor not found')
              changelog.write_text(old.replace(anchor, section, 1))

          notes = '''# 洛书 v2.2.5

洛书 v2.2.5 是元模块兼容与 MIUIx 真机布局修复版本。它解决字体负载在 meta-overlayfs、Hybrid Mount、Mountify 或 Magic Mount 环境中同步不完整、开机验证只检查单一分区，以及组合页按钮和内容被悬浮底栏覆盖的问题。

## 元模块与开机验证

- 只把实际启用并具有真实证据的元模块视为当前挂载后端，忽略残留目录、`disable` 与 `remove` 状态。
- 支持 meta-overlayfs、Hybrid Mount、Mountify 与 Magic Mount，并记录 Hybrid Mount 的 overlayfs、magic-mount、kasumi 或未知后端。
- 按洛书真实负载动态处理 `system`、`vendor`、`product`、`system_ext`、`odm`、`oem`、`hw_product` 及设备声明的额外分区。
- 每个分区采用原子同步；整个同步过程默认使用 55 秒总超时，失败时保留上一份有效负载，不再执行可能无限等待的复制回退。
- 开机为每个实际负载分区生成独立探针，只有所有探针都可见且一致时才确认 `verified + aligned`。
- 验证报告会列出挂载后端、目标分区、已验证分区和失败分区；多个挂载元模块同时启用时显示冲突警告。
- Magic Mount 分区配置修改增加锁、备份、去重和写入后校验，降低配置损坏风险。

## MIUIx 与操作结构

- 底部导航收敛为首页、字体库、组合和任务四个主入口，设置从首页右上角进入，并在设置页隐藏底栏。
- MIUIx 底栏接入真实背景采样、36 dp 模糊、折射高光和透明 Monet 质感，修复选中项白色矩形底块。
- 组合工具与刷新按钮进入同一个标题栏 `Row`；移除覆盖字体槽位的导入按钮和覆盖内容的第二个固定生成按钮。
- 组合页与字体库的内容视口在布局层面结束于悬浮底栏上方，英文、数字字体卡和最终操作不再被遮挡。
- 字体库工具区默认折叠，字体卡更紧凑，整卡可打开详情。
- 任务中心拆分为“任务 / 问题 / 日志”，诊断与刷新按钮使用一致尺寸和对齐方式。
- 验收向导和测试矩阵不再硬编码 `v2.2.2`，自动跟随当前安装版本，并明确提示逐分区验证与后台对齐缓存的处理步骤。

## 安装与升级

1. 在 Magisk、KernelSU、SukiSU Ultra 或 APatch 中刷入 `LuoShu-v2.2.5.zip`。
2. 完整重启设备，并打开洛书授予 Root 权限。
3. 从旧版本升级后，请重新应用一次当前字体，等待任务结束，再完整重启一次，以生成新版逐分区挂载探针。
4. 进入真机验收向导点击“重新检测”；使用洛书字体时应显示逐分区开机加载验证结果。

模块 ZIP 内置同版本正式签名 App。独立的 `LuoShu-App-v2.2.5.apk` 可用于单独安装或覆盖升级，但仅安装 APK 不会更新元模块同步和开机探针逻辑。

## 版本信息

- 模块版本：`v2.2.5`
- 模块 versionCode：`20205`
- App versionCode：`2020501`
- 最低 Android：Android 9 / API 28
- 目标 Android：API 36

## 校验

Release 同时提供模块 ZIP、正式签名 APK 及各自的 SHA-256 文件。下载后可使用对应 `.sha256` 文件核验完整性。
'''
          (root / 'RELEASE_NOTES_v2.2.5.md').write_text(notes)

          workflow = root / '.github/workflows/prepare-v225-release.yml'
          workflow.unlink()
          PY

      - name: Commit release preparation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'release: prepare v2.2.5'
          git push origin HEAD:release/v2.2.5
