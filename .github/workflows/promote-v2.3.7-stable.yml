name: Finalize v2.3.7 stable metadata

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/promote-v2.3.7-stable.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Normalize stable release metadata
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_TAG: v2.3.7
          EXPECTED_RELEASE_ID: '362466603'
        run: |
          set -euo pipefail
          api="repos/${GITHUB_REPOSITORY}"
          release_json="$(gh api "${api}/releases/tags/${EXPECTED_TAG}")"
          [[ "$(jq -r '.id' <<<"$release_json")" == "$EXPECTED_RELEASE_ID" ]]
          [[ "$(jq -r '.draft' <<<"$release_json")" == 'false' ]]
          [[ "$(jq -r '.prerelease' <<<"$release_json")" == 'false' ]]

          body="$(jq -r '.body // ""' <<<"$release_json")"
          body="${body//<!-- prerelease -->/}"
          body="${body//v2.3.7 是可靠性预发行版。/v2.3.7 是可靠性正式版。}"
          body="${body//真机验收证据尚未全部完成，因此不得标记为稳定版。/真机验收证据尚未全部完成；本次按维护者明确授权强制提升为正式版。}"
          payload="$(jq -n --arg body "$body" \
            '{draft:false, prerelease:false, make_latest:"true", body:$body}')"

          finalized="$(gh api --method PATCH "${api}/releases/${EXPECTED_RELEASE_ID}" \
            --input - <<<"$payload")"
          [[ "$(jq -r '.prerelease' <<<"$finalized")" == 'false' ]]
          [[ "$(jq -r '.body' <<<"$finalized")" != *'<!-- prerelease -->'* ]]
          [[ "$(jq -r '.body' <<<"$finalized")" != *'不得标记为稳定版'* ]]
          latest="$(gh api "${api}/releases/latest")"
          [[ "$(jq -r '.tag_name' <<<"$latest")" == "$EXPECTED_TAG" ]]
          echo "Finalized ${EXPECTED_TAG} stable metadata."
