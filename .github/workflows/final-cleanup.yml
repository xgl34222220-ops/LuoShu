name: Final repository cleanup

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/final-cleanup.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove temporary branch and self-clean
        shell: bash
        run: |
          set -euo pipefail
          git push origin --delete ops/cleanup-temp 2>/dev/null || true
          rm -f .github/workflows/final-cleanup.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'ops: remove final cleanup workflow'
          git pull --rebase origin main
          git push origin HEAD:main
