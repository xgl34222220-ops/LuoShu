name: Apply latest reviewed patch

on:
  push:
    branches:
      - agent/latest-patch-hardening
    paths:
      - '.github/workflows/apply-latest-patch.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/latest-patch-hardening

      - name: Reconstruct and verify uploaded patch
        shell: bash
        run: |
          set -euo pipefail
          : > /tmp/latest.patch.gz.b64
          for part in \
            .tmp/latest-patch/gz00.b64 \
            .tmp/latest-patch/gz01.b64 \
            .tmp/latest-patch/gz02.b64 \
            .tmp/latest-patch/gz03.b64 \
            .tmp/latest-patch/gz04.b64
          do
            cat "$part" >> /tmp/latest.patch.gz.b64
          done
          base64 --decode /tmp/latest.patch.gz.b64 > /tmp/latest.patch.gz
          echo 'e714e8d87e8137c152eda5dbe26cc58d414ef346507d48f401ed5a5bb1e2a9bc  /tmp/latest.patch.gz' | sha256sum -c -
          gzip -dc /tmp/latest.patch.gz > /tmp/latest.patch
          echo 'd88a7b395020895396db609a1db659c2ab740dd36b7cff1ec6dd6eee53182ae6  /tmp/latest.patch' | sha256sum -c -

      - name: Apply three source commits
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'LuoShu CI'
          git config user.email 'actions@users.noreply.github.com'
          git am --3way /tmp/latest.patch

      - name: Basic syntax gates
        shell: bash
        run: |
          set -euo pipefail
          sh -n common/font_finalize_hotfix.sh
          sh -n scripts/check.sh
          sh -n scripts/weight_prepare_batch_test.sh
          python3 -m py_compile \
            common/font_instance.py \
            common/font_name_normalize.py \
            common/font_config_overlay.py \
            common/font_config_targets.py \
            common/font_inventory.py \
            common/device_font_payload_overlay.py \
            common/device_font_template_base.py \
            common/composite_font.py \
            scripts/font_config_overlay_test.py \
            scripts/font_inventory_scan_test.py \
            scripts/composite_validate_lazy_test.py

      - name: Remove staging material and publish branch
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .tmp/latest-patch .github/workflows/apply-latest-patch.yml
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'chore: remove patch staging material'
          fi
          git push origin HEAD:agent/latest-patch-hardening
