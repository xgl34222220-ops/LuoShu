name: Universal Font Runtime Verification regression

on:
  pull_request:
    paths:
      - common/universal_font_runtime_verify.py
      - common/universal_font_runtime_verify.sh
      - common/luoshu_payload.py
      - common/luoshu_verify.py
      - scripts/luoshu_verify_test.py
      - common/universal_mount_runtime.sh
      - common/app_bridge.sh
      - service.sh
      - scripts/universal_font_runtime_verify_test.py
      - scripts/module_payload_manifest.txt
      - docs/UNIVERSAL_FONT_ENGINE_REFACTOR.md
      - .github/workflows/font-runtime-verification-regression.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime-verification:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install font dependencies
        run: |
          python3 -m pip install --disable-pip-version-check 'fonttools==4.63.0'
      - name: Validate Phase 8 runtime verifier
        run: |
          set -eu
          python3 -m py_compile common/universal_font_runtime_verify.py common/luoshu_verify.py common/luoshu_payload.py \
            scripts/universal_font_runtime_verify_test.py scripts/luoshu_verify_test.py
          sh -n common/universal_font_runtime_verify.sh
          sh -n common/universal_mount_runtime.sh
          sh -n common/app_bridge.sh
          sh -n service.sh
          python3 scripts/universal_font_runtime_verify_test.py
          python3 scripts/luoshu_verify_test.py
          grep -qx 'common/universal_font_runtime_verify.py' scripts/module_payload_manifest.txt
          grep -qx 'common/universal_font_runtime_verify.sh' scripts/module_payload_manifest.txt
