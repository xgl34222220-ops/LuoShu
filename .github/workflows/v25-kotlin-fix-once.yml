name: Apply v2.5 Kotlin fixes once

on:
  push:
    branches:
      - feat/safety-update-presets
    paths:
      - .github/workflows/v25-kotlin-fix-once.yml

permissions:
  contents: write

jobs:
  fix-and-validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/safety-update-presets
          fetch-depth: 0

      - name: Apply Kotlin compile fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          backup = Path('android-app/app/src/main/java/io/github/xgl34222220/luoshu/ui/settings/FullBackupManager.kt')
          text = backup.read_text(encoding='utf-8')
          old = 'import androidx.compose.foundation.layout.weight\n'
          assert old in text, 'weight import not found'
          backup.write_text(text.replace(old, '', 1), encoding='utf-8')

          preview = Path('android-app/app/src/main/java/io/github/xgl34222220/luoshu/ui/studio/StudioCompositePreviewCompact.kt')
          text = preview.read_text(encoding='utf-8')
          old = 'MIXED("混排"), BODY("正文"), WECHAT("微信")'
          new = 'MIXED("混排"), BODY("正文"), INTERFACE("界面"), WECHAT("微信")'
          assert old in text, 'compact scenario enum anchor not found'
          preview.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Validate backend additions
        run: |
          python3 -m pip install --disable-pip-version-check 'fonttools>=4.50,<5'
          sh scripts/switch_history_test.sh
          sh scripts/full_backup_root_test.sh
          python3 -m py_compile common/font_coverage_info.py
          FONT=$(find /usr/share/fonts -type f -iname 'DejaVuSans.ttf' -print -quit 2>/dev/null || true)
          test -n "$FONT"
          python3 common/font_coverage_info.py "$FONT" >/tmp/coverage.json
          python3 - <<'PY'
          import json
          data=json.load(open('/tmp/coverage.json'))['data']
          assert 'groups' in data and 'recommendation' in data
          PY

      - name: Unit test, lint and assemble App
        working-directory: android-app
        run: gradle --no-daemon --stacktrace :app:testDebugUnitTest :app:lintDebug :app:assembleDebug

      - name: Remove one-time workflow and commit fixes
        run: |
          rm -f .github/workflows/v25-kotlin-fix-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            android-app/app/src/main/java/io/github/xgl34222220/luoshu/ui/settings/FullBackupManager.kt \
            android-app/app/src/main/java/io/github/xgl34222220/luoshu/ui/studio/StudioCompositePreviewCompact.kt \
            .github/workflows/v25-kotlin-fix-once.yml
          git commit -m "fix: resolve v2.5 beta1 Android compilation"
          git push origin HEAD:feat/safety-update-presets
