name: Harden latest patch

on:
  push:
    branches:
      - agent/latest-patch-hardening
    paths:
      - '.github/workflows/harden-latest-patch.yml'

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/latest-patch-hardening

      - name: Apply review hardening
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          # Batch helpers must propagate per-job failures to their process exit status while still
          # processing the remaining jobs.
          for rel, malformed in [
              ('common/font_instance.py', '            print("\\terror\\tmalformed job line")\n            continue'),
              ('common/font_name_normalize.py', '            print(f"\\terror\\tmalformed job line")\n            continue'),
          ]:
              path = Path(rel)
              text = path.read_text()
              marker = '    for raw in job_file.read_text(encoding="utf-8").splitlines():\n'
              assert marker in text, rel
              text = text.replace(marker, '    failed = False\n' + marker, 1)
              assert malformed in text, rel
              text = text.replace(malformed, malformed.replace('            continue', '            failed = True\n            continue'), 1)
              exc_marker = '            print(f"{output}\\terror\\t{message}")\n            continue'
              assert exc_marker in text, rel
              text = text.replace(exc_marker, '            print(f"{output}\\terror\\t{message}")\n            failed = True\n            continue', 1)
              assert '    return 0\n\n\ndef main()' in text, rel
              text = text.replace('    return 0\n\n\ndef main()', '    return 1 if failed else 0\n\n\ndef main()', 1)
              path.write_text(text)

          # If either batch stage fails, discard partial output and run the exact per-weight logic
          # that existed before batching. This preserves correctness when one font/weight is bad or
          # an embedded runtime is partially unavailable.
          path = Path('common/font_finalize_hotfix.sh')
          text = path.read_text()
          start = text.index('    if [ "$_lcw_variable" -eq 1 ]; then\n')
          end_marker = '    rm -f "$_lcw_var_jobs" "$_lcw_name_jobs" 2>/dev/null || true\n'
          end = text.index(end_marker, start)
          block = '''    if [ "$_lcw_variable" -eq 1 ]; then
              _lcw_instance="$_lcw_module/common/font_instance.py"
              _lcw_namer="$_lcw_module/common/font_name_normalize.py"
              _lcw_batch_ok=0
              if [ -f "$_lcw_instance" ] && [ -f "$_lcw_namer" ] && type _luoshu_font_config_exec >/dev/null 2>&1; then
                  if _luoshu_font_config_exec "$_lcw_instance" --batch "$_lcw_var_jobs" >/dev/null 2>&1; then
                      if _luoshu_font_config_exec "$_lcw_namer" --batch "$_lcw_name_jobs" >/dev/null 2>&1; then
                          _lcw_batch_ok=1
                      fi
                  fi
              fi

              if [ "$_lcw_batch_ok" -eq 1 ]; then
                  for _lcw_weight in 100 200 300 400 500 600 700 800 900; do
                      rm -f "$_lcw_stage/LuoShu-${_lcw_weight}.ttf.raw" 2>/dev/null || true
                  done
              else
                  # A batch can fail after producing some earlier jobs. Remove every partial output
                  # and replay the pre-batch per-weight path instead of leaving a half-built payload.
                  for _lcw_weight in 100 200 300 400 500 600 700 800 900; do
                      rm -f "$_lcw_stage/LuoShu-${_lcw_weight}.ttf" "$_lcw_stage/LuoShu-${_lcw_weight}.ttf.raw" 2>/dev/null || true
                  done
                  for _lcw_weight in 100 200 300 400 500 600 700 800 900; do
                      _lcw_source="$(_luoshu_config_weight_source "$_lcw_weight")" || { rm -rf "$_lcw_stage"; return 1; }
                      _lcw_target="$_lcw_stage/LuoShu-${_lcw_weight}.ttf"
                      if type is_variable_font >/dev/null 2>&1 && is_variable_font "$_lcw_source"; then
                          _luoshu_config_normalize_weight "$_lcw_source" "$_lcw_target" "$_lcw_weight" || {
                              rm -rf "$_lcw_stage"
                              return 1
                          }
                      else
                          _luoshu_fast_link_font "$_lcw_source" "$_lcw_target" || { rm -rf "$_lcw_stage"; return 1; }
                      fi
                  done
              fi

              for _lcw_weight in 100 200 300 400 500 600 700 800 900; do
                  _luoshu_fast_font_ok "$_lcw_stage/LuoShu-${_lcw_weight}.ttf" || { rm -rf "$_lcw_stage"; return 1; }
              done
          fi
          '''
          text = text[:start] + block + text[end:]
          path.write_text(text)

          # CI's system Python does not necessarily have fontTools. Match existing tests by using
          # the embedded runtime's site-packages when present, before importing composite_font.
          path = Path('scripts/composite_validate_lazy_test.py')
          text = path.read_text()
          old = '''ROOT = Path(__file__).resolve().parent.parent
          sys.path.insert(0, str(ROOT / "common"))

          import composite_font
          '''
          new = '''ROOT = Path(__file__).resolve().parent.parent
          EMBEDDED_FONTTOOLS = ROOT / "common/python/lib/python3.14/site-packages"
          if EMBEDDED_FONTTOOLS.is_dir():
              sys.path.insert(0, str(EMBEDDED_FONTTOOLS))
          sys.path.insert(0, str(ROOT / "common"))

          import composite_font
          '''
          assert old in text
          path.write_text(text.replace(old, new, 1))

          # Extend the batching regression with an injected batch failure. The operation must still
          # succeed through the old per-weight path and produce all nine UI weights.
          path = Path('scripts/weight_prepare_batch_test.sh')
          text = path.read_text()
          anchor = "CASE='语法'\n"
          assert anchor in text
          fallback = r'''CASE='批处理失败必须自动回退逐档路径'
          rm -f "$MOD/system/fonts"/LuoShu-*.ttf "$MOD/system/fonts"/LuoShuMono-*.ttf
          : > "$CALLS"
          _luoshu_font_config_exec() {
              _tool="${1##*/}"
              printf '%s %s\n' "$_tool" "${2:-}" >> "$CALLS"
              _jobs=''
              _out=''
              _is_batch=0
              while [ "$#" -gt 0 ]; do
                  case "$1" in
                      --batch) _jobs="$2"; _is_batch=1; shift 2 ;;
                      --output) _out="$2"; shift 2 ;;
                      *) shift ;;
                  esac
              done
              if [ "$_tool" = font_instance.py ] && [ "$_is_batch" -eq 1 ]; then
                  return 9
              fi
              if [ -n "$_out" ]; then
                  dd if=/dev/zero of="$_out" bs=4096 count=1 2>/dev/null
              fi
              [ -n "$_jobs" ] || return 0
              while IFS="$(printf '\t')" read -r _a _b _rest; do
                  [ -n "$_b" ] || continue
                  dd if=/dev/zero of="$_b" bs=4096 count=1 2>/dev/null
              done < "$_jobs"
              return 0
          }
          ok font_config_prepare_payload_weights
          for w in 100 200 300 400 500 600 700 800 900; do
              ok test -s "$MOD/system/fonts/LuoShu-${w}.ttf"
              ok test -s "$MOD/system/fonts/LuoShuMono-${w}.ttf"
          done
          _fallback_instances=$(grep -c '^font_instance.py' "$CALLS" | tr -d '[:space:]')
          [ "$_fallback_instances" -gt 1 ] || fail "批处理失败后没有进入逐档实例化路径"

          '''
          path.write_text(text.replace(anchor, fallback + anchor, 1))
          PY

      - name: Run targeted regressions
        shell: bash
        run: |
          set -euo pipefail
          sh -n common/font_finalize_hotfix.sh
          sh -n scripts/weight_prepare_batch_test.sh
          python3 -m py_compile common/font_instance.py common/font_name_normalize.py common/composite_font.py scripts/composite_validate_lazy_test.py
          sh scripts/weight_prepare_batch_test.sh
          python3 scripts/font_config_overlay_test.py
          python3 -m pip install --disable-pip-version-check -q fonttools
          python3 scripts/composite_validate_lazy_test.py

      - name: Commit hardened source and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'LuoShu CI'
          git config user.email 'actions@users.noreply.github.com'
          git add common/font_instance.py common/font_name_normalize.py common/font_finalize_hotfix.sh scripts/composite_validate_lazy_test.py scripts/weight_prepare_batch_test.sh
          git commit -m 'fix: harden batch fallback and lazy validation tests'
          rm -f .github/workflows/harden-latest-patch.yml
          git add -A
          git commit -m 'chore: remove temporary hardening workflow'
          git push origin HEAD:agent/latest-patch-hardening
