name: Android font contract experiment
on:
  workflow_dispatch:
  push:
    branches: [feat/universal-mixed-integration-20260930]
    paths:
      - experiments/android-font-contract/**
      - experiments/xml-first/**
      - .github/workflows/font-contract-experiment.yml
permissions:
  contents: read
concurrency:
  group: font-contract-experiment-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native-fonts:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: ''
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Generate original synthetic donor assets
        run: |
          python3 -m pip install --break-system-packages fonttools==4.63.0
          python3 experiments/android-font-contract/generate.py
          python3 experiments/xml-first/test_planner.py
          python3 -m unittest discover -s experiments/android-font-contract -p 'test*.py'
          python3 experiments/xml-first/test_style_expansion.py
          python3 experiments/xml-first/test_fixed_weight_match.py
          python3 scripts/stock_lower_cleanup_test.py
          python3 scripts/fixed_static_xml_router_test.py
          python3 scripts/fixed_static_xml_compiler_test.py
          python3 scripts/fixed_static_xml_pipeline_test.py
          python3 scripts/fixed_static_style_expansion_test.py
          python3 scripts/fixed_matching_xml_pipeline_test.py
      - name: Prepare CI-only Android x86 runtime
        run: sh experiments/android-font-contract/prepare_native_runtime.sh
      - name: Build CI-only font probe
        if: ${{ !(github.event_name == 'push' && github.event.before == 'b687b106dd9942cb038b1763294b5504ef5c81ab' && contains(github.event.head_commit.message, '[native-prepare-approved-once]')) }}
        working-directory: experiments/android-font-contract
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Require accelerated emulator
        id: accel
        env:
          KVM_APPROVED_FOR_THIS_RUN: ${{ github.event_name == 'push' && github.event.before == 'b687b106dd9942cb038b1763294b5504ef5c81ab' && contains(github.event.head_commit.message, '[kvm-approved-once]') }}
        shell: bash
        run: |
          if [ ! -r /dev/kvm ] || [ ! -w /dev/kvm ]; then
            if [ "$KVM_APPROVED_FOR_THIS_RUN" != true ]; then
              echo 'KVM unavailable; hardware test blocked before emulator startup' >&2
              exit 1
            fi
            test -c /dev/kvm
            command -v setfacl
            sudo setfacl -m "u:$(id -un):rw" /dev/kvm
          fi
          test -r /dev/kvm && test -w /dev/kvm
          echo 'disabled=false' >> "$GITHUB_OUTPUT"
      - name: Verify actual Android font rendering and reboot persistence
        uses: reactivecircus/android-emulator-runner@v2
        env:
          LUOSHU_DISPOSABLE_SYSTEM_TEST_APPROVED: ${{ github.event_name == 'push' && github.event.before == 'b687b106dd9942cb038b1763294b5504ef5c81ab' && contains(github.event.head_commit.message, '[system-test-approved-once]') }}
          LUOSHU_FONT_COPY_LABEL_TEST_APPROVED: ${{ github.event_name == 'push' && github.event.before == 'b687b106dd9942cb038b1763294b5504ef5c81ab' && contains(github.event.head_commit.message, '[font-label-approved-once]') }}
          LUOSHU_FRAMEWORK_XML_TEST_APPROVED: ${{ github.event_name == 'push' && github.event.before == 'b687b106dd9942cb038b1763294b5504ef5c81ab' && contains(github.event.head_commit.message, '[framework-xml-approved-once]') }}
          LUOSHU_STAGED_HOOK_TEST_APPROVED: ${{ github.event_name == 'push' && github.event.before == 'b687b106dd9942cb038b1763294b5504ef5c81ab' && contains(github.event.head_commit.message, '[staged-hooks-test-once]') }}
          LUOSHU_NATIVE_PREPARE_TEST_APPROVED: ${{ github.event_name == 'push' && github.event.before == 'b687b106dd9942cb038b1763294b5504ef5c81ab' && contains(github.event.head_commit.message, '[native-prepare-approved-once]') }}
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          ram-size: 2048M
          heap-size: 512M
          emulator-boot-timeout: 300
          disable-animations: false
          disable-linux-hw-accel: ${{ steps.accel.outputs.disabled }}
          emulator-options: -writable-system -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: sh experiments/android-font-contract/run_selected_experiment.sh
      - name: Save native evidence, including blocked capability gates
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Android-Font-Contract-${{ github.sha }}
          path: experiments/android-font-contract/output/
          if-no-files-found: warn
          retention-days: 14
